# Flatpak manifest für die Pulse SERVER-App (Self-Hosting-Kontrollpanel).
#
# Vereinfachte Variante des Client-Flatpaks (com.howispulse.Pulse.yml): KEIN
# GSR-Sidecar / FFmpeg / GPU-Screen-Recorder — der Server streamt nicht selbst
# (der allinone-Container tut's). Nur Electron 43 + das Server-esbuild-Bundle
# (PULSE_BUILD_MODE=server, enthält server.html) + Desktop-Integration.
#
# Build-Reihenfolge: ERST das Server-Bundle bauen (damit desktop/electron/dist
# die Server-Variate enthält — main.cjs mit __APP_MODE__='server' + server.html):
#   PULSE_BUILD_MODE=server pnpm --filter @dcc/desktop build:electron
# DANN den Flatpak bauen:
#   flatpak-builder --user --force-clean --install build/flatpak-server \
#     packaging/com.howispulse.PulseServer.yml
# Laufen:  flatpak run com.howispulse.PulseServer
app-id: com.howispulse.PulseServer
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
# zypak ersetzt Chromiums setuid-Sandbox (in Flatpak unbrauchbar) durch bubblewrap.
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: pulse-server
appstream-compose: false
separate-locales: false

finish-args:
  # Display (X11/XWayland + Wayland, --ozone-platform-hint=auto im Launcher).
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  # GPU: nur /dev/dri, nicht --device=all. Der Launcher startet mit
  # --disable-gpu (Software-Rendering — die Server-App ist ein schmales
  # Kontrollpanel, gestreamt wird im Container). Am 2026-07-09 kamen
  # --device=all und --disable-gpu GEMEINSAM gegen ein weißes Fenster bzw.
  # einen GPU-Prozess-Absturz (exit 133) herein; ob --disable-gpu allein schon
  # reicht, wurde nie getrennt gemessen. /dev/dri bleibt deshalb als Polster
  # für Mesa/EGL im Wayland-Pfad. --device=all hätte zusätzlich Webcams,
  # NVIDIA-Knoten und jedes andere Gerät freigegeben — gebraucht wird davon
  # bei abgeschalteter GPU nichts. (Ungetestet: Start auf NVIDIA-proprietär
  # ohne /dev/nvidia*.)
  - --device=dri
  # Login bei howispulse.com + Pulse-Cloud-API + Server-Netzwerk.
  - --share=network
  # Der Server-Container läuft im HOST-Podman/-Docker (`flatpak-spawn --host
  # podman|docker`, containerRuntime.ts). Bewusste Entscheidung: dieser
  # Bus-Name ist faktisch ein Ausbruch aus der Sandbox (flatpak-spawn --host
  # führt beliebige Befehle als der Nutzer aus) — anders lässt sich ein
  # Container auf dem Host aber nicht verwalten; ein Podman im Sandkasten ist
  # fragil (rootless-Namespaces in bwrap) und hätte keinen Host-Netzzugang für
  # die Medienports. Boxbuddy-Muster, Flathub-akzeptiert.
  - --talk-name=org.freedesktop.Flatpak
  # KEIN --filesystem=host (bis 2026-10-08 stand es hier, begründet mit dem
  # Podman-Socket — der wird nie direkt angesprochen, nur über flatpak-spawn
  # auf dem Host). Was die App an Dateien braucht, liegt ohne Freigabe offen:
  #  - userData (Store, container.env, Wegwerf-Registry-Anmeldung) liegt unter
  #    ~/.var/app/com.howispulse.PulseServer/ — innen und aussen derselbe
  #    Pfad, deshalb findet der Host-Podman die Dateien, die die App ihm per
  #    `--env-file`/`--authfile` nennt (registryAuth.ts).
  #  - Export/Import der Serverdaten: Dateidialog (Portal), den Strom schreibt
  #    bzw. liest die App selbst (rtExecToFile/rtExecFromFile), der Host-Podman
  #    sieht den Zielpfad nie.
  #  - Autostart schreibt ~/.config/autostart/pulse-server.desktop direkt
  #    (autostart.ts, os.homedir()) — genau dieses eine Verzeichnis:
  - --filesystem=xdg-config/autostart:create
  # Schlüsselbund für safeStorage (Zugangsdaten der Instanz, client_secret).
  # Ohne diese Namen findet Chromium keinen Secret-Service, wählt
  # `basic_text` (fest eingebautes Passwort) und die Geheimnisse liegen
  # faktisch im Klartext im Store. Der Launcher wählt dazu den Speicher
  # (--password-store), weil Chromium ausserhalb von GNOME/KDE sonst
  # ebenfalls basic_text nimmt.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.kde.kwalletd5
  # System-Tray + ggf. Notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  - name: pulse-server
    buildsystem: simple
    build-commands:
      # Electron 43-Runtime (chrome-sandbox in Flatpak nutzlos — zypak übernimmt).
      - install -d /app/electron
      - cp -a electron/. /app/electron/
      - rm -f /app/electron/chrome-sandbox
      # Die Server-App (esbuild-Bundle, Server-Modus). package.json trägt
      # desktopName → Wayland-app_id = com.howispulse.PulseServer.
      - install -d /app/pulse-server
      - install -m644 app-dist/main.cjs /app/pulse-server/main.cjs
      - install -m644 app-dist/preload.cjs /app/pulse-server/preload.cjs
      - install -m644 app-dist/server.html /app/pulse-server/server.html
      # server.js: die aus server.html ausgelagerte UI-Logik (Größen-Policy).
      - install -m644 app-dist/server.js /app/pulse-server/server.js
      - install -m644 packaging/pulse-server.package.json /app/pulse-server/package.json
      # Eigenes Icon (Herzschlag) — Client und Server-App lägen sonst mit
      # identischem Symbol nebeneinander im Anwendungsmenü/Dock. Zweimal
      # installiert: /app/icon.png (Alt-Referenzen) + /app/icon-server.png
      # (main.cjs sucht `__dirname/../icon-server.png` im Server-Modus).
      - install -Dm644 icon-server.png /app/icon.png
      - install -Dm644 icon-server.png /app/icon-server.png
      # Tray-Symbole: `tray.ts` probiert zuerst `process.resourcesPath/tray/…`,
      # das im Flatpak auf /app/electron/resources zeigt. Ohne sie liefert
      # nativeImage ein leeres Bild → der StatusNotifier zeigt ein
      # Platzhalter-/Fehlersymbol statt gar nichts.
      - install -Dm644 tray/tray-server-normal.png /app/electron/resources/tray/tray-server-normal.png
      - install -Dm644 tray/tray-server-normal@2x.png /app/electron/resources/tray/tray-server-normal@2x.png
      # Launcher + Desktop-Integration
      - install -Dm755 packaging/launcher-server.sh /app/bin/pulse-server
      - install -Dm644 packaging/com.howispulse.PulseServer.desktop /app/share/applications/com.howispulse.PulseServer.desktop
      - install -Dm644 icon-server.png /app/share/icons/hicolor/512x512/apps/com.howispulse.PulseServer.png
      # Skalierbares Icon zusätzlich — Anwendungsmenüs bevorzugen es gegenüber
      # der 512er-PNG und rastern nicht sichtbar herunter.
      - install -Dm644 packaging/com.howispulse.PulseServer.svg /app/share/icons/hicolor/scalable/apps/com.howispulse.PulseServer.svg
      - install -Dm644 packaging/com.howispulse.PulseServer.metainfo.xml /app/share/metainfo/com.howispulse.PulseServer.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/electron/electron/releases/download/v43.0.0/electron-v43.0.0-linux-x64.zip
        sha256: 53b5562e17ed87b728e01318fa4e7f9040709eafa8f2e09b327362e6abaf961c
        dest: electron
        # Electron-Release-Zip ist ein flacher Baum — strip-components 0 (sonst
        # fehlen resources/default_app.asar + locales/*.pak → Exit 1 vor main.cjs).
        strip-components: 0
      - type: dir
        path: ../desktop/electron/dist
        dest: app-dist
      # Einzeln statt `type: dir ../packaging`: das ganze Verzeichnis zog
      # auch `packaging/.gpg/` (den privaten Signaturschlüssel, lokal von
      # publish.fish dort angelegt) in den Bauordner. Ausserdem steht jede
      # Datei hier zugleich als Pfad-Filter in flatpak.yml — eine Liste, die
      # man gegeneinander lesen kann, statt eines Verzeichnisses, das
      # stillschweigend alles mitnimmt.
      - type: file
        path: launcher-server.sh
        dest: packaging
      - type: file
        path: com.howispulse.PulseServer.desktop
        dest: packaging
      - type: file
        path: com.howispulse.PulseServer.svg
        dest: packaging
      - type: file
        path: com.howispulse.PulseServer.metainfo.xml
        dest: packaging
      - type: file
        path: pulse-server.package.json
        dest: packaging
      - type: file
        path: ../desktop/electron/icon-server.png
      - type: dir
        path: ../desktop/build-resources/tray
        dest: tray
