# Flatpak manifest for the Pulse desktop app (T6).
#
# What's inside the Flatpak:
#   - the Electron 43 runtime (bundled binary from the GitHub release)
#   - electron/dist/{main,preload}.cjs  (esbuild-bundled — run `pnpm --filter @dcc/desktop build:electron` first)
#   - the pure-stdlib Python GSR sidecar (streaming/gsr-sidecar/*.py) → /app/share/pulse/gsr-sidecar/
#   - a custom-built `gpu-screen-recorder` (FFmpeg-with-NVENC + GSR-from-source + the FLV-Opus / Vulkan-stub patches),
#     the FFmpeg/GSR module stack lifted verbatim from the proven gsr-streamer manifest.
#   - der Rust-Linux-HQ-Sidecar (senden) und der native HQ-Player (zuschauen),
#     beide gegen dasselbe gebündelte FFmpeg gelinkt.
#
# Das gebündelte FFmpeg trägt zwei Dinge, die es sonst nirgends gibt und die
# beim Kürzen nicht wegfallen dürfen: den VAAPI-Intra-Refresh-Patch (sonst haben
# AMD/Intel die Betriebsart nicht) und eine Decoder-Liste (sonst zeigt der
# Player nie ein Bild). Beides steht am ffmpeg-Modul ausführlich begründet.
#
# What's NOT inside: the web frontend. The packaged app loads https://howispulse.com remotely
# (electron/main.ts → PROD_URL, since no PULSE_DEV_URL is set), so web-side fixes are live without a new
# Flatpak — only native changes (Electron main/preload, the sidecar, the GSR binary) need a rebuild.
#
# Local build/install (user scope, no sudo):  packaging/build.fish
# (or:  pnpm --filter @dcc/desktop build:electron
#       flatpak-builder --user --install-deps-from=flathub --force-clean --install build/flatpak packaging/com.howispulse.Pulse.yml )
app-id: com.howispulse.Pulse
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
# SDK-Extensions für den experimentellen Rust-Linux-HQ-Sidecar-Build:
# rust-stable = cargo/rustc, llvm18 = libclang für bindgen (ffmpeg-sys,
# pipewire-sys, libspa-sys). Nur zur Build-Zeit; nichts davon landet im App.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm18
# zypak: replaces Chromium's setuid sandbox (which can't work inside a Flatpak)
# with a bubblewrap-based one. The launcher runs Electron via `zypak-wrapper`.
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: pulse
# Skip the AppStream "compose" step at the end of the build. Ubuntu 24.04's
# appstreamcli 1.0.2 (used on the GitHub runner) raises an opaque
# "file-read-error" on our component that newer versions (1.1.x) don't —
# investigation showed it fails after reading both metainfo and desktop file,
# without naming the offending path even in --verbose mode. The
# metainfo.xml + .desktop + icons still ship in the Flatpak; we just skip the
# precomputed appstream catalog (consumers can still build it themselves with
# `flatpak make-current` / GNOME Software regenerates it).
appstream-compose: false
# Don't split locales into a separate `.Locale` extension. flatpak-builder
# would auto-generate one from `/app/share/locale/<lang>/…`, but Electron's
# translations live as `/app/electron/locales/<lang>.pak` — outside that path
# — so the extension always ends up empty. build-update-repo's prune then
# drops the empty ref from the published repo, while clients that grabbed it
# on first install keep referencing it and warn `No such ref … in remote` on
# every update. Skipping the split makes the warning disappear for new
# installs; existing installs need a one-time `flatpak uninstall --user
# com.howispulse.Pulse.Locale` to clear the orphan.
separate-locales: false

finish-args:
  # Display. Mount both the X11 (XWayland) and the Wayland socket; the launcher
  # passes `--ozone-platform-hint=auto` so Electron picks native Wayland when a
  # Wayland session is available and falls back to X11/XWayland otherwise.
  # `--socket=x11` (not `fallback-x11`) so XWayland is reachable on a Wayland
  # session too — used as the fallback and by the `PULSE_OZONE=x11` override.
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  # Network: the remote web app, REST/WSS to the Pulse services, LiveKit (voice/WebRTC),
  # WHEP playback, and the RTMPS push from GSR.
  - --share=network
  # Audio: voice + GSR desktop/app audio capture
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0:ro
  # Read-only access to the user's files so drag-&-drop + paste of an *on-disk*
  # file into the chat can read the bytes for upload. Without this the sandbox
  # hands dropped files to the renderer as 0 bytes (the drop overlay appears but
  # nothing uploads). Read-only: the app can read files to send them, never
  # modify or delete them. Pasted *images* are inline clipboard bytes and need
  # no file access — they work without this.
  - --filesystem=host:ro
  # GPU for NVENC / VAAPI. NVIDIA's /dev/nvidia* sit outside /dev/dri → need --device=all.
  - --device=all
  # Wayland screencast portal — GSR `-w portal` capture + Chromium's getDisplayMedia (browser screen share)
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.ScreenCast
  # System tray (Discord-style close-to-tray). KDE/Plasma/Hyprland use the
  # StatusNotifier protocol; without this bus name Electron's Tray silently
  # falls back to nothing on Wayland sessions. Notifications use the same
  # portal that's already mounted above.
  - --talk-name=org.kde.StatusNotifierWatcher
  # App-Hosting: der Server-Container läuft im HOST-Podman (nested Podman im
  # Sandbox ist fragil). `flatpak-spawn --host podman …` braucht diesen Bus-Namen
  # (Boxbuddy-Muster, Flathub-akzeptiert). containerRuntime.ts nutzt ihn nur,
  # wenn der User App-Hosting startet.
  - --talk-name=org.freedesktop.Flatpak
  # The sidecar's stderr is read line-by-line by the Electron bridge — flush promptly
  - --env=PYTHONUNBUFFERED=1

# NB: do NOT add an `add-extensions` block for org.freedesktop.Platform.GL — the
# org.freedesktop.Platform//24.08 runtime already declares it (with the right
# directory/merge-dirs). Overriding it breaks EGL on Mesa. (Same as the official
# GSR Flathub manifest — it inherits GL from the runtime.)

modules:
  # ── FFmpeg with NVENC + CUDA + VAAPI + Vulkan ───────────────────────────────
  # The runtime's FFmpeg has no NVENC, so GSR would fail with "h264 not supported
  # by hardware". Build our own. Spec lifted from the official GSR Flathub manifest.
  - name: ffmpeg
    config-opts:
      # --enable-version3 ist Pflicht fuer OpenSSL 3 (Apache-2.0 vertraegt sich
      # mit v3, nicht mit v2). --enable-gpl brauchen wir nicht — Begruendung
      # weiter unten bei libx264.
      - --enable-version3
      - --enable-shared
      - --disable-static
      - --disable-debug
      - --disable-doc
      - --disable-programs
      # Decoder: alle aus, dann gezielt die auf, die der native Player braucht.
      #
      # **Ohne diese Liste zeigt der Player NIE ein Bild.** Er sucht seinen
      # Decoder zur Laufzeit (`decode.rs::candidates`, Hardware zuerst, Software
      # dahinter); findet er keinen einzigen, endet die Sitzung mit `failed` und
      # jeder Zuschauer landet auf dem `<video>`-Weg — auf einer Maschine mit
      # tadelloser GPU genauso wie ohne. Bis 2026-08-03 stand hier nur
      # `--disable-decoders`, weil das Flatpak ausschliesslich encodiert hat.
      #
      # `av1`/`h264` sind ZUGLEICH der Software-Rueckfall UND der Hardware-Weg
      # auf AMD/Intel: VAAPI ist kein eigener Decoder, sondern ein hwaccel auf
      # dem nativen (`--enable-vaapi` weiter unten). Genau diese Verwechslung
      # hat den Player bis 2026-08-01 auf AMD still in Software rechnen lassen.
      # `libdav1d` ist der schnelle AV1-Software-Weg — der native AV1-Decoder
      # ist um ein Vielfaches langsamer, und ohne dav1d waere Software-Decode
      # kein brauchbarer Rueckfall, sondern nur ein nomineller. Die Runtime
      # bringt `libdav1d.so.7` bereits mit.
      # `opus` fuer den Ton, `*_cuvid` fuer NVIDIA-Zuschauer.
      #
      # 10 bit braucht hier NICHTS Zusaetzliches: die Bittiefe steckt im
      # `av1`-Decoder bzw. im VAAPI-hwaccel, und ob die Karte sie traegt,
      # entscheidet der Player zur Laufzeit selbst.
      - --disable-decoders
      - --enable-decoder=av1,h264,opus,libdav1d,av1_cuvid,h264_cuvid
      - --enable-libdav1d
      - --enable-cuvid
      - --enable-nvdec
      - --disable-indevs
      - --disable-vdpau
      - --disable-filters
      - --disable-amf
      - --disable-audiotoolbox
      - --disable-videotoolbox
      - --disable-sdl2
      - --disable-autodetect
      - --disable-avdevice
      - --disable-dwt
      - --disable-lsp
      - --disable-faan
      - --disable-iamf
      - --disable-alsa
      - --disable-iconv
      - --disable-sndio
      - --disable-xlib
      - --disable-cuda-llvm
      # amix: GSR (Desktop+Mikro-Mix). buffer/buffersink/hwmap/scale_vaapi: der
      # Rust-Sidecar-VAAPI-Pfad (DMABUF→DRM_PRIME→hwmap→scale_vaapi-CSC) — ohne
      # sie scheitert der AMD/Intel-Encode ("Filter fehlt").
      - --enable-filter=amix,buffer,buffersink,hwmap,scale_vaapi
      - --enable-nvenc
      - --enable-ffnvcodec
      - --enable-libopus
      - --enable-vaapi
      # libdrm ist Pflicht für den DRM-hwdevice-Kontext (AV_HWDEVICE_TYPE_DRM)
      # des Rust-Sidecars: --disable-autodetect schaltet es sonst ab, und
      # av_hwdevice_ctx_create(DRM) failt dann irreführend mit rc=-12 (ENOMEM).
      # GSR braucht das nicht (nutzt AV_HWDEVICE_TYPE_VAAPI direkt) — deshalb
      # fiel es dort nie auf.
      - --enable-libdrm
      - --enable-vulkan
      - --enable-openssl
      # BEWUSST KEIN --enable-libx264 (und deshalb auch kein --enable-gpl, das
      # nur dafuer da war: x264 ist GPL-2.0+, FFmpeg verweigert das Linken ohne
      # den Schalter. Ohne x264 hat --enable-gpl keine Wirkung mehr — verifiziert
      # per Symbol-Diff, libavcodec/libavfilter/libavformat sind mit und ohne
      # identisch. FFmpeg ist damit LGPLv3 statt GPLv3):
      # x264 ist ein reiner Software-H.264-Encoder OHNE AVC-Patentlizenz — ihn
      # mitzuliefern macht uns zum Distributor einer eigenen AVC-Implementierung.
      # Encodiert wird bei uns ausschliesslich per h264_nvenc/h264_vaapi bzw.
      # av1_*, deren Lizenz beim GPU-Hersteller liegt. Genutzt wurde x264 ohnehin
      # nie: GSR greift nur im `-encoder cpu`-Modus darauf zu, den unser argv
      # (stream_controller.py) nicht setzt, und der Rust-Sidecar kennt nur die
      # vier HW-Encoder. Verifiziert 2026-07-24: Build ohne x264 liefert
      # bit-identische libav*-Symbole. Beim Abgleich mit dem gsr-streamer-
      # Manifest (von dem dieser Stack stammt) NICHT versehentlich zurückholen.
    cleanup:
      - /share/ffmpeg/examples
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n8.1.1
        commit: 239f2c733de417201d7ad3b3b8b0d9b63285b2b1
      # Rollender Intra-Refresh fuer die VAAPI-Encoder. FFmpeg reicht die
      # VA-API-Option in KEINER Version durch, auch nicht in master — ohne
      # diesen Patch haben AMD- und Intel-Nutzer die Betriebsart schlicht nicht,
      # und der Sidecar verweigert den Start, statt still Keyframes zu fahren
      # (`encode/opts.rs::intra_refresh_pruefen`). Auf NVIDIA wird er nicht
      # gebraucht, `*_nvenc` hat die Option upstream.
      #
      # Begruendung, Messreihe und Bauanleitung: `streaming/ffmpeg-patches/`.
      # Der Patch ist LGPL (von FFmpeg abgeleitet), NICHT Pulse-lizenziert —
      # eigene LICENSE liegt daneben. Gegen genau den Commit oben geprueft;
      # beim Anheben von FFmpeg zuerst `git apply --check` gegen den neuen Tag.
      #
      # Dev baut denselben Commit mit demselben Patch
      # (`streaming/ffmpeg-patches/bootstrap-ffmpeg.sh`) — hier gemessene Zahlen
      # gelten deshalb auch fuer die ausgelieferte App.
      - type: patch
        path: ../streaming/ffmpeg-patches/0001-vaapi_encode-rollender-intra-refresh.patch
    modules:
      - name: ffnvcodec
        no-autogen: true
        make-install-args:
          - PREFIX=${FLATPAK_DEST}
        cleanup:
          - '*'
        sources:
          - type: git
            url: https://github.com/FFmpeg/nv-codec-headers.git
            tag: n13.0.19.0
            commit: e844e5b26f46bb77479f063029595293aa8f812d

  # ── gpu-screen-recorder (custom build: FLV-Opus whitelist + Vulkan-encoder stub + portal-cursor EMBEDDED) ──
  # The Vulkan-encoder stub is harmless — Pulse uses NVENC/VAAPI, never Vulkan encode.
  # Pinned: upstream force-pushes master and our patches are line-anchored, so a
  # moving HEAD breaks the Flatpak CI. Bump deliberately when refreshing GSR;
  # re-run `patch -p1 --dry-run < streaming/patches/000*.patch` against the new
  # tree first and rewrite the patch if upstream rearranged the source.
  - name: gpu-screen-recorder
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: git
        url: https://repo.dec05eba.com/gpu-screen-recorder
        commit: 0349083cfe4578dbc8bc600e31187e8e09318add
      - type: patch
        path: ../streaming/patches/0001-opus-flv-whitelist.patch
      - type: patch
        path: ../streaming/patches/0002-stub-vulkan-encoder.patch
      - type: patch
        path: ../streaming/patches/0003-portal-cursor-embedded.patch

  # ── Rust-Linux-HQ-Sidecar (Standard-Aufnahmeweg seit 2026-07-17) ────────────
  # Baut das Rust-Binary → /app/bin/pulse-linux-hq-sidecar. sidecar.ts nimmt es
  # standardmässig; der Store-Key useLegacyGsrSidecar=true ist die Notbremse
  # zurück auf den Python/GSR-Weg (Kompatibilitäts-Tab). Fehlt das Binary, fällt
  # sidecar.ts automatisch auf GSR zurück. Linkt gegen das oben gebaute
  # ffmpeg-Modul via pkg-config (/app/lib/pkgconfig ist im default PKG_CONFIG_PATH).
  # libEGL/libcuda werden zur LAUFZEIT per dlopen geladen (GL-Extension) — kein
  # Build-Link. Offline-Cargo: linux-hq-sidecar-cargo-sources.json (via
  # flatpak-cargo-generator aus Cargo.lock); Crates → cargo/vendor, config →
  # cargo/config, daher CARGO_HOME auf <builddir>/cargo.
  - name: pulse-linux-hq-sidecar
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm18/bin
      env:
        CARGO_HOME: /run/build/pulse-linux-hq-sidecar/cargo
        LIBCLANG_PATH: /usr/lib/sdk/llvm18/lib
    build-commands:
      # Gebaut wird IM Unterverzeichnis, nicht im Bauwurzel — s. den Kommentar
      # bei den `dir`-Quellen unten. `cargo/` bleibt an der Wurzel liegen, wo
      # CARGO_HOME (absoluter Pfad, oben) es erwartet.
      - cd linux-hq-sidecar && cargo --offline build --release --verbose
      - install -Dm755 linux-hq-sidecar/target/release/pulse-linux-hq-sidecar /app/bin/pulse-linux-hq-sidecar
    sources:
      # Liegt seit 2026-07-29 IM Repo (vorher eigenes Repo + fest gepinnter
      # Commit). Damit löst eine Sidecar-Änderung wieder automatisch einen
      # Flatpak-Build aus — vorher musste der SHA hier von Hand nachgezogen
      # werden, und genau das war der Zustand: der Pin stand monatelang auf
      # einem Stand ohne die Latenz-Verbesserungen.
      # Bleibt Handarbeit: ändert sich `Cargo.lock`, muss
      # `linux-hq-sidecar-cargo-sources.json` neu generiert werden
      # (flatpak-cargo-generator) — der Flatpak baut Cargo offline.
      #
      # ── Seit 2026-08-20 liegen hier VIER Verzeichnisse ───────────────────
      # Der Sidecar hängt per Pfad-Abhängigkeit an geteilten Crates
      # (`streaming/pulse-redact`, `streaming/pulse-zeitbasis`,
      # `streaming/pulse-whip` und weitere), die er sich mit dem Windows- und
      # dem mac-Sidecar teilt. `type: dir` kopiert **nur den genannten Pfad**;
      # ohne einen eigenen Eintrag je Crate zeigte `path = "../…"` im
      # Bauordner ins Leere — und weil der Flatpak `cargo --offline` baut,
      # gibt es kein Nachladen, der Bau bricht. Windows und macOS bauen
      # normal und merken davon nichts; der Fehler träfe allein den Flatpak,
      # und erst in CI.
      #
      # Deshalb `dest:` auf jeder Seite: die Geschwister-Lage aus dem Repo
      # (`streaming/linux-hq-sidecar` neben `streaming/pulse-redact`,
      # `streaming/pulse-zeitbasis` und `streaming/pulse-whip`) wird im
      # Bauordner nachgebaut, damit `../pulse-redact`/`../pulse-zeitbasis`/
      # `../pulse-whip` dort dasselbe bedeuten wie hier. Kommt eine geteilte
      # Crate dazu, gehört sie hierher — sonst bricht der Flatpak-Bau als
      # einziger.
      #
      # Die Sources-JSON muss dafür NICHT neu erzeugt werden: weder
      # `pulse-redact` noch `pulse-zeitbasis` haben externe Abhängigkeiten.
      # `pulse-whip` hat welche (`webrtc`, `anyhow`), aber beide stehen schon
      # in exakt dieser Fassung in allen drei Sidecars und damit bereits in
      # `linux-hq-sidecar-cargo-sources.json` (geprüft: `webrtc-0.17.x` und
      # `anyhow-1.0.x` sind enthalten) — es kommt also kein Crate von
      # crates.io hinzu. Erst eine geteilte Crate mit einer FREMDABHÄNGIGKEIT,
      # die noch in keinem der drei Sidecars steckt, verlangt den
      # Generator-Lauf (flatpak-cargo-generator).
      - type: dir
        path: ../streaming/linux-hq-sidecar
        dest: linux-hq-sidecar
        # `dir` kopiert das Verzeichnis WÖRTLICH — `.gitignore` gilt hier nicht.
        # Ohne dieses `skip` wandern die lokalen Bauartefakte des Entwicklers in
        # jeden Flatpak-Bau: 1,5 GB, die anschliessend nichts tun (der Bau
        # laeuft in einem anderen Praefix und uebersetzt ohnehin neu).
        skip:
          - target
      - type: dir
        path: ../streaming/pulse-redact
        dest: pulse-redact
        skip:
          - target
      - type: dir
        path: ../streaming/pulse-zeitbasis
        dest: pulse-zeitbasis
        skip:
          - target
      - type: dir
        path: ../streaming/pulse-whip
        dest: pulse-whip
        skip:
          - target
      - linux-hq-sidecar-cargo-sources.json

  # ── Nativer HQ-Player (Zuschauer-Seite) ────────────────────────────────────
  # Baut das Rust-Binary → /app/bin/pulse-player. GENAU DIESER PFAD ist der, den
  # `desktop/electron/player.ts::resolvePlayerBinary` in verpackten Builds
  # sucht; er ist Teil des Vertrags, nicht frei wählbar.
  #
  # Wofür: WHEP direkt empfangen, dekodieren und in einem eigenen Fenster
  # zeigen, statt über Chromiums `<video>`. Der einzige Weg zu AV1 in 10 bit —
  # Chromium legt seinen Puffer immer als 8 bit an. Fehlt das Binary, fällt die
  # Kachel still auf den `<video>`-Weg zurück (`useNativePlayback.svelte.ts`),
  # es geht also nichts kaputt; es fehlt nur die bessere Wiedergabe.
  #
  # Linkt gegen das oben gebaute ffmpeg-Modul. **Dessen Decoder-Liste ist die
  # Bedingung dafür, dass dieses Modul überhaupt etwas nützt** — s. den langen
  # Kommentar bei `--enable-decoder` weiter oben.
  #
  # Vulkan (wgpu) und ALSA (cpal) kommen zur Laufzeit aus der Runtime; die
  # nötigen Rechte hat der Player als Kind von Electron in derselben Sandbox
  # (`--device=all`, `--socket=pulseaudio`, `--share=network`).
  # **Eigene Rust-Toolchain, NICHT die SDK-Extension** — der einzige Punkt, an
  # dem dieses Modul vom Sidecar daneben abweicht, und der Grund dafuer ist
  # hart: `org.freedesktop.Sdk.Extension.rust-stable//24.08` liefert rustc
  # 1.89, die egui-0.35-Kette verlangt 1.92. Der Bau bricht sonst ab mit
  # „rustc 1.89.0 is not supported by the following packages".
  #
  # Drei Wege standen zur Wahl, zwei sind verworfen:
  # * `rust-nightly//24.08` haette gereicht (1.99), waere aber der einzige
  #   unpinnbare Baustein im ganzen Manifest — FFmpeg, GSR, webrtc-rs und
  #   MediaMTX haengen alle an festen Commits. Ein Nightly-Regress braeche den
  #   Flatpak-Bau zu einem beliebigen Zeitpunkt, ohne dass sich hier etwas
  #   geaendert haette.
  # * Runtime auf 25.08 anheben waere die saubere Dauerloesung, ist aber eine
  #   eigene Baustelle (BaseApp, GL-Extension, codecs-extra) und hat mit dem
  #   Player nichts zu tun.
  #
  # Also die offizielle Toolchain, auf Version UND Pruefsumme festgenagelt. Sie
  # wird in den BAU-Ordner ausgepackt, nicht nach /app — sie landet also nicht
  # in der ausgelieferten App. Beim Anheben: neue `sha256` aus
  # `https://static.rust-lang.org/dist/<datei>.sha256` holen.
  #
  # Warum 1.97.1: dieselbe Version, mit der hier lokal gebaut und gemessen wird
  # (Fedora 44). Ein Bau, der eine andere Toolchain benutzt als der, an dem die
  # Zahlen entstanden sind, waere eine unnoetige zweite Variable.
  - name: pulse-player
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm18/bin
      env:
        CARGO_HOME: /run/build/pulse-player/cargo
        LIBCLANG_PATH: /usr/lib/sdk/llvm18/lib
        # **Ausdruecklich, weil der Player sonst das FFMPEG DES SDK nimmt.**
        #
        # Bis zum 2026-08-07 stand hier nichts, und `ldd /app/bin/pulse-player`
        # zeigte `libavcodec.so.61 => /usr/lib/x86_64-linux-gnu` — die Fassung
        # des SDK (61.3.100), nicht die oben gebaute (62.28.101). Damit ging
        # alles an ihm vorbei, was diesem FFmpeg mitgegeben wird: die
        # cuvid-Decoder UND der h264-Decoder. Zu sehen war davon nichts; der
        # Player waehlte einfach `libdav1d` bzw. `libopenh264`, und beides sieht
        # im Log aus wie eine gewoehnliche Wahl. Gemessene Folge: auf einer
        # RTX 5080 lief AV1 in Software, obwohl NVDEC bereitstand.
        #
        # Die Ursache sitzt im SDK: dort ist `PKG_CONFIG_PATH` LEER, pkg-config
        # nimmt dann seinen eingebauten Standard — und der zeigt auf
        # /usr/lib/x86_64-linux-gnu/pkgconfig. Der Kommentar am Sidecar-Modul,
        # /app/lib/pkgconfig sei "im default PKG_CONFIG_PATH", traegt fuer
        # dieses Modul also nicht.
        #
        # `/app/lib/pkgconfig` steht zuerst, der Standardpfad bleibt dahinter
        # (sonst faenden andere Bibliotheken sich nicht mehr).
        #
        # **Pruefbar, nicht zu glauben:** nach einem Bau muss
        # `ldd /app/bin/pulse-player | grep libavcodec` auf /app/lib zeigen, und
        # `pulse-player --decoder` muss `av1_cuvid ... geht` melden.
        PKG_CONFIG_PATH: /app/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
        # **PKG_CONFIG_PATH allein genuegt NICHT — die REIHENFOLGE entscheidet.**
        #
        # Mit dem Pfad oben findet pkg-config /app, und der Bau uebergibt
        # `-L native=/app/lib`. Trotzdem blieb es beim FFmpeg des SDK, denn im
        # Binder-Aufruf stand DAVOR `-L native=/usr/lib/x86_64-linux-gnu` — der
        # Binder nimmt den ersten Treffer. Der Pfad kommt von `alsa-sys`
        # (Tonausgabe): dessen pkg-config-Abfrage liefert das Systemverzeichnis,
        # und der Crate wird vor `ffmpeg-sys-next` abgearbeitet.
        #
        # **Das ist zugleich die Erklaerung, warum der Sidecar nie betroffen
        # war**: er hat keine ALSA-Abhaengigkeit, bei ihm steht kein
        # Systempfad vor /app/lib. Die beiden Modulbloecke sehen deshalb gleich
        # aus und verhalten sich verschieden.
        #
        # RUSTFLAGS wird VOR den Pfaden aus den Bauskripten eingesetzt
        # (nachgemessen an `cargo build -v`), damit gewinnt /app/lib.
        RUSTFLAGS: -L native=/app/lib
    build-commands:
      # `--disable-ldconfig`: im Bau-Sandkasten gibt es kein schreibbares
      # /etc, das Skript scheiterte sonst am letzten Schritt.
      - ./rust-toolchain/install.sh --prefix=$PWD/rust --disable-ldconfig
        --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu
      - PATH="$PWD/rust/bin:$PATH" cargo --offline build --release --verbose
      - install -Dm755 target/release/pulse-player /app/bin/pulse-player
    sources:
      - type: archive
        url: https://static.rust-lang.org/dist/rust-1.97.1-x86_64-unknown-linux-gnu.tar.xz
        sha256: 88f28fa9af20594179f85d6df67078dfd6fa93e2f6da5e1e9b0ac4997988ca4f
        dest: rust-toolchain
      - type: dir
        path: ../streaming/pulse-player
        # `dir` kopiert wörtlich, `.gitignore` gilt hier NICHT — und beide
        # Ausnahmen sind hier nicht bloss Ballast:
        #
        # * `target` sind die Bauartefakte des Entwicklers (2,8 GB), die im
        #   Flatpak-Bau nichts verloren haben.
        # * `vendor` ist der bereits ausgecheckte und GEPATCHTE webrtc-rs-Zweig.
        #   Bliebe er stehen, liefe die `git`-Quelle unten in genau dieses
        #   Verzeichnis und die Patches darunter fänden ihre Änderung schon vor:
        #   „Reversed (or previously applied) patch detected", Bau abgebrochen.
        #   Genau so gescheitert beim ersten Versuch am 2026-08-03.
        skip:
          - target
          - vendor
      # Der gepatchte webrtc-rs-Zweig, den `Cargo.toml` über
      # `[patch.crates-io]` als PFAD einbindet — ohne ihn bricht cargo schon
      # beim Auflösen ab.
      #
      # **Warum hier und nicht über `scripts/bootstrap-webrtc.sh`:** das Skript
      # klont zur Bauzeit, und der Flatpak baut offline — Netzzugriff gibt es
      # nur, während flatpak-builder die Quellen HOLT, nicht mehr im
      # Build-Schritt. Deshalb wandert derselbe Zweig hier als Quelle hinein.
      # Das Skript bleibt für die Entwicklung; ändert sich der Stand, müssen
      # beide Stellen nachgezogen werden (Tag unten und `VERSION` im Skript).
      - type: git
        url: https://github.com/webrtc-rs/webrtc.git
        tag: v0.17.2
        commit: 1da3fe8ee84db8d266322cbcfcb357c745959a8e
        dest: vendor/webrtc-rs
      # Alle drei Patches, in derselben Reihenfolge wie im Skript. Der erste
      # macht die Ströme sichtbar, deren SSRC zu keiner angemeldeten Spur passt
      # (dort liegen die FlexFEC-Paritätspakete), der zweite setzt die
      # NACK-Sperrfrist, der dritte schließt eine Index-Panik im STAP-A-Zweig
      # (Bughunt 4, 2026-08-08: ein Paket mit einem überzähligen Byte ließ
      # `packet[curr_offset + 1]` über das Pufferende lesen — von jedem Sender
      # auslösbar). Fehlt einer, verhält sich der ausgelieferte Player anders
      # als der gemessene, und bei diesem hier fehlt nicht nur eine Messung,
      # sondern der Absturzschutz.
      - type: patch
        path: ../streaming/pulse-player/patches/0001-webrtc-rs-expose-undeclared-ssrc-streams.patch
        dest: vendor/webrtc-rs
      - type: patch
        path: ../streaming/pulse-player/patches/0002-nack-generator-resend-delay.patch
        dest: vendor/webrtc-rs
      - type: patch
        path: ../streaming/pulse-player/patches/0003-h264-stapa-bounds-check.patch
        dest: vendor/webrtc-rs
      # Wie beim Sidecar: ändert sich `Cargo.lock`, muss diese Datei neu
      # generiert werden (flatpak-cargo-generator).
      - pulse-player-cargo-sources.json

  # ── Pulse: the Electron shell + the Python sidecar + desktop integration ────
  - name: pulse
    buildsystem: simple
    build-commands:
      # Electron 43 runtime (bundled binary). chrome-sandbox is useless in a Flatpak
      # (setuid won't stick) — zypak handles sandboxing, so drop it.
      - install -d /app/electron
      - cp -a electron/. /app/electron/
      - rm -f /app/electron/chrome-sandbox
      # The Electron app (esbuild bundle). main.ts reads icon.png at ../icon.png
      # relative to its own dir → install it at /app/icon.png. The package.json
      # carries `desktopName: "com.howispulse.Pulse.desktop"` — Electron reads
      # that on startup and uses the stem as the Wayland app_id. Without it the
      # window's app_id falls back to "electron" and Wayland compositors
      # (Niri/Hyprland/Plasma) can't match it to the .desktop file → no icon in
      # the taskbar. (`--class=…` in the launcher only covers X11/XWayland.)
      - install -d /app/pulse
      - install -m644 app-dist/main.cjs /app/pulse/main.cjs
      - install -m644 app-dist/preload.cjs /app/pulse/preload.cjs
      - install -m644 packaging/pulse-app.package.json /app/pulse/package.json
      - install -Dm644 icon.png /app/icon.png
      # The pure-stdlib Python GSR sidecar — path matches sidecar.ts's Flatpak default.
      - install -d /app/share/pulse/gsr-sidecar
      - install -m644 gsr-sidecar/control.py gsr-sidecar/profiles.py gsr-sidecar/stream_controller.py gsr-sidecar/gsr_binary.py gsr-sidecar/redact.py gsr-sidecar/__init__.py /app/share/pulse/gsr-sidecar/
      # Launcher + desktop integration
      - install -Dm755 packaging/launcher.sh /app/bin/pulse
      - install -Dm644 packaging/com.howispulse.Pulse.desktop /app/share/applications/com.howispulse.Pulse.desktop
      - install -Dm644 packaging/com.howispulse.Pulse.svg /app/share/icons/hicolor/scalable/apps/com.howispulse.Pulse.svg
      # Also install the PNG icon at a hicolor size — appstreamcli compose on
      # older Ubuntu (24.04: appstream 0.16.x) raises file-read-error when only
      # an SVG icon is present. Newer 1.x is happy with SVG alone, but the CI
      # runner is on the older version.
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/com.howispulse.Pulse.png
      - install -Dm644 packaging/com.howispulse.Pulse.metainfo.xml /app/share/metainfo/com.howispulse.Pulse.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/electron/electron/releases/download/v43.0.0/electron-v43.0.0-linux-x64.zip
        sha256: 53b5562e17ed87b728e01318fa4e7f9040709eafa8f2e09b327362e6abaf961c
        dest: electron
        # The Electron release zip is a *flat* tree (electron, locales/, resources/,
        # *.pak, *.so, …). flatpak-builder defaults `strip-components` to 1 for
        # `type: archive` — that strips the leading `locales/` and `resources/` from
        # those entries, flattening default_app.asar and the locale .pak files into
        # the top level. Electron then can't find resources/default_app.asar or
        # locales/<locale>.pak and exits (code 1) before running main.cjs. Keep 0.
        strip-components: 0
      - type: dir
        path: ../desktop/electron/dist
        dest: app-dist
      - type: dir
        path: ../streaming/gsr-sidecar
        dest: gsr-sidecar
      - type: dir
        path: ../packaging
        dest: packaging
      - type: file
        path: ../desktop/electron/icon.png
