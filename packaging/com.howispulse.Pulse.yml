# Flatpak manifest for the Pulse desktop app (T6).
#
# What's inside the Flatpak:
#   - the Electron 42 runtime (bundled binary from the GitHub release)
#   - electron/dist/{main,preload}.cjs  (esbuild-bundled — run `pnpm --filter @dcc/desktop build:electron` first)
#   - the pure-stdlib Python GSR sidecar (streaming/gsr-sidecar/*.py) → /app/share/pulse/gsr-sidecar/
#   - a custom-built `gpu-screen-recorder` (FFmpeg-with-NVENC + GSR-from-source + the FLV-Opus / Vulkan-stub patches),
#     the FFmpeg/GSR module stack lifted verbatim from the proven gsr-streamer manifest.
#
# What's NOT inside: the web frontend. The packaged app loads https://howispulse.com remotely
# (electron/main.ts → PROD_URL, since no PULSE_DEV_URL is set), so web-side fixes are live without a new
# Flatpak — only native changes (Electron main/preload, the sidecar, the GSR binary) need a rebuild.
#
# Local build/install (user scope, no sudo):  packaging/build.fish
# (or:  pnpm --filter @dcc/desktop build:electron
#       flatpak-builder --user --install-deps-from=flathub --force-clean --install build/flatpak packaging/com.howispulse.Pulse.yml )
app-id: com.howispulse.Pulse
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
# zypak: replaces Chromium's setuid sandbox (which can't work inside a Flatpak)
# with a bubblewrap-based one. The launcher runs Electron via `zypak-wrapper`.
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: pulse
# Skip the AppStream "compose" step at the end of the build. Ubuntu 24.04's
# appstreamcli 1.0.2 (used on the GitHub runner) raises an opaque
# "file-read-error" on our component that newer versions (1.1.x) don't —
# investigation showed it fails after reading both metainfo and desktop file,
# without naming the offending path even in --verbose mode. The
# metainfo.xml + .desktop + icons still ship in the Flatpak; we just skip the
# precomputed appstream catalog (consumers can still build it themselves with
# `flatpak make-current` / GNOME Software regenerates it).
appstream-compose: false
# Don't split locales into a separate `.Locale` extension. flatpak-builder
# would auto-generate one from `/app/share/locale/<lang>/…`, but Electron's
# translations live as `/app/electron/locales/<lang>.pak` — outside that path
# — so the extension always ends up empty. build-update-repo's prune then
# drops the empty ref from the published repo, while clients that grabbed it
# on first install keep referencing it and warn `No such ref … in remote` on
# every update. Skipping the split makes the warning disappear for new
# installs; existing installs need a one-time `flatpak uninstall --user
# com.howispulse.Pulse.Locale` to clear the orphan.
separate-locales: false

finish-args:
  # Display. Mount both the X11 (XWayland) and the Wayland socket; the launcher
  # passes `--ozone-platform-hint=auto` so Electron picks native Wayland when a
  # Wayland session is available and falls back to X11/XWayland otherwise.
  # `--socket=x11` (not `fallback-x11`) so XWayland is reachable on a Wayland
  # session too — used as the fallback and by the `PULSE_OZONE=x11` override.
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  # Network: the remote web app, REST/WSS to the Pulse services, LiveKit (voice/WebRTC),
  # WHEP playback, and the RTMPS push from GSR.
  - --share=network
  # Audio: voice + GSR desktop/app audio capture
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0:ro
  # Read-only access to the user's files so drag-&-drop + paste of an *on-disk*
  # file into the chat can read the bytes for upload. Without this the sandbox
  # hands dropped files to the renderer as 0 bytes (the drop overlay appears but
  # nothing uploads). Read-only: the app can read files to send them, never
  # modify or delete them. Pasted *images* are inline clipboard bytes and need
  # no file access — they work without this.
  - --filesystem=host:ro
  # GPU for NVENC / VAAPI. NVIDIA's /dev/nvidia* sit outside /dev/dri → need --device=all.
  - --device=all
  # Wayland screencast portal — GSR `-w portal` capture + Chromium's getDisplayMedia (browser screen share)
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.ScreenCast
  # System tray (Discord-style close-to-tray). KDE/Plasma/Hyprland use the
  # StatusNotifier protocol; without this bus name Electron's Tray silently
  # falls back to nothing on Wayland sessions. Notifications use the same
  # portal that's already mounted above.
  - --talk-name=org.kde.StatusNotifierWatcher
  # The sidecar's stderr is read line-by-line by the Electron bridge — flush promptly
  - --env=PYTHONUNBUFFERED=1

# NB: do NOT add an `add-extensions` block for org.freedesktop.Platform.GL — the
# org.freedesktop.Platform//24.08 runtime already declares it (with the right
# directory/merge-dirs). Overriding it breaks EGL on Mesa. (Same as the official
# GSR Flathub manifest — it inherits GL from the runtime.)

modules:
  # ── FFmpeg with NVENC + CUDA + VAAPI + Vulkan ───────────────────────────────
  # The runtime's FFmpeg has no NVENC, so GSR would fail with "h264 not supported
  # by hardware". Build our own. Spec lifted from the official GSR Flathub manifest.
  - name: ffmpeg
    config-opts:
      - --enable-gpl
      - --enable-version3
      - --enable-shared
      - --disable-static
      - --disable-debug
      - --disable-doc
      - --disable-programs
      - --disable-decoders
      - --disable-indevs
      - --disable-vdpau
      - --disable-filters
      - --disable-amf
      - --disable-audiotoolbox
      - --disable-videotoolbox
      - --disable-sdl2
      - --disable-autodetect
      - --disable-avdevice
      - --disable-dwt
      - --disable-lsp
      - --disable-faan
      - --disable-iamf
      - --disable-alsa
      - --disable-iconv
      - --disable-sndio
      - --disable-xlib
      - --disable-cuda-llvm
      - --enable-filter=amix
      - --enable-nvenc
      - --enable-ffnvcodec
      - --enable-libopus
      - --enable-vaapi
      - --enable-vulkan
      - --enable-libx264
      - --enable-openssl
    cleanup:
      - /share/ffmpeg/examples
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n8.1.1
        commit: 239f2c733de417201d7ad3b3b8b0d9b63285b2b1
    modules:
      - name: ffnvcodec
        no-autogen: true
        make-install-args:
          - PREFIX=${FLATPAK_DEST}
        cleanup:
          - '*'
        sources:
          - type: git
            url: https://github.com/FFmpeg/nv-codec-headers.git
            tag: n13.0.19.0
            commit: e844e5b26f46bb77479f063029595293aa8f812d
      - name: libx264
        config-opts:
          - --disable-cli
          - --enable-shared
          - --disable-opencl
          - --disable-bashcompletion
          - --enable-strip
        no-autogen: true
        make-install-args:
          - PREFIX=${FLATPAK_DEST}
        sources:
          - type: git
            url: https://code.videolan.org/videolan/x264.git
            commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  # ── gpu-screen-recorder (custom build: FLV-Opus whitelist + Vulkan-encoder stub + portal-cursor EMBEDDED) ──
  # The Vulkan-encoder stub is harmless — Pulse uses NVENC/VAAPI, never Vulkan encode.
  # Pinned: upstream force-pushes master and our patches are line-anchored, so a
  # moving HEAD breaks the Flatpak CI. Bump deliberately when refreshing GSR;
  # re-run `patch -p1 --dry-run < streaming/patches/000*.patch` against the new
  # tree first and rewrite the patch if upstream rearranged the source.
  - name: gpu-screen-recorder
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: git
        url: https://repo.dec05eba.com/gpu-screen-recorder
        commit: 0349083cfe4578dbc8bc600e31187e8e09318add
      - type: patch
        path: ../streaming/patches/0001-opus-flv-whitelist.patch
      - type: patch
        path: ../streaming/patches/0002-stub-vulkan-encoder.patch
      - type: patch
        path: ../streaming/patches/0003-portal-cursor-embedded.patch

  # ── Pulse: the Electron shell + the Python sidecar + desktop integration ────
  - name: pulse
    buildsystem: simple
    build-commands:
      # Electron 42 runtime (bundled binary). chrome-sandbox is useless in a Flatpak
      # (setuid won't stick) — zypak handles sandboxing, so drop it.
      - install -d /app/electron
      - cp -a electron/. /app/electron/
      - rm -f /app/electron/chrome-sandbox
      # The Electron app (esbuild bundle). main.ts reads icon.png at ../icon.png
      # relative to its own dir → install it at /app/icon.png. The package.json
      # carries `desktopName: "com.howispulse.Pulse.desktop"` — Electron reads
      # that on startup and uses the stem as the Wayland app_id. Without it the
      # window's app_id falls back to "electron" and Wayland compositors
      # (Niri/Hyprland/Plasma) can't match it to the .desktop file → no icon in
      # the taskbar. (`--class=…` in the launcher only covers X11/XWayland.)
      - install -d /app/pulse
      - install -m644 app-dist/main.cjs /app/pulse/main.cjs
      - install -m644 app-dist/preload.cjs /app/pulse/preload.cjs
      - install -m644 packaging/pulse-app.package.json /app/pulse/package.json
      - install -Dm644 icon.png /app/icon.png
      # The pure-stdlib Python GSR sidecar — path matches sidecar.ts's Flatpak default.
      - install -d /app/share/pulse/gsr-sidecar
      - install -m644 gsr-sidecar/control.py gsr-sidecar/profiles.py gsr-sidecar/stream_controller.py gsr-sidecar/gsr_binary.py gsr-sidecar/redact.py gsr-sidecar/__init__.py /app/share/pulse/gsr-sidecar/
      # Launcher + desktop integration
      - install -Dm755 packaging/launcher.sh /app/bin/pulse
      - install -Dm644 packaging/com.howispulse.Pulse.desktop /app/share/applications/com.howispulse.Pulse.desktop
      - install -Dm644 packaging/com.howispulse.Pulse.svg /app/share/icons/hicolor/scalable/apps/com.howispulse.Pulse.svg
      # Also install the PNG icon at a hicolor size — appstreamcli compose on
      # older Ubuntu (24.04: appstream 0.16.x) raises file-read-error when only
      # an SVG icon is present. Newer 1.x is happy with SVG alone, but the CI
      # runner is on the older version.
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/com.howispulse.Pulse.png
      - install -Dm644 packaging/com.howispulse.Pulse.metainfo.xml /app/share/metainfo/com.howispulse.Pulse.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/electron/electron/releases/download/v42.0.1/electron-v42.0.1-linux-x64.zip
        sha256: e1b8b5b86d3fff69e2b3502586363d384085ee0578bd041fa5915fd0b557c4f1
        dest: electron
        # The Electron release zip is a *flat* tree (electron, locales/, resources/,
        # *.pak, *.so, …). flatpak-builder defaults `strip-components` to 1 for
        # `type: archive` — that strips the leading `locales/` and `resources/` from
        # those entries, flattening default_app.asar and the locale .pak files into
        # the top level. Electron then can't find resources/default_app.asar or
        # locales/<locale>.pak and exits (code 1) before running main.cjs. Keep 0.
        strip-components: 0
      - type: dir
        path: ../desktop/electron/dist
        dest: app-dist
      - type: dir
        path: ../streaming/gsr-sidecar
        dest: gsr-sidecar
      - type: dir
        path: ../packaging
        dest: packaging
      - type: file
        path: ../desktop/electron/icon.png
