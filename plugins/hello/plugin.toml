# Pulse Hello-Plugin — Schritt-4 Skelett.
#
# Beweist, dass der Plugin-Loader läuft: registriert eine "hello:ping"-Op,
# antwortet mit "hello:pong" zurück an den Client. KEINE Persistenz, kein
# Side-Effect — der Sinn ist Loader-Smoke-Test, nichts weiter.
#
# Spec für das Format: docs/PLUGIN_MANIFEST.md

[plugin]
name = "hello"
version = "0.1.0"
api = "1"
author = "Pulse Maintainer"
description = "Ping/Pong-Demo, beweist dass der Plugin-Loader läuft"

[plugin.scope]
type = "global"

[plugin.uses]
ws_ops = ["hello:ping"]
ws_emit_ops = ["hello:pong"]
channels = []
settings_sections = []
ui_slots = []

[plugin.entrypoints]
backend = "backend:register"
frontend = "frontend.ts"
