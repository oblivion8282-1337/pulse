[package]
name = "direct-adapter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = "0.3.32"
rcgen = { version = "0.13", features = ["pem"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stun = "0.17.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
webrtc = { version = "0.17.1", features = ["pem"] }
