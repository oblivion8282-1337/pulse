[package]
name = "direct-adapter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
rcgen = { version = "0.13", features = ["pem"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stun = "0.17.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "net"] }
webrtc = { version = "0.17.1", features = ["pem"] }
