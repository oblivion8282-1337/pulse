# Pulse self-host — Docker Compose behind an EXISTING reverse proxy.
#
# TLS is terminated by YOUR proxy (nginx, Traefik, Caddy, Nginx Proxy Manager, …)
# with your existing certificate. The Pulse container does not take 80/443 and
# only does HTTP routing on 127.0.0.1:8080 (PULSE_TLS_MODE=behind-proxy is set
# below — the .env does not need touching for it).
#
#   1. Get the ready-made config in the app: Settings → Your own server →
#      My Instances → "Set up server" → "Manual installation" → "Download .env".
#      It is filled in completely — the Cloud assigns instance ID, client ID and
#      secret on approval, and shows the secret exactly once.
#
#   2. Put the file here and rename it to .env:
#
#        mv ~/Downloads/pulse-instance-*.env .env
#
#   3. Sign in to the registry (otherwise: "pull access denied"):
#
#        grep -oP '^PULSE_CLOUD_CLIENT_SECRET=\K.*' .env \
#          | docker login registry.howispulse.com \
#              -u "$(grep -oP '^PULSE_CLOUD_CLIENT_ID=\K.*' .env)" --password-stdin
#
#   4. docker compose -f docker-compose.behind-proxy.yml up -d
#
#   5. Add ONE rule in your own proxy:
#        chat.example.com  →  http://127.0.0.1:8080
#      WebSocket upgrade must pass through (Nginx Proxy Manager: tick "WebSocket
#      Support"). If your proxy runs IN A CONTAINER it cannot reach the host's
#      127.0.0.1 — both then need a shared Docker network and the rule points at
#      the container name (`pulse:8080`). Copy-paste snippets for Caddy/nginx/NPM
#      and the container case: https://howispulse.com/self-host/guide →
#      "Add the proxy rule".
#
#   Optional switches (own certificate, PULSE_PUBLIC_IP behind NAT, backup
#   interval, log level) are in the commented reference at
#   https://howispulse.com/self-host/env.example — for looking up, not for
#   filling in.
#
# IMPORTANT: voice + HQ streaming run over WebRTC/UDP DIRECTLY to the server,
# bypassing the HTTP proxy — the UDP/media ports below must stay open. Without
# them chat and sign-in work, but voice calls do not.
#
# Updates: docker compose -f docker-compose.behind-proxy.yml pull && … up -d
# (deliberately no auto-updater container; see
# https://howispulse.com/self-host/guide → Running it).

services:
  pulse:
    # Self-host registry (per-instance credentials). Sign in once before the
    # first `docker compose pull` — see step 3 in the header above. Use
    # --password-stdin, not -p: the latter puts the secret into `ps aux` and
    # your shell history.
    image: registry.howispulse.com/pulse-allinone:stable
    container_name: pulse
    restart: unless-stopped
    env_file: .env
    environment:
      # Überstimmt die .env: kein ACME, kein 80/443 — nur HTTP auf 8080.
      PULSE_TLS_MODE: behind-proxy
    volumes:
      - pulse-data:/data
    ports:
      # Interner HTTP-Port für den externen Proxy (nur loopback gemappt).
      # Anderer Port gewünscht → PULSE_HTTP_PORT in der .env + Mapping anpassen.
      - "127.0.0.1:8080:8080"
      # Voice (LiveKit WebRTC) + HQ-Stream-ICE — NICHT proxy-bar, direkt offen.
      - "7882-7892:7882-7892/udp"
      # TURN/STUN (coturn) — NAT-Traversal für Voice
      - "3478:3478/tcp"
      - "3478:3478/udp"
      # HQ-Streaming RTMPS-Ingest
      - "1936:1936/tcp"
      # HQ-Stream-Wiedergabe (MediaMTX WebRTC/WHEP-ICE)
      - "8189:8189/udp"

volumes:
  pulse-data:
