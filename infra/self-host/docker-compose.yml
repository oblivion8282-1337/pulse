# Pulse Self-Host — Docker Compose (manueller Pfad, Standardfall: Auto-TLS).
#
#   1. Fertige Konfiguration in der App holen: Einstellungen → Self-Host →
#      Meine Instanzen → "Server einrichten" → "Manuelle Installation" →
#      ".env herunterladen". Sie ist komplett ausgefüllt — Instanz-ID,
#      Client-ID und Secret vergibt die Cloud bei der Freigabe, das Secret
#      zeigt sie genau einmal.
#
#   2. Die Datei hierher legen und in .env umbenennen:
#
#        mv ~/Downloads/pulse-instance-*.env .env
#
#   3. docker compose up -d
#
#   Optionale Schalter (eigenes Zertifikat, PULSE_PUBLIC_IP hinter NAT,
#   Sicherungs-Takt, Log-Stufe) stehen in der kommentierten Referenz
#   https://howispulse.com/self-host/env.example — zum Nachschlagen, nicht
#   zum Ausfüllen.
#
# Voraussetzung für Auto-TLS: Port 80 + 443 sind öffentlich erreichbar und der
# DNS-A-Record von PULSE_HOSTNAME zeigt auf diese Maschine — der eingebettete
# Caddy holt das Let's-Encrypt-Zertifikat dann selbst.
#
# Läuft auf der Maschine SCHON ein Reverse-Proxy auf 80/443 (nginx/Traefik/
# Caddy/NPM)? Dann stattdessen docker-compose.behind-proxy.yml nehmen.
#
# Updates — bewusst KEIN Auto-Updater-Container in dieser Datei (ein Updater
# mit gemountetem Docker-Socket ist root-äquivalent auf dem Host):
#   docker compose pull && docker compose up -d
# manuell oder als Host-Cron/Timer. Der One-Command-Installer (docs/SELF_HOST.md)
# richtet so einen Host-systemd-Timer automatisch ein — wer den manuellen
# Compose-Pfad wählt, verwaltet Updates selbst.

services:
  pulse:
    # Self-Host-Registry (per-Instance-Credentials). Vor dem ersten
    # `docker compose pull` einmalig einloggen:
    #   docker login registry.howispulse.com -u <client_id> -p <client_secret>
    # (Credentials aus dem Bootstrap- bzw. Env-Download).
    image: registry.howispulse.com/pulse-allinone:stable
    container_name: pulse
    restart: unless-stopped
    env_file: .env
    volumes:
      - pulse-data:/data
    ports:
      # HTTP/HTTPS — Auto-TLS (PULSE_TLS_MODE=auto). Port 80 wird zusätzlich für
      # die Let's-Encrypt-Challenge gebraucht.
      - "80:80"
      - "443:443"
      # Voice (LiveKit WebRTC) + HQ-Stream-ICE
      - "7882-7892:7882-7892/udp"
      # TURN/STUN (coturn) — NAT-Traversal für Voice
      - "3478:3478/tcp"
      - "3478:3478/udp"
      # HQ-Streaming RTMPS-Ingest
      - "1936:1936/tcp"
      # HQ-Stream-Wiedergabe (MediaMTX WebRTC/WHEP-ICE)
      - "8189:8189/udp"

volumes:
  pulse-data:
