# Pulse Self-Host — Docker Compose (manueller Pfad, Standardfall: Auto-TLS).
#
#   1. .env.example nach .env kopieren und die 6 Pflicht-Vars eintragen
#      (am einfachsten: howispulse.com → "Meine Instanzen" → .env-Download).
#   2. docker compose up -d
#
# Voraussetzung für Auto-TLS: Port 80 + 443 sind öffentlich erreichbar und der
# DNS-A-Record von PULSE_HOSTNAME zeigt auf diese Maschine — der eingebettete
# Caddy holt das Let's-Encrypt-Zertifikat dann selbst.
#
# Läuft auf der Maschine SCHON ein Reverse-Proxy auf 80/443 (nginx/Traefik/
# Caddy/NPM)? Dann stattdessen docker-compose.behind-proxy.yml nehmen.
#
# Updates — bewusst KEIN Auto-Updater-Container in dieser Datei (ein Updater
# mit gemountetem Docker-Socket ist root-äquivalent auf dem Host):
#   docker compose pull && docker compose up -d
# manuell oder als Host-Cron/Timer. Der One-Command-Installer (docs/SELF_HOST.md)
# richtet so einen Host-systemd-Timer automatisch ein — wer den manuellen
# Compose-Pfad wählt, verwaltet Updates selbst.

services:
  pulse:
    image: ghcr.io/oblivion8282-1337/pulse-allinone:stable
    container_name: pulse
    restart: unless-stopped
    env_file: .env
    volumes:
      - pulse-data:/data
    ports:
      # HTTP/HTTPS — Auto-TLS (PULSE_TLS_MODE=auto). Port 80 wird zusätzlich für
      # die Let's-Encrypt-Challenge gebraucht.
      - "80:80"
      - "443:443"
      # Voice (LiveKit WebRTC) + HQ-Stream-ICE
      - "7882-7892:7882-7892/udp"
      # TURN/STUN (coturn) — NAT-Traversal für Voice
      - "3478:3478/tcp"
      - "3478:3478/udp"
      # HQ-Streaming RTMPS-Ingest
      - "1936:1936/tcp"
      # HQ-Stream-Wiedergabe (MediaMTX WebRTC/WHEP-ICE)
      - "8189:8189/udp"

volumes:
  pulse-data:
