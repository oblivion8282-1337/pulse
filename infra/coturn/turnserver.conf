# coturn für die Pulse-Fernsteuerung (M3).
#
# `use-auth-secret`: der chat-gateway-Endpoint GET /remote/ice-servers mintet
# zeitlich begrenzte HMAC-Credentials aus DEMSELBEN `static-auth-secret` (TURN-
# REST-API). coturn validiert sie selbst — keine Credentials werden gespeichert.
#
# Vor dem Deploy ersetzen: <TURN_SECRET> (= chat-gateway `turn_secret`),
# <PUBLIC_IP> (öffentliche VPS-IP), <REALM> (z.B. turn.howispulse.com).

listening-port=3478
tls-listening-port=5349

# Relay-Port-Range (UDP) — MUSS in der UFW offen sein (s. README).
min-port=49152
max-port=65535

fingerprint
use-auth-secret
static-auth-secret=<TURN_SECRET>
realm=<REALM>

# coturn muss seine öffentliche IP kennen (Relay-Announcement hinter NAT/VPS).
external-ip=<PUBLIC_IP>

# Härtung: keine internen Netze als Relay-Ziel (verhindert SSRF-artige Relays
# in interne Dienste), kein CLI-Port, alte TLS-Versionen aus.
no-cli
no-tlsv1
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# TLS (turns://5349) — für strikte Firewalls empfohlen. Zertifikat einhängen
# (z.B. das Caddy/Let's-Encrypt-Cert der Instanz) und die zwei Zeilen aktivieren:
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
