# Garage — S3-kompatibler Objektspeicher (ersetzt MinIO, Bughunt Runde 32).
# Der `garage`-Service in docker-compose.yml mountet diese Datei nach
# /etc/garage.toml.
#
# RPC_SECRET: eigenständiger 32-Byte-Hex-Wert (Generierung: openssl rand -hex 32;
# in der Prod-.env zusätzlich als GARAGE_RPC_SECRET pflegen — dort für die Doku).
# Er schützt das interne Cluster-RPC; Single-Node, RPC nicht nach außen
# veröffentlicht.
#
# Erstinbetriebnahme (einmalig, nach `docker compose up -d garage`):
#   docker compose exec garage /garage status        # Node-ID notieren
#   docker compose exec garage /garage layout assign -z dc1 -c 1G <NODE-ID>
#   docker compose exec garage /garage layout apply --version 1
#   docker compose exec garage /garage bucket create pulse-attachments
#   docker compose exec garage /garage key import "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" -n pulse
#   docker compose exec garage /garage bucket allow --read --write pulse-attachments --key "$MINIO_ROOT_USER"

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_secret = "BITTE_ERSETZEN_MIT_OPENSLL_RAND_HEX_32"

[s3_api]
# Region MUSS zu S3_REGION passen, mit der chat-gateway SigV4-signiert
# (Prod-.env: S3_REGION, Default us-east-1).
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".invalid"
index = "index.html"

[admin]
api_bind_addr = "[::]:3909"
