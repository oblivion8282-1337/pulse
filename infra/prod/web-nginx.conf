# Pulse production reverse-proxy + SPA host (nginx, inside the pulse-net network).
# Installed as /etc/nginx/conf.d/default.conf (replaces the stock one).
#
# Routing:
#   /api/auth/*  -> auth:8000              /whep/*    -> MediaMTX :8889  (host net)
#   /api/chat/*  -> chat-gateway:8000      /hls/*     -> MediaMTX :8888  (host net)
#   /api/ws/*    -> chat-gateway:8000 (WS) /livekit/* -> LiveKit  :7880  (host net, WS)
#   /api/voice/* -> voice-signaling:8000
#   everything else -> SvelteKit SPA (try_files ... /index.html)
#
# Upstreams are addressed through variables + the Docker embedded resolver so a
# recreated container (compose recreate / Watchtower) is picked up without an
# nginx reload — nginx re-resolves per request instead of caching the IP at
# startup. (Side effect: variable proxy_pass doesn't auto-strip the location
# prefix, hence the explicit `rewrite ... break`.)
#
# MediaMTX / LiveKit run with network_mode: host (UDP RTC ranges), so they're
# reached via host.docker.internal — this container needs
# `extra_hosts: host.docker.internal:host-gateway` in the compose file.
#
# Caddy on the host fronts this on https://pulse.unicutmedia.com.

# WebSocket upgrade plumbing — empty Upgrade header => Connection: close (harmless).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 16m covers avatars + guild-icons (Pillow-validated). Browser uploads
    # to MinIO go to /s3/* below where the per-location override raises this
    # to match the admin-configured attachment-max-size.
    client_max_body_size 16m;
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS

    # headers inherited by every proxied location below (note: no Host override —
    # keep $proxy_host so MediaMTX's WHEP `Location:` stays rewritable)
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 3600s;

    # ── backend services (pulse-net, by container name) ──
    location /api/auth/ {
        set $u auth;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://$u:8000;
    }
    location /api/chat/ {
        set $u chat-gateway;
        rewrite ^/api/chat/(.*)$ /$1 break;
        proxy_pass http://$u:8000;
    }
    location /api/ws/ {
        set $u chat-gateway;
        rewrite ^/api/ws/(.*)$ /$1 break;
        proxy_pass http://$u:8000;
    }
    location /api/voice/ {
        set $u voice-signaling;
        rewrite ^/api/voice/(.*)$ /$1 break;
        proxy_pass http://$u:8000;
    }

    # ── MinIO (S3 API) for message attachments ──
    # Path-style addressing: the bucket name is the first path segment.
    # MinIO doesn't support being mounted under a sub-path (MINIO_SERVER_URL
    # with /s3 silently drops the prefix and breaks signature verification),
    # so we forward `/pulse-attachments/*` as-is. Anything else under MinIO's
    # API (admin endpoints, health, etc.) stays inaccessible from the public
    # web — there's no nginx location matching them.
    location /pulse-attachments/ {
        set $u minio;
        proxy_pass http://$u:9000;
        client_max_body_size 1g;
        proxy_request_buffering off;     # stream uploads instead of buffering
        proxy_buffering off;             # stream downloads too
    }

    # ── MediaMTX + LiveKit run network_mode: host → reached via host.docker.internal,
    #    which is a fixed /etc/hosts entry (extra_hosts: host-gateway). Use a
    #    STATIC proxy_pass here (resolved from /etc/hosts at startup, never
    #    changes) — the variable+resolver trick above is for the pulse-net
    #    container names whose IPs change on recreate; Docker's embedded DNS does
    #    NOT know host.docker.internal, so a variable proxy_pass would 502.
    #    NB: UFW must allow the docker bridge → host for these ports (8888/8889
    #    are open to Anywhere already; 7880 only from the bridge — see DEPLOY.md).
    location /whep/ {
        proxy_pass http://host.docker.internal:8889/;
        proxy_redirect http://host.docker.internal:8889/ /whep/;
    }
    # WHEP session resource URLs — MediaMTX returns Location: /channel-CID-UID-NONCE/whep/session-uuid
    # on the 201 response (proxy_redirect only rewrites 3xx, not 201). The browser
    # resolves this against the origin and sends DELETE /channel-.../whep/... on teardown.
    location ~ "^/channel-[0-9]+-[0-9]+-[0-9a-f]+/whep/" {
        proxy_pass http://host.docker.internal:8889;
    }
    location /hls/ {
        proxy_pass http://host.docker.internal:8888/;
        proxy_redirect http://host.docker.internal:8888/ /hls/;
    }
    location /livekit/ {
        proxy_pass http://host.docker.internal:7880/;
    }

    # DeepFilterNet3 model tarballs must be served raw (no Content-Encoding) —
    # the lib gunzips itself; a transparent Content-Encoding: gzip => WASM panic.
    # Default nginx already doesn't add it (gzip_static off); be explicit anyway.
    location ~* \.tar\.gz$ {
        default_type application/octet-stream;
        add_header Content-Encoding "" always;
    }

    # ── Pulse Flatpak repo (the desktop app's update channel) ──
    # Static OSTree repo (archive-z2) pushed here by packaging/publish.fish via
    # rsync; bind-mounted into this container at /srv/flatpak-repo (see the `web`
    # service's volume in infra/prod/docker-compose.yml — empty/absent host dir =>
    # this just 404s, harmless). Friend installs from
    # https://pulse.unicutmedia.com/flatpak/com.unicutmedia.Pulse.flatpakref ;
    # `flatpak update` pulls new commits. ostree files (summary/config/objects/…)
    # are served as-is — no Content-Type fiddling needed.
    location ^~ /flatpak/ {
        alias /srv/flatpak-repo/;
        autoindex off;
    }

    # ── SvelteKit SPA — everything else falls back to index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
