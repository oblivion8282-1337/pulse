# Pulse production reverse-proxy + SPA host (nginx, inside the pulse-net network).
# Installed as /etc/nginx/conf.d/default.conf (replaces the stock one).
#
# Routing:
#   /api/auth/*  -> auth:8000              /whep/*    -> MediaMTX :8889  (host net)
#   /api/chat/*  -> chat-gateway:8000      /hls/*     -> MediaMTX :8888  (host net)
#   /api/ws/*    -> chat-gateway:8000 (WS) /livekit/* -> LiveKit  :7880  (host net, WS)
#   /api/voice/* -> voice-signaling:8000
#   everything else -> SvelteKit SPA (try_files ... /index.html)
#
# Upstreams are addressed through variables + the Docker embedded resolver so a
# recreated container (compose recreate / Auto-Update-Cron) is picked up without an
# nginx reload — nginx re-resolves per request instead of caching the IP at
# startup. (Side effect: variable proxy_pass doesn't auto-strip the location
# prefix, hence the explicit `rewrite ... break`.)
#
# MediaMTX / LiveKit run with network_mode: host (UDP RTC ranges), so they're
# reached via host.docker.internal — this container needs
# `extra_hosts: host.docker.internal:host-gateway` in the compose file.
#
# Caddy on the host fronts this on https://howispulse.com.

# WebSocket upgrade plumbing — empty Upgrade header => Connection: close (harmless).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access-Log OHNE Query-String: das Default-Format (combined) loggt $request
# inkl. Query — und der WS-Connect trägt das Access-Token als Query-Param
# (/api/ws/ws?token=<JWT>, Browser-WebSocket kann keine Custom-Header). Mit
# dem Default stünde jedes aktive Token im Klartext im Log (docker logs
# pulse_web). $uri statt $request lässt die Query weg; der uvicorn-Filter
# (log_filters.py) schützt nur die App-Logs, nicht diesen Proxy.
log_format pulse_noquery '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log pulse_noquery;

    root /usr/share/nginx/html;
    index index.html;

    # Security-Headers für alle Responses. ACHTUNG nginx-Vererbung: jede
    # Location mit eigener add_header-Direktive MUSS das Snippet erneut
    # includen, sonst fehlen dort die Security-Header (Details im Snippet).
    include /etc/nginx/security-headers.inc;

    # 16m covers avatars + guild-icons (Pillow-validated). Browser uploads
    # to MinIO go to /s3/* below where the per-location override raises this
    # to match the admin-configured attachment-max-size.
    client_max_body_size 16m;
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS

    # Compress text-ish responses. Caddy in front of us would also gzip on
    # the way out, but doing it at the origin means it happens once per
    # response and Caddy can pass it straight through (matching
    # Accept-Encoding from the client). gzip_proxied any so we still
    # compress when Caddy forwards us a request with Via: header set.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # headers inherited by every proxied location below (note: no Host override —
    # keep $proxy_host so MediaMTX's WHEP `Location:` stays rewritable)
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 3600s;

    # ── backend services (pulse-net, by container name) ──

    # Block public access to every /internal/* path.  These endpoints are
    # service-to-service only (ban/kick eviction, account purge) and are
    # protected by INTERNAL_SERVICE_SECRET — this nginx deny is a defence-
    # in-depth layer in case the app-level secret gate is misconfigured.
    location /internal/ {
        deny all;
    }

    # Signal-WebSocket des Direktpfads — MUSS vor `location /api/auth/` stehen
    # (exakter Match gewinnt ohnehin, die Reihenfolge ist für den Leser).
    # Der auth-Block darunter löscht `Connection` für Upstream-Keepalive und
    # macht damit jedes WS-Upgrade unmöglich: uvicorn sieht ein normales GET,
    # findet keine HTTP-Route und antwortet 404. Hier erbt der WS deshalb
    # Upgrade/Connection vom server-Level ($connection_upgrade). Der Adapter
    # sendet selbst keine Pings — langes Lesetimeout statt der 60 s unten.
    location = /api/auth/selfhost/directory/ws {
        set $u auth;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://$u:8000;
        proxy_read_timeout 3600s;
    }
    location /api/auth/ {
        set $u auth;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://$u:8000;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
    location /api/chat/ {
        set $u chat-gateway;
        rewrite ^/api/chat/(.*)$ /$1 break;
        proxy_pass http://$u:8000;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
    location /api/ws/ {
        set $u chat-gateway;
        rewrite ^/api/ws/(.*)$ /$1 break;
        proxy_pass http://$u:8000;
    }
    # Block public access to the LiveKit webhook endpoint; it is called from
    # within the Docker network (127.0.0.1:8003) and does not need a public path.
    location = /api/voice/webhook {
        deny all;
    }
    # Block public access to all /api/voice/internal/* paths. The generic
    # `location /internal/` block (line ~79) never matches these because the
    # longer-prefix /api/voice/ location wins first and rewrites/proxies the
    # request before the /internal/ block can apply. The ^~ prefix here takes
    # priority over /api/voice/ for this specific sub-tree.
    location ^~ /api/voice/internal/ {
        deny all;
    }
    location /api/voice/ {
        set $u voice-signaling;
        rewrite ^/api/voice/(.*)$ /$1 break;
        proxy_pass http://$u:8000;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ── Diagnose-Log-Upload des Linux-HQ-Sidecars ──
    # Der Electron-Client lädt bei Stream-Ende/-Fehler die `sidecar.log` hoch,
    # aber nur mit Opt-in (`uploadDiagnosticLogs`). Er sendet fest an
    # `/api/experimental-logs` (experimental-log-upload.ts) — auth-svc serviert
    # die Route aber am Root als `/experimental-logs`, und ohne diesen Block
    # fällt der POST auf die SPA-Regel `location /` durch: nginx antwortet 405,
    # der Fehlschlag bleibt still im Client — so blieb `auth.experimental_logs`
    # seit dem ersten Release leer.
    # Deshalb hier und nicht per Client-Korrektur: so senden auch die BEREITS
    # INSTALLIERTEN Clients sofort — ein Flatpak-/Windows-Release würde die
    # betroffenen Nutzer erst nach einem Update erreichen.
    location = /api/experimental-logs {
        set $u auth;
        rewrite ^/api/experimental-logs$ /experimental-logs break;
        proxy_pass http://$u:8000;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ── Cloud identity well-known endpoints (served by auth-svc at the root
    #    path) ──
    # Self-hosts poll these from the Cloud: JWKS (validate Cloud-signed certs),
    # jwks.json, version-policy, suspended-instances. They MUST
    # be public at /.well-known/… per the cert-model contract. Without this
    # block they fall through to the SPA `location /` → index.html (200 HTML),
    # which makes the pollers log "JSONDecodeError — keeping last-known-good"
    # and silently never get the CRL/JWKS. Scoped to the exact auth paths so
    # /.well-known/acme-challenge (Caddy/Let's Encrypt) is NOT intercepted.
    location ~ ^/\.well-known/(jwks\.json|pulse-version-policy\.json|pulse-suspended-instances)$ {
        set $u auth;
        proxy_pass http://$u:8000;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ── MinIO (S3 API) for message attachments ──
    # Path-style addressing: the bucket name is the first path segment.
    # MinIO doesn't support being mounted under a sub-path (MINIO_SERVER_URL
    # with /s3 silently drops the prefix and breaks signature verification),
    # so we forward `/pulse-attachments/*` as-is. Anything else under MinIO's
    # API (admin endpoints, health, etc.) stays inaccessible from the public
    # web — there's no nginx location matching them.
    location /pulse-attachments/ {
        set $u minio;
        # S3 SigV4 signs against the Host header. The default proxy_pass
        # rewrites Host to "$u:9000", which would never match the
        # browser-side signature. Force Host to the public name —
        # matches what chat-gateway used when signing the URL.
        proxy_set_header Host $host;
        proxy_pass http://$u:9000;
        client_max_body_size 1g;
        proxy_request_buffering off;     # stream uploads instead of buffering
        proxy_buffering off;             # stream downloads too
        proxy_read_timeout 60s;
    }

    # ── MediaMTX + LiveKit run network_mode: host → reached via host.docker.internal,
    #    which is a fixed /etc/hosts entry (extra_hosts: host-gateway). Use a
    #    STATIC proxy_pass here (resolved from /etc/hosts at startup, never
    #    changes) — the variable+resolver trick above is for the pulse-net
    #    container names whose IPs change on recreate; Docker's embedded DNS does
    #    NOT know host.docker.internal, so a variable proxy_pass would 502.
    #    NB: UFW must allow the docker bridge → host for these ports (8888/8889
    #    are open to Anywhere already; 7880 only from the bridge — see DEPLOY.md).
    location /whep/ {
        proxy_pass http://host.docker.internal:8889/;
        proxy_redirect http://host.docker.internal:8889/ /whep/;
    }
    # WHEP session resource URLs — MediaMTX returns Location: /channel-CID-UID-NONCE/whep/session-uuid
    # on the 201 response (proxy_redirect only rewrites 3xx, not 201). The browser
    # resolves this against the origin and sends DELETE /channel-.../whep/... on teardown.
    #
    # Der Pfad wird bewusst NICHT zerlegt. Hier stand bis 2026-08-03
    # `^/channel-[0-9]+-[0-9]+-[0-9a-f]+/whep/` — drei starre Gruppen, die nur
    # die Form ohne Slot treffen. Ab Slot 1 traegt der MediaMTX-Pfad ein
    # zusaetzliches `-s<slot>`-Segment (`streamkeys.py`, `[-s<slot>]`), und `s`
    # passt in keine der Gruppen. Das abschliessende DELETE fiel damit in den
    # SPA-Fallback und bekam die Startseite mit Status 200 zurueck — der
    # Aufrufer wertet das nicht aus („best effort"), also blieb es still und die
    # Sitzung raeumte erst per ICE-Timeout ab.
    #
    # Dieselbe Regel steht in der Self-Host-Gegenstelle schon richtig
    # (`Caddyfile.template`); die Cloud war nur nicht nachgezogen. `whip`
    # gehoert mit hinein, seit der Push-Weg fuer Nutzer waehlbar ist.
    location ~ "^/channel-[^/]+/(whep|whip)(/|$)" {
        proxy_pass http://host.docker.internal:8889;
    }
    # HLS ist serverseitig abgeschaltet (s. mediamtx.yml — vertraegt sich nicht
    # mit Intra-Refresh, und kein Pulse-Client konsumiert es). Die Route bleibt
    # stehen, damit ein Zurueckholen nur EINE Datei betrifft; solange `hls: no`
    # gilt, antwortet sie 502.
    location /hls/ {
        proxy_pass http://host.docker.internal:8888/;
        proxy_redirect http://host.docker.internal:8888/ /hls/;
        proxy_buffering off;
    }
    location /livekit/ {
        proxy_pass http://host.docker.internal:7880/;
    }

    # DeepFilterNet3 model tarballs must be served raw (no Content-Encoding) —
    # the lib gunzips itself; a transparent Content-Encoding: gzip => WASM panic.
    # Default nginx already doesn't add it (gzip_static off); be explicit anyway.
    location ~* \.tar\.gz$ {
        default_type application/octet-stream;
        add_header Content-Encoding "" always;
        include /etc/nginx/security-headers.inc;
    }

    # ── Pulse Flatpak repo (the desktop app's update channel) ──
    # Static OSTree repo (archive-z2) pushed here by packaging/publish.fish via
    # rsync; bind-mounted into this container at /srv/flatpak-repo (see the `web`
    # service's volume in infra/prod/docker-compose.yml — empty/absent host dir =>
    # this just 404s, harmless). Friend installs from
    # https://howispulse.com/flatpak/com.howispulse.Pulse.flatpakref ;
    # `flatpak update` pulls new commits. ostree files (summary/config/objects/…)
    # are served as-is — no Content-Type fiddling needed.
    location ^~ /flatpak/ {
        alias /srv/flatpak-repo/;
        autoindex off;
    }

    # ── Pulse Windows-Auto-Update-Feed ──
    # NSIS-Installer (Pulse-Setup-*.exe) + latest.yml + *.blockmap, von
    # .github/workflows/win-build.yml per rsync hierher gepusht; bind-gemountet
    # als /srv/updates-win (siehe web-Service in infra/prod/docker-compose.yml).
    # electron-updater in der Desktop-App pollt latest.yml. Leerer/fehlender
    # Host-Ordner => 404, harmlos. Statische Auslieferung, keine Content-Type-
    # Spielereien nötig (.yml/.exe/.blockmap as-is).
    location ^~ /updates/win/ {
        alias /srv/updates-win/;
        autoindex off;
    }

    # ── Pulse Direkt-Downloads (z.B. Android-APK-Testbuilds) ──
    # Bewusst GETRENNT vom Windows-Auto-Update-Feed (/updates/win/): hier landen
    # manuell bereitgestellte Download-Artefakte (per scp nach ~/pulse/downloads/,
    # bind-gemountet als /srv/downloads). Statische Auslieferung, kein Auto-Update-
    # Mechanismus. Leerer/fehlender Host-Ordner => 404, harmlos.
    location ^~ /downloads/ {
        alias /srv/downloads/;
        autoindex off;
    }

    # ── SvelteKit version-Manifest — steuert den "Neue Version"-Toast ──
    # kit.version.pollInterval pollt /_app/version.json. Darf NICHT gecacht
    # werden, sonst sieht der Poll nie die neue Version und der Reload-Hinweis
    # bleibt aus. (SvelteKit schickt zwar no-cache-Request-Header; explizit ist
    # robuster.) Exact-match gewinnt vor dem /_app/immutable/-Prefix unten.
    location = /_app/version.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # ── Changelog — das "Was ist neu?"-Dialog nach dem Update-Reload ──
    # ChangelogGate.svelte holt /changelog.json beim App-Start. Darf NICHT
    # gecacht werden, sonst zeigt ein frisch geladener Client nach dem Deploy
    # noch den alten Stand und das neue Changelog erscheint erst verzögert.
    location = /changelog.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # ── Native-App-Versions-Manifest — steuert den nativen Update-Hinweis ──
    # nativeUpdate.svelte.ts holt /native.json beim Start (nur in der Electron-
    # Hülle). Wie changelog.json: NICHT cachen, sonst sieht ein frisch geladener
    # Client nach einem nativen Release noch die alte Version und der Hinweis
    # (Mac-DMG-Link / flatpak-Nudge) bleibt aus.
    location = /native.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # ── Self-Host Ein-Befehl-Installer ──
    # `curl -fsSL https://howispulse.com/install | bash -s -- <TOKEN>` lädt dieses
    # Script (Quelle: web/static/install.sh → /usr/share/nginx/html/install.sh).
    # Als text/plain ausliefern, damit es im Browser inspizierbar ist (Default-Type
    # für .sh wäre octet-stream → Download). No-cache, damit Script-Updates greifen.
    location = /install {
        alias /usr/share/nginx/html/install.sh;
        default_type text/plain;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.inc;
    }

    # ── Self-Host-Anleitung (HTML) ──
    # MUSS eine EXAKTE location sein: `location =` gewinnt in nginx unabhängig
    # von der Reihenfolge im File gegen `^~ /self-host/` darunter — ein
    # `^~`-Block dort würde mit seinem `default_type text/plain` den
    # HTML-Quelltext ausliefern statt der gerenderten Seite.
    # Quelle: docs/self-host-guide.html (web/Dockerfile kopiert sie hierher).
    location = /self-host/guide {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # ── Self-Host-Compose-Dateien (manueller Installationspfad) ──
    # Quelle: infra/self-host/ — web/Dockerfile kopiert sie nach html/self-host/
    # (.env.example → env.example). Anleitung: docs/self-host-guide.html →
    # "Manual installation". text/plain → im Browser inspizierbar; no-cache,
    # damit Datei-Updates sofort greifen.
    location ^~ /self-host/ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }
    # ── SvelteKit hashed assets — never change, cache forever ──
    # SvelteKit emits these under /_app/immutable/ with content-hashed
    # filenames. Browser may keep them indefinitely; index.html (below)
    # decides which versions get loaded on the next visit.
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # ── SvelteKit SPA — everything else falls back to index.html ──
    # index.html itself must NOT be cached aggressively: it pins the
    # immutable chunk-hashes the user will load. A stale index.html points
    # at chunks that may have been pruned after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
