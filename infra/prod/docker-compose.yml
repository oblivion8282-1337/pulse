# Pulse — production stack (Hetzner VPS, lives in ~/pulse/ on the server).
#
#   docker compose -f ~/pulse/infra/prod/docker-compose.yml pull
#   docker compose -f ~/pulse/infra/prod/docker-compose.yml up -d
#
# Reads ~/pulse/infra/prod/.env.production (gitignored — copy from .example,
# fill in real secrets). Caddy on the host fronts pulse_web on
# https://pulse.unicutmedia.com (see Caddyfile.pulse.snippet).
#
# App images come from GHCR (built by .github/workflows/ci.yml on push to main);
# pulse_watchtower polls them every 5 min and recreates on a new :latest.
# postgres / redis / mediamtx / livekit are pinned and excluded from Watchtower.

name: pulse

x-app-labels: &app-labels
  com.centurylinklabs.watchtower.scope: pulse
  com.centurylinklabs.watchtower.enable: "true"

x-pinned-labels: &pinned-labels
  com.centurylinklabs.watchtower.enable: "false"

x-app-common: &app-common
  restart: unless-stopped
  env_file: .env
  networks: [pulse-net]
  labels: *app-labels

services:
  # ── data ───────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-dcc}
    volumes:
      - pulse_pg:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcc} -d ${POSTGRES_DB:-dcc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pulse-net]
    labels: *pinned-labels

  redis:
    image: redis:7-alpine
    container_name: pulse_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - pulse_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pulse-net]
    labels: *pinned-labels

  # MinIO — S3-compatible object store for message attachments. Internal-only:
  # the public surface is pulse_web's nginx proxying `/s3/*` → minio:9000.
  # MINIO_SERVER_URL makes MinIO sign presigned URLs with the public host so
  # browsers can PUT/GET directly via Caddy → pulse_web → nginx → MinIO.
  # Bucket creation runs in the one-shot minio-init container below.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: pulse_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      # Presigning host — MinIO ignores path prefixes here (verified
      # empirically: setting this to https://…/s3 made it log
      # `API: https://pulse.unicutmedia.com` anyway, dropping the prefix,
      # which broke signature verification). So the public surface uses
      # the bucket name as the URL prefix instead: nginx forwards
      # `/pulse-attachments/*` straight through.
      MINIO_SERVER_URL: https://pulse.unicutmedia.com
      # No public console (admin UI). Reachable from the host via SSH-tunnel
      # if needed: `ssh -L 9001:127.0.0.1:9001 michael@…` + visit localhost.
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
    volumes:
      - pulse_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      # Console bound to loopback so the SSH-tunnel works but nothing public.
      - "127.0.0.1:9001:9001"
    networks: [pulse-net]
    labels: *pinned-labels

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: pulse_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/pulse-attachments &&
        echo "bucket pulse-attachments ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"
    networks: [pulse-net]
    labels: *pinned-labels

  # ── encrypted backups (restic → pulse_backups volume) ──────────────────────
  # Sidecar that snapshots Postgres + MinIO + avatars + guild_icons into a
  # local restic repo at /repo. Built from ./backup/Dockerfile (not GHCR);
  # Watchtower-excluded because the image only changes when this directory
  # does. Schedule + script land in a follow-up commit; for now the container
  # is a working environment for restic invocations and stays idle.
  #
  # See infra/prod/backup/restore.md (added with the restore runbook) for
  # recovery. Local-only repo is *not* a real backup against disk loss —
  # an off-host move is tracked as a TODO in DEPLOY.md.
  backup:
    build: ./backup
    container_name: pulse_backup
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD required}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-dcc}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PGDATABASE: ${POSTGRES_DB:-dcc}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - pulse_backups:/repo
      - pulse_avatars:/snapshot/avatars:ro
      - pulse_guild_icons:/snapshot/guild_icons:ro
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    # Healthcheck reads /repo/.pulse/last-backup-ok (written by backup.sh on
    # every successful run, touched by entrypoint on container start). > 36h
    # old ⇒ unhealthy — catches "cron silently broke for >1 day" without
    # tripping on daily-only cadence.
    healthcheck:
      test: ["CMD-SHELL", "test -f /repo/.pulse/last-backup-ok && [ $(($(date +%s) - $(stat -c %Y /repo/.pulse/last-backup-ok))) -lt 129600 ]"]
      interval: 1h
      timeout: 5s
      retries: 3
      start_period: 5m
    networks: [pulse-net]
    labels: *pinned-labels

  # ── migrations (run once, then exit) ───────────────────────────────────────
  migrate-auth:
    image: ghcr.io/oblivion8282-1337/pulse-auth:latest
    container_name: pulse_migrate_auth
    env_file: .env
    working_dir: /app/services/auth
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro
    restart: "no"
    networks: [pulse-net]
    labels: *pinned-labels

  migrate-chat:
    image: ghcr.io/oblivion8282-1337/pulse-chat-gateway:latest
    container_name: pulse_migrate_chat
    env_file: .env
    working_dir: /app/services/chat-gateway
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro
    restart: "no"
    networks: [pulse-net]
    labels: *pinned-labels

  # ── backend services ───────────────────────────────────────────────────────
  auth:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-auth:latest
    container_name: pulse_auth
    depends_on:
      postgres: { condition: service_healthy }
      migrate-auth: { condition: service_completed_successfully }
    volumes:
      - ./secrets:/secrets:ro
      - pulse_avatars:/app/services/auth/uploads
      # RO view into the backup volume so /admin/backup-status can stat the
      # marker file written by infra/prod/backup/backup.sh::mark_ok. The
      # repo contents are encrypted ciphertext and the RESTIC_PASSWORD is
      # NOT in auth's env — RCE here can't decrypt the repo.
      - pulse_backups:/backup-state:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-gateway:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-chat-gateway:latest
    container_name: pulse_chat_gateway
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-chat: { condition: service_completed_successfully }
      auth: { condition: service_started }
      minio: { condition: service_healthy }
    volumes:
      - ./secrets:/secrets:ro
      - pulse_guild_icons:/app/services/chat-gateway/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  voice-signaling:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-voice-signaling:latest
    container_name: pulse_voice_signaling
    depends_on:
      redis: { condition: service_healthy }
      auth: { condition: service_started }
    # LiveKit (network_mode: host) posts webhooks to http://127.0.0.1:8003/webhook
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  media-svc:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-media-svc:latest
    container_name: pulse_media_svc
    depends_on:
      redis: { condition: service_healthy }
      auth: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"   # → MediaMTX API on the host (:9997)
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mediamtx-auth-hook:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-mediamtx-auth-hook:latest
    container_name: pulse_mediamtx_auth_hook
    depends_on:
      redis: { condition: service_healthy }
    # MediaMTX (network_mode: host) delegates auth to http://127.0.0.1:8005/
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── web (SvelteKit SPA + nginx reverse-proxy) ──────────────────────────────
  web:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-web:latest
    container_name: pulse_web
    depends_on:
      auth: { condition: service_started }
      chat-gateway: { condition: service_started }
      voice-signaling: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"   # → MediaMTX (:8889/:8888) + LiveKit (:7880) on the host
    # Loopback bind for the host-Caddy fallback path. Docker's DNAT sits
    # *before* UFW's INPUT DROP in iptables, so a plain `8100:80` would expose
    # nginx publicly even though `ufw status` says otherwise — hence the
    # explicit `127.0.0.1` prefix.
    # The recommended setup (DEPLOY.md + Caddyfile.pulse.snippet) is to run
    # Caddy as a container, join it to pulse-net, and proxy directly to
    # `pulse_web:80` — that path ignores this binding entirely.
    ports:
      - "127.0.0.1:8100:80"
    volumes:
      # Pulse Flatpak repo (the desktop app's update channel). packaging/publish.fish
      # rsyncs the OSTree repo into this host dir; web-nginx.conf serves it under
      # /flatpak/. Read-only; if the host dir doesn't exist Docker creates it empty
      # (=> /flatpak/* just 404s, harmless). Keep in sync with publish.fish's VPS_REPO_PATH.
      # `${HOME}` so future VPS-user changes (e.g. dedicated `pulse` user) don't
      # require editing this file.
      - ${HOME}/pulse/flatpak-repo:/srv/flatpak-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── streaming / voice servers (host network — UDP ranges) ──────────────────
  mediamtx:
    # Pinned to 1.17.1 (Pulse fork): v1.18.0 broke AV1-over-Enhanced-RTMP→WebRTC
    # for AMD VAAPI (MediaMTX #5728, still open). 1.17.1 fixes that, but has
    # its own AMD-only freeze where the AV1 bitstream goes out without
    # OBU_TEMPORAL_DELIMITER OBUs (libwebrtc-side decoder rejects the frames).
    # The Pulse fork injects them in the RTMP→stream path — see
    # infra/mediamtx-fork/README.md. Remove the `-pulse` suffix once upstream
    # picks up the fix.
    image: ghcr.io/oblivion8282-1337/pulse-mediamtx:1.17.1-pulse
    container_name: pulse_mediamtx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./certs:/certs:ro          # self-signed RTMPS cert (server.crt / server.key)
    labels: *pinned-labels

  livekit:
    image: livekit/livekit-server:v1.11
    container_name: pulse_livekit
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/livekit.yaml"]
    environment:
      # API key/secret kept out of git — the key *name* is fixed (pulse-prod),
      # only the secret is sensitive. voice-signaling gets the same pair.
      # key name must also match webhook.api_key in livekit.yaml + voice-signaling's LIVEKIT_API_KEY
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-pulse-prod}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET required}"
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
    labels: *pinned-labels

  # ── auto-updater for the GHCR app images (scoped to Pulse only) ────────────
  watchtower:
    # Pinned: Watchtower has docker.sock = root-on-host, so the image gets the
    # same trust as the host kernel. Bump the digest deliberately when upgrading.
    image: ghcr.io/nicholas-fedor/watchtower:1.17.0@sha256:48122f05d9e1a0ed3f3987a74340554ba3e73c9a96b32016fca74f873fa9f7c6
    container_name: pulse_watchtower
    restart: unless-stopped
    command: ["--label-enable", "--scope", "pulse", "--interval", "300", "--cleanup"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    networks: [pulse-net]
    labels: *pinned-labels

volumes:
  pulse_pg:
  pulse_redis:
  pulse_avatars:
  pulse_guild_icons:
  pulse_minio:
  pulse_backups:

networks:
  pulse-net:
    name: pulse-net
