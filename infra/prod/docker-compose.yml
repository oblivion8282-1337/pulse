# Pulse — production stack (Hetzner VPS, lives in ~/pulse/ on the server).
#
#   docker compose -f ~/pulse/infra/prod/docker-compose.yml pull
#   docker compose -f ~/pulse/infra/prod/docker-compose.yml up -d
#
# Reads ~/pulse/infra/prod/.env (gitignored — copy from .env.example,
# fill in real secrets). Caddy on the host fronts pulse_web on
# https://howispulse.com (see Caddyfile.pulse.snippet).
#
# App images come from GHCR (built by .github/workflows/ci.yml on push to main).
#
# UPDATES RUN VIA USER-CRONTAB, NOT WATCHTOWER (since 2026-06-11):
# infra/prod/pulse-update.sh does a scoped `compose pull && up -d` every few
# minutes. Watchtower is gone because it mounted the Docker socket (= root on
# the host); see the comment near the end of this file. (Ponytail-Audit
# 2026-09-21: die watchtower-*-Labels der Dienste sind mitgeflogen.)

name: pulse

# Log-Begrenzung fuer JEDEN Container. Ohne das sammelt Dockers json-file-
# Treiber UNBEGRENZT — die Container schreiben auf stdout, und niemand raeumt
# ab. Aufgefallen am 2026-08-06 beim MediaMTX-Log: dort landen die
# FEC-Tor-Bilanzen, die wir fuer die Diagnose auswerten wollen. Sie sind der
# Grund, das Log zu BEGRENZEN statt abzuschalten.
#
# 10 MB x 5 = hoechstens 50 MB je Container. Bei MediaMTX (rund 200
# Sitzungs-Bilanzen in 48 h) reicht das fuer Wochen zurueck.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app-common: &app-common
  <<: *logging
  restart: unless-stopped
  env_file: .env
  networks: [pulse-net]

services:
  # ── data ───────────────────────────────────────────────────────────────────
  postgres:
    <<: *logging
    image: postgres:16-alpine
    container_name: pulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-dcc}
    volumes:
      - pulse_pg:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcc} -d ${POSTGRES_DB:-dcc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pulse-net]

  redis:
    <<: *logging
    image: redis:7-alpine
    container_name: pulse_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - pulse_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pulse-net]

  # MinIO — S3-compatible object store for message attachments. Internal-only:
  # Garage — S3-kompatibler Objektspeicher (Bughunt Runde 32: ersetzt MinIO.
  # Gründe: dl.min.io liefert die Community-Edition nicht mehr (410, Build-
  # Bruch im Self-Host-Dockerfile) und das minio/minio-Hub-Image ist vom Hub
  # entfernt. Internal-only: die öffentliche Fläche ist pulse_web's nginx
  # (/pulse-attachments/* → garage:9000). Presigning signiert chat-gateway
  # gegen S3_PUBLIC_ENDPOINT (howispulse.com) — nginx lässt den Pfad 1:1
  # durch, path-style /<bucket>/<key>.
  # Erstinbetriebnahme: Bootstrap-Kommandos stehen in
  # infra/prod/garage/garage.toml (Layout, Bucket, Key-Import).
  garage:
    <<: *logging
    image: dxflrs/garage:v1.1.0
    container_name: pulse_garage
    restart: unless-stopped
    # Bughunt Runde 42: hier stand ["-c", "/etc/garage.toml"] — das Image hat
    # KEINEN Entrypoint (CMD ist [/garage, server]), "-c" wurde als Programm
    # ausgeführt und der Container landete im Crash-Loop. Volle Befehlszeile.
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - pulse_garage:/var/lib/garage
    networks: [pulse-net]

  # ── encrypted backups (restic → pulse_backups volume) ──────────────────────
  # Opt-in sidecar that snapshots Postgres + MinIO + avatars + guild_icons
  # into a local restic repo at /repo. Built from ./backup/Dockerfile (not
  # GHCR); Watchtower-excluded because the image only changes when this
  # directory does.
  #
  # Profile-gated: `docker compose up -d` skips this service unless the
  # operator opts in by setting ``COMPOSE_PROFILES=backup`` in .env (or
  # passing ``--profile backup``). That keeps fresh self-hoster installs
  # painless (no mandatory RESTIC_PASSWORD ceremony) — the trade-off is
  # documented in DEPLOY.md, and the admin panel surfaces the "not
  # configured" state so it doesn't get forgotten silently.
  #
  # See infra/prod/backup/restore.md for recovery. Local-only repo is
  # *not* a real backup against disk loss — an off-host move is tracked
  # as a TODO in DEPLOY.md.
  backup:
    <<: *logging
    profiles: [backup]
    build: ./backup
    container_name: pulse_backup
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: /repo
      # Lenient interpolation so profile-OFF deployments don't trip the
      # compose-level required-guard (it evaluates before profile filtering).
      # The entrypoint enforces non-empty RESTIC_PASSWORD instead — clearer
      # error than the empty-passphrase restic crash that would otherwise
      # happen if the operator enables the profile but forgets the .env.
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-dcc}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PGDATABASE: ${POSTGRES_DB:-dcc}
      MINIO_ENDPOINT: http://garage:9000
      # GK-Schlüssel aus dem Garage-Bootstrap (== S3_ACCESS_KEY/SECRET, mit
      # denen chat-gateway signiert). MINIO_ROOT_USER kann Garage nicht
      # kennen — der Import solcher IDs scheitert am GK-Format (2026-09-22).
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - pulse_backups:/repo
      - pulse_minio_stage:/var/cache/pulse-backup
      - pulse_avatars:/snapshot/avatars:ro
      - pulse_guild_icons:/snapshot/guild_icons:ro
      # Konfiguration und Geheimnisse — NUR LESEND. Ohne diesen Mount lag von
      # `.env`, `secrets/` (JWT-Schlüssel) und `certs/` nichts im Backup: das
      # restic-Repo sicherte ausschliesslich Nutzerdaten. Am 2026-08-07 hat ein
      # `rsync --delete` genau diese Dateien geloescht — Datenbank und Uploads
      # waren vollstaendig gesichert, der private JWT-Schluessel trotzdem
      # endgueltig weg. Alle Sitzungen und Geraete-Zertifikate mussten neu
      # ausgestellt werden.
      - ./:/snapshot/config:ro
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_started }
    # Healthcheck reads /repo/.pulse/last-ok-<tag> per backup group (written
    # by backup.sh on every successful run, touched by entrypoint on start).
    # > 36h old on ANY group ⇒ unhealthy — catches "cron silently broke for
    # >1 day" per job; the old single global marker was renewed by every
    # successful neighbour job, so a daily-dying pg_dump stayed invisible
    # (Bughunt 2026-09-20, Runde 2).
    healthcheck:
      test: ["CMD-SHELL", "for t in pg minio avatars icons config; do test -f /repo/.pulse/last-ok-$$t && [ $$(($(date +%s) - $$(stat -c %Y /repo/.pulse/last-ok-$$t))) -lt 129600 ] || exit 1; done"]
      interval: 1h
      timeout: 5s
      retries: 3
      start_period: 5m
    networks: [pulse-net]

  # ── migrations (run once, then exit) ───────────────────────────────────────
  migrate-auth:
    <<: *logging
    image: ghcr.io/oblivion8282-1337/pulse-auth:latest
    container_name: pulse_migrate_auth
    env_file: .env
    working_dir: /app/services/auth
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro
    restart: "no"
    networks: [pulse-net]

  migrate-chat:
    <<: *logging
    image: ghcr.io/oblivion8282-1337/pulse-chat-gateway:latest
    container_name: pulse_migrate_chat
    env_file: .env
    working_dir: /app/services/chat-gateway
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro
    restart: "no"
    networks: [pulse-net]

  # ── backend services ───────────────────────────────────────────────────────
  auth:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-auth:latest
    container_name: pulse_auth
    depends_on:
      postgres: { condition: service_healthy }
      migrate-auth: { condition: service_completed_successfully }
    volumes:
      - ./secrets:/secrets:ro
      - pulse_avatars:/app/services/auth/uploads
      # RO view into the backup volume so /admin/backup-status can stat the
      # marker file written by infra/prod/backup/backup.sh::mark_ok. The
      # repo contents are encrypted ciphertext and the RESTIC_PASSWORD is
      # NOT in auth's env — RCE here can't decrypt the repo.
      - pulse_backups:/backup-state:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-gateway:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-chat-gateway:latest
    container_name: pulse_chat_gateway
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-chat: { condition: service_completed_successfully }
      auth: { condition: service_started }
      garage: { condition: service_started }
    volumes:
      - ./secrets:/secrets:ro
      - pulse_guild_icons:/app/services/chat-gateway/uploads
      - pulse_chat_data:/app/services/chat-gateway/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  voice-signaling:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-voice-signaling:latest
    container_name: pulse_voice_signaling
    depends_on:
      redis: { condition: service_healthy }
      auth: { condition: service_started }
    extra_hosts:
      # → LiveKit API (:7880) on the host for server-side calls (reconcile loop
      #   + admin ops). Set LIVEKIT_API_URL=http://host.docker.internal:7880 in
      #   .env so they bypass the public Caddy/nginx path (down during deploys).
      - "host.docker.internal:host-gateway"
    # LiveKit (network_mode: host) posts webhooks to http://127.0.0.1:8003/webhook
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  media-svc:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-media-svc:latest
    container_name: pulse_media_svc
    depends_on:
      redis: { condition: service_healthy }
      auth: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"   # → MediaMTX API on the host (:9997)
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mediamtx-auth-hook:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-mediamtx-auth-hook:latest
    container_name: pulse_mediamtx_auth_hook
    depends_on:
      redis: { condition: service_healthy }
    # MediaMTX (network_mode: host) delegates auth to http://127.0.0.1:8005/
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  relay-frps-plugin:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-relay-frps-plugin:latest
    container_name: pulse_relay_frps_plugin
    environment:
      AUTH_SVC_URL: http://auth:8000
      RELAY_BASE_DOMAIN: relay.howispulse.com
      # INTERNAL_SERVICE_SECRET wird aus .env (env_file via *app-common) übernommen
    depends_on:
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frps:
    <<: *logging
    image: snowdreamtech/frps:0.69.1
    container_name: pulse_frps
    restart: unless-stopped
    networks: [pulse-net]
    ports:
      - "7000:7000"
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    depends_on:
      relay-frps-plugin:
        condition: service_started

  # ── web (SvelteKit SPA + nginx reverse-proxy) ──────────────────────────────
  web:
    <<: *app-common
    image: ghcr.io/oblivion8282-1337/pulse-web:latest
    container_name: pulse_web
    depends_on:
      auth: { condition: service_started }
      chat-gateway: { condition: service_started }
      voice-signaling: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"   # → MediaMTX (:8889/:8888) + LiveKit (:7880) on the host
    # Loopback bind for the host-Caddy fallback path. Docker's DNAT sits
    # *before* UFW's INPUT DROP in iptables, so a plain `8100:80` would expose
    # nginx publicly even though `ufw status` says otherwise — hence the
    # explicit `127.0.0.1` prefix.
    # The recommended setup (DEPLOY.md + Caddyfile.pulse.snippet) is to run
    # Caddy as a container, join it to pulse-net, and proxy directly to
    # `pulse_web:80` — that path ignores this binding entirely.
    ports:
      - "127.0.0.1:8100:80"
    volumes:
      # Pulse Flatpak repo (the desktop app's update channel). packaging/publish.fish
      # rsyncs the OSTree repo into this host dir; web-nginx.conf serves it under
      # /flatpak/. Read-only; if the host dir doesn't exist Docker creates it empty
      # (=> /flatpak/* just 404s, harmless). Keep in sync with publish.fish's VPS_REPO_PATH.
      # `${HOME}` so future VPS-user changes (e.g. dedicated `pulse` user) don't
      # require editing this file.
      - ${HOME}/pulse/flatpak-repo:/srv/flatpak-repo:ro
      # Windows-Auto-Update-Feed (electron-updater). win-build.yml rsynct den
      # NSIS-Installer + latest.yml + .blockmap in diesen Host-Ordner;
      # web-nginx.conf serviert ihn unter /updates/win/. Read-only; fehlender
      # Host-Ordner => Docker legt ihn leer an (=> /updates/win/* 404, harmlos).
      - ${HOME}/pulse/updates-win:/srv/updates-win:ro
      # Direkt-Downloads (z.B. Android-APK-Testbuilds), per scp nach
      # ~/pulse/downloads/ gelegt; web-nginx.conf serviert sie unter /downloads/.
      # Bewusst getrennt vom Windows-Feed. Read-only; fehlender Ordner => 404.
      - ${HOME}/pulse/downloads:/srv/downloads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── streaming / voice servers (host network — UDP ranges) ──────────────────
  mediamtx:
    <<: *logging
    # Pulse fork of MediaMTX — injects OBU_TEMPORAL_DELIMITER for AMD-VAAPI AV1
    # (libwebrtc rejects the TD-less frames otherwise); see infra/mediamtx-fork/.
    #
    # 2026-06-16: bumped 1.17.1 → 1.19.1. We previously pinned 1.17.1 because
    # v1.18.0 regressed AMD-VAAPI AV1 (MediaMTX #5728) — that issue is now CLOSED
    # (fixed 2026-05-14, shipped in 1.19.x), so the pin reason is gone. The bump
    # fixes a separate problem: 1.17.1 took ~7-8s to establish an incoming
    # VideoToolbox-H264 track (the macOS HQ sidecar), exceeding the 10s
    # readTimeout over TLS → the publish was dropped; 1.19.1 establishes it
    # instantly. The AV1 temporal-delimiter patch still applies cleanly and is
    # kept. Rollback: revert this commit → `:1.17.1-pulse` (image still in GHCR
    # and cached on the host) + `docker compose up -d pulse_mediamtx`.
    image: ghcr.io/oblivion8282-1337/pulse-mediamtx:1.19.1-pulse7
    container_name: pulse_mediamtx
    restart: unless-stopped
    network_mode: host
    environment:
      # Feste Vollbild-Uhr AUS. MediaMTX fordert von einem WebRTC-Publisher
      # sonst alle 2 s ein Vollbild an (Upstream-Verhalten; unser Patch 0002
      # macht das ueberhaupt erst abschaltbar, und NICHT gesetzt heisst weiter
      # 2 s).
      #
      # **Warum das gesetzt sein MUSS.** Der Vollbild-Takt gehoert dem SENDER,
      # nicht dem Server: seit dem 2026-08-18 steht er auf 60 s
      # (`PULSE_KEYFRAME_SECONDS`), und das ist gemessen — 60 s statt 2 s
      # druecken das Stoss-Fenster von 4,06 auf 2,16 Prozent. Fordert der
      # Server trotzdem alle 2 s eines an, ist der Abstand faktisch wieder 2 s
      # und die Messung hinfaellig.
      #
      # Hier stand bis zum 2026-08-21 eine andere Begruendung: Intra-Refresh
      # verteile die Kosten ueber eine Auffrisch-Welle und vertrage deshalb
      # keine erzwungenen Vollbilder. Die Betriebsart ist entfernt — der
      # Schalter bleibt trotzdem noetig, nur aus dem obigen Grund.
      # Fordert der Server sie trotzdem im Takt an, beantwortet der
      # Sidecar das (seine Sperrfrist steht selbst auf 2 s, laesst also jede
      # durch), und der Strom besteht wieder aus IDR-Bursts. Der Schalter in
      # der Oberflaeche taete dann sichtbar nichts.
      #
      # Das Tueckische daran: Sender und Server arbeiten dabei jeder fuer sich
      # korrekt, kein Log und kein Zaehler schlaegt aus. Lokal (wo der Wert
      # laengst 0 ist) waere das Verhalten richtig — die Fehlersuche liefe also
      # im Code statt in dieser Datei.
      PULSE_KEYFRAME_INTERVAL: "0"
      # Die Bildmarke (AV1 Dependency Descriptor) ueber die Neuverpackung
      # tragen — Patch 0006. Ohne sie kann der Zuschauer ein VERLORENES Bild
      # nicht von einem unterscheiden, das der Sender nie erzeugt hat, und
      # fordert auf Verdacht Vollbilder an (2026-08-21 gemessen: ein halbes je
      # Sekunde bei voellig gesunder Leitung). Voller Hintergrund:
      # docs/superpowers/specs/2026-08-21-dependency-descriptor-design.md
      PULSE_DEPENDENCY_DESCRIPTOR: "1"
      # Patch 0007 (2026-09-03), wirksam ab Bild `1.19.1-pulse7`. Begruendung
      # samt Messung im Kopf des Patches.
      #
      # Verwirft MediaMTX selbst ein Bild (Uplink-Schub, Nachlieferung kam zu
      # spaet), fordert es beim Sender ein Vollbild an. Vorher tat das
      # niemand: der Zuschauer sieht einen lueckenlosen Strom, dem ein Bild
      # fehlt, und mit 60 s Vollbild-Abstand stand der Schaden bis zum
      # naechsten regulaeren Vollbild — belegt an fuenf Verwerfungen mit
      # Zuschauern und null Anforderungen am Sender.
      PULSE_KEYFRAME_ON_DISCARD: "1"
      # Umordnungsfenster fuer BILDspuren, in Paketen (Vorgabe 64 = ~150 ms
      # bei 4 Mbit/s, knapp UNTER der ersten NACK-Nachlieferung von ~160 ms).
      # 128 gibt der Nachlieferung eine zweite Runde und haelt einen echten
      # Verlust auf einer ruhigen Spur hoechstens ~1,3 s fest. Zweierpotenz.
      PULSE_VIDEO_REORDER_BUFFER: "128"
      # FlexFEC-Paritaet auf dem WHEP-Ausgang. **Bedingung dafuer, dass ein
      # Verlust ueberlebt wird** — nicht bloss eine Verbesserung: ein
      # Vollbild-Strom heilt zwar am naechsten Vollbild byte-perfekt, aber der
      # Abstand steht auf 60 s. So lange darf ein Bild nicht stehen, also muss
      # der Verlust VERHINDERT werden, statt ihn hinterher zu reparieren.
      #
      # Die Paritaet ist dabei die mittlere von drei Schichten: NACK liefert
      # nach (traegt den Hauptteil), die Vollbild-Anforderung ueber den
      # WHIP-Rueckkanal ist die letzte Rettung. Im Stoerungslauf ueber 358 s
      # mit fuenf Saettigungsphasen ergab das zusammen NULL Standbilder.
      #
      # 10:2 fest. Die Werte stehen explizit da, obwohl sie den Vorgaben
      # entsprechen: die Messreihe belegt genau dieses Verhaeltnis, und eine
      # verschobene Vorgabe soll das nicht still aendern.
      #
      # Kostet ~20 % Datenrate, und MediaMTX faechert das an JEDEN Zuschauer.
      # Grenze der Wirkung: bei GEBUENDELTEM Verlust bringt XOR nichts (Buendel
      # sind im Mittel 2,5 Pakete, eine Gruppe loest nur eine Unbekannte).
      #
      # **Die Paritaet ist verlustgeregelt** (`PULSE_FLEXFEC_ADAPTIV`,
      # Nutzer-Entscheidung 2026-08-04). Ohne die Regelung faellt der Aufschlag
      # fest an, auch auf einer Leitung, die gar nichts verliert — und
      # MediaMTX faechert ihn an JEDEN Zuschauer auf.
      #
      # **Regelgroesse ist der eingehende NACK, nicht `fraction lost`.** Hier
      # stand bis 2026-08-04, die adaptive Regelung sei widerlegt ("feste
      # Paritaet reparierte 170 Pakete, die adaptive null",
      # `fec-2026-07-31-fest-gegen-adaptiv.json`). Das galt fuer die damalige
      # Regelgroesse: der gemeldete Verlust reagiert auf bereits eingetretenen
      # Schaden, waehrend Vorwaertskorrektur vorher da sein muss, und feiner
      # als 0,39 Prozent laesst sich die Schwelle gar nicht stellen
      # (8-Bit-Wert). Der NACK dagegen sieht den Verlust roh, nennt die
      # Sequenznummern einzeln und kommt sofort.
      #
      # Gemessen mit der neuen Fassung: auf sauberer Leitung **20,01 auf 0,65
      # Prozent Aufschlag bei identischem Bild**, bei Verlust in Phasen 19,86
      # auf 12,3 bis 15,0, bei Dauerverlust unveraendert — dort wird sie
      # gebraucht. Messakte
      # `streaming/testbench/profiles/fec-2026-08-04-adaptiv-ueber-nack.json`.
      #
      # **Das Tor regelt JE ZUSCHAUER, nicht serverweit.** Es haengt an der
      # PeerConnection und liest die NACKs genau dieser Sitzung. Belegt mit
      # zwei Chromium am selben Strom (`25d34c0c`): vier Sekunden lang bekam
      # der eine Paritaet und der andere keine, im selben Prozess, zur selben
      # Zeit. Ein sauber angebundener Zuschauer zahlt also nichts, waehrend
      # ein anderer im gestoerten WLAN vollen Schutz bekommt.
      #
      # **Was das NICHT kann: nach Strom-Art unterscheiden.** Der Schalter
      # sitzt an der allgemeinen WebRTC-Verbindung. Bis zum 2026-08-21 war das
      # eine echte Einschraenkung: es gab zwei Strom-Arten, und die Paritaet
      # wurde eigentlich nur fuer die eine gebraucht (ein Intra-Refresh-Strom
      # heilt sich nach Verlust NICHT selbst, ein Vollbild-Strom am naechsten
      # Vollbild schon). Mit dem Entfernen jener Betriebsart gibt es nur noch
      # eine Art — die Unterscheidung ist damit gegenstandslos geworden, nicht
      # geloest.
      #
      # Was BLEIBT: die Selbstheilung dauert jetzt bis zu 60 s statt 2 s. Die
      # Regelung ist deshalb nicht weniger wichtig geworden, sondern mehr —
      # bezahlt wird nach tatsaechlichem Verlust.
      #
      # **Vorbehalt, der dazugehoert:** die 0,65 Prozent sind EINE Messreihe
      # vom 2026-08-04. Dieses Projekt hat sich bei diesem Thema zweimal
      # geirrt. `PULSE_FLEXFEC_ADAPTIV: "0"` faellt auf feste 10:2 zurueck,
      # `PULSE_FLEXFEC: "0"` schaltet die Paritaet ganz ab.
      PULSE_FLEXFEC: "1"
      PULSE_FLEXFEC_MEDIA: "10"
      PULSE_FLEXFEC_FEC: "2"
      PULSE_FLEXFEC_ADAPTIV: "1"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./certs:/certs:ro          # self-signed RTMPS cert (server.crt / server.key)

  livekit:
    <<: *logging
    # v1.13.3: Parität mit dem Self-Host-Image (App-Hosting braucht 1.13.1+ für
    # skip_external_ip_validation hinter NAT). Cloud hat keinen NAT-Hairpin, aber
    # gleiche Version = eine Fehlerquelle weniger. Protocol-16-kompatibel zum
    # Client (2.18.9). Umgestellt 2026-07-13.
    image: livekit/livekit-server:v1.13.3
    container_name: pulse_livekit
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/livekit.yaml"]
    environment:
      # API key/secret kept out of git — the key *name* is fixed (pulse-prod),
      # only the secret is sensitive. voice-signaling gets the same pair.
      # key name must also match webhook.api_key in livekit.yaml + voice-signaling's LIVEKIT_API_KEY
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-pulse-prod}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET required}"
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro

  # ── Self-Host-allinone-Registry ─────────────────────────────────────────────
  # Verteilt das ``pulse-allinone``-Image an Self-Host-User hinter per-Instance-
  # Credentials (Token-Auth via auth-svc /registry/token). Caddy frontet
  # registry.howispulse.com. CI (allinone.yml) pusht hierher als ``pulse-ci``
  # (REGISTRY_PUSH_TOKEN); Instanzen pullen mit client_id/client_secret.
  # Config ist self-contained (registry-config.yml) → kein env_file nötig.
  # GC läuft wöchentlich via Host-Cron (DEPLOY.md).
  registry:
    <<: *logging
    image: registry:2.8.3
    container_name: pulse_registry
    restart: unless-stopped
    volumes:
      - pulse_registry:/var/lib/registry
      - ./registry-config.yml:/etc/docker/registry/config.yml:ro
      - ./secrets/jwt_public.crt:/certs/jwt_public.crt:ro
    networks: [pulse-net]

  # ── auto-update ────────────────────────────────────────────────────────────
  # NO Watchtower here (deliberately): it mounted the Docker socket = root on
  # the host. Auto-update runs from a USER CRONTAB calling
  # `infra/prod/pulse-update.sh` (scoped pull+up of the GHCR app images, same
  # scope Watchtower had). No container holds the socket. Setup: DEPLOY.md.

volumes:
  pulse_pg:
  pulse_redis:
  pulse_avatars:
  pulse_guild_icons:
  pulse_garage:
  pulse_backups:
  pulse_chat_data:
  pulse_minio_stage:
  pulse_registry:

networks:
  pulse-net:
    name: pulse-net
    # Shared with the host Caddy container (joined via `docker network connect`),
    # so the network is created out-of-band and Compose must treat it as
    # external — otherwise `docker compose up` refuses to adopt it
    # ("network ... was found but has incorrect label").
    external: true
