# Pulse — Kernel-UDP-Puffer für WebRTC (MediaMTX + LiveKit, beide host-net).
#
# Nach /etc/sysctl.d/99-pulse.conf kopieren und mit `sysctl --system` laden
# (Anleitung: DEPLOY.md, Abschnitt "UDP buffers for WebRTC").
#
# Warum: MediaMTX bündelt ALLE WebRTC-Sitzungen (WHIP-Ingest + jeden
# WHEP-Zuschauer) auf einem einzigen UDP-Socket (:8189). Der Debian-Default
# (~212 KB je Socket) läuft bei mehreren Zuschauern × 60 fps × FlexFEC-Parität
# schon bei kurzen Scheduler-Pausen über — Paketverlust AUF DEM SERVER SELBST,
# den keine Parität reparieren kann, weil sie hinter demselben Socket sitzt.
# Sichtbar als Ruckeln beim Zuschauer trotz sauberer Leitung; nachprüfbar mit
# `ss -u -m` (Drops) unter Last.
#
# 16 MB ist eine OBERGRENZE, kein Verbrauch: Speicher wird erst belegt, wenn
# eine Anwendung ihn anfordert (LiveKit fordert aktiv große Puffer an und wird
# ohne diese Grenze still auf den Default geklemmt; LiveKits eigene Doku
# empfiehlt sogar 25 MB).
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
