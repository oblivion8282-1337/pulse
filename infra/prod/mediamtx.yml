# MediaMTX config — Pulse production (MediaMTX 1.19.1).
#
# Derived from streaming/server/mediamtx.yml.template. Mounted read-only into
# the `pulse_mediamtx` container (network_mode: host), so the addresses below
# bind the host's interfaces directly.
#
# Auth: per-channel HQ streaming via `authMethod: http` → the Pulse
# mediamtx-auth-hook (published on the host at 127.0.0.1:8005). The hook allows:
#   - publish only with a valid stream-token (issued by media-svc) for the path
#     `channel-<channel_id>`,
#   - read/playback (WHEP/HLS) for `channel-*` paths,
#   - api/metrics/pprof (also excluded here via authHTTPExclude).
# No internal users, no fixed stream key — the HQ sidecar gets its push URL
# (token in `?pass=…` or `streamid=publish:<path>:pulse:<token>`) from media-svc.
#
# Public ingest/egress ports must be open in UFW: 1936/tcp (RTMPS) and
# 8189/udp (WebRTC ICE). NOT 8890/udp — SRT is disabled below (`srt: no`, with
# the reason at that line); this header listed it until 2026-08-04 and sent
# people opening a port nothing listens on. 8889/tcp (WHEP) and 8888/tcp (HLS) are reached
# via the pulse_web nginx (host.docker.internal) → not exposed directly. The API
# (:9997) is bound on all interfaces so media-svc (on pulse-net) can poll it via
# host.docker.internal; UFW's default INPUT DROP keeps it private.

logLevel: info
logDestinations: [stdout]

# Write queue per reader, in packets (default 512). A 60 fps stream with
# FlexFEC parity runs at ~900-1100 packets/s per viewer; with the default a
# viewer that stalls for half a second (wifi, background tab) overflowed the
# queue ("reader is too slow"), MediaMTX dropped packets, the viewer NACK/PLI'd
# — a short hiccup became a visible stutter plus a CBR-softened key frame for
# everyone. 2048 carries ~2 s of backlog (~3 MB per viewer at 12 Mbit/s):
# memory traded for smoothness, and memory is the cheap side here.
writeQueueSize: 2048

# RTMP ingest — RTMPS (TLS) on :1936 only. Plain :1935 has been removed
# because media-svc only ever issues rtmps:// URLs (otherwise the per-channel
# publish token would land on the wire in cleartext). `strict` rejects any
# plain-RTMP attempt at the MediaMTX layer; UFW additionally closes 1935/tcp
# on the host. Self-signed cert (FFmpeg's rtmps client doesn't verify by
# default) — see infra/prod/DEPLOY.md.
rtmp: yes
rtmpEncryption: strict
rtmpsAddress: :1936
rtmpServerCert: /certs/server.crt
rtmpServerKey: /certs/server.key

# HLS ist AUS (2026-08-03) — es geht mit unserem Vollbild-Takt nicht zusammen,
# und niemand konsumiert es.
#
# **Die Unvertraeglichkeit:** HLS kann nur an Vollbildern segmentieren. Mit
# `PULSE_KEYFRAME_INTERVAL=0` (s. docker-compose.yml) kommen sie nur noch so
# oft, wie der SENDER sie setzt, und `hlsAlwaysRemux: yes` baute die Segmente
# auch ohne einen einzigen Zuschauer. Der Muxer starb daran lokal alle ~66 s
# mit „reached maximum segment size" und startete im Kreis neu.
#
# **Der Grund hat sich am 2026-08-21 geaendert, das Ergebnis nicht.** Hier
# stand, HLS vertrage sich nicht mit Intra-Refresh — jene Betriebsart lieferte
# ueberhaupt keine periodischen Vollbilder mehr. Sie ist entfernt. Geblieben ist
# der Vollbild-Abstand von 60 s (`PULSE_KEYFRAME_SECONDS`, seit 2026-08-18):
# Segmente von einer Minute reissen dieselbe Grenze, nur langsamer. Wer diesen
# Block wieder scharf stellen will, weil „Intra-Refresh ja weg ist", laeuft
# also in denselben Absturz.
#
# **Warum Abschalten und kein Kompromiss:** Kein Pulse-Client spricht HLS an.
# Der HQ-Stream laeuft ueber WHEP, und die Watch-Party lehnt `.m3u8` sogar
# ausdruecklich ab (der Betrachter ist ein nacktes `<video>`, das Chromium
# nicht nativ abspielt — s. `web/src/lib/watch/source.ts`). Ein `hlsAlwaysRemux:
# no` haette den Absturz nur bis zum ersten Aufruf von `/hls/` verschoben.
#
# Zurueckholen: diesen Block wieder scharf stellen UND `PULSE_KEYFRAME_INTERVAL`
# entfernen — beides zusammen, sonst kehrt die Absturzschleife zurueck. Damit
# faellt allerdings der lange Vollbild-Abstand weg, und der ist gemessen: 60 s
# statt 2 s druecken das Stoss-Fenster von 4,06 auf 2,16 Prozent
# (Wurzel-`CLAUDE.md`, Abschnitt HQ-Streaming).
hls: no

# WebRTC / WHEP (reached via pulse_web → /whep/*; ICE on :8189/udp direct)
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# With network_mode: host MediaMTX sees every host interface — loopback,
# docker bridges, link-local IPv6 — and used to advertise them all as ICE
# candidates. `webrtcIPsFromInterfaces: no` was supposed to gate that, but
# MediaMTX 1.17.1 still leaks the docker-bridge `fe80::...` link-local v6
# into the SDP whenever an IPv6 address sits in webrtcAdditionalHosts
# (pion/ice picks the bridge as outbound source for that family). Remote
# viewers then waste their first 1-3 ICE-probe rounds on the unreachable
# fe80:: candidate — `deadline exceeded` for ~10s each, so WHEP playback
# took up to a minute to start. Dropping the public IPv6 here forces
# IPv4-only candidates and the leak disappears. Confirmed via lokal repro
# (see git log d88644c / 2dc753f): with IPv6 absent, no fe80:: appears in
# the SDP and republish reconnects in <100ms.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts:
  - 159.195.150.54

# Control API. MediaMTX runs network_mode:host, and media-svc reaches this
# from its container via host.docker.internal (the Docker bridge gateway IP,
# NOT loopback) — so binding 127.0.0.1 here would refuse that connection and
# break the stream-state poller. MediaMTX 1.19 REMOVED `apiAllowAddresses`
# (replaced by the auth system / apiTrustedProxies), so access control here now
# relies solely on UFW: port 9997 only accepts traffic from the Docker bridge
# (`ufw allow from 10.0.0.0/8 to any port 9997`) and the default INPUT DROP
# blocks external reach (the API stays excluded from auth via authHTTPExclude).
# See CLAUDE.md and DEPLOY.md.
api: yes
apiAddress: :9997

# RTSP not needed — RTMP + SRT cover ingest
rtsp: no

# SRT ingest disabled: stream tokens would travel in cleartext UDP (no TLS).
# media-svc mints RTMPS *or* WHIP tokens (request field `protocol`, pattern
# `^(rtmp|whip)$`) — and since 2026-08-18 the client asks unconditionally for
# WHIP (`web/src/lib/stream/settings.svelte.ts::pushProtokoll`), so in practice
# every push is WHIP; RTMPS stays available for networks that block UDP. SRT is
# minted in neither case. If a future Opus-audio path requires SRT, issue
# separate SRT-only short-lived tokens and document the cleartext risk.
srt: no

# === AUTH ===
authMethod: http
authHTTPAddress: http://127.0.0.1:8005/
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

paths:
  # Pulse HQ channel streams are named `channel-<snowflake>`. Every connection is
  # allowed/denied by the auth hook; this default entry just lets MediaMTX accept
  # the (dynamic) paths at all. Non-`channel-*` paths are rejected by the hook.
  all_others:
