[project]
name = "discord-clone"
version = "0.1.0"
description = "Discord clone monorepo - backend services + shared libs"
requires-python = ">=3.13,<3.15"

[tool.uv.workspace]
members = [
    "shared",
    "services/auth",
    "services/chat-gateway",
    "services/voice-signaling",
    "services/media-svc",
    "services/mediamtx-auth-hook",
    "services/relay-frps-plugin",
    "streaming",
]

[tool.uv.sources]
dcc-shared = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Per-test hard timeout: a hung `ws.receive_json()` (real Redis pub/sub
# fan-out races) used to stall the whole CI job until the runner's 6h
# ceiling. 30s is generous for every test we have and turns a hang into
# a fast failure that the CI re-run can recover from.
addopts = "-v --tb=short --import-mode=importlib --timeout=30 --timeout-method=thread"
testpaths = [
    "shared/tests",
    "services/auth/tests",
    "services/chat-gateway/tests",
    "services/voice-signaling/tests",
    "services/media-svc/tests",
    "services/mediamtx-auth-hook/tests",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-rerunfailures>=16.0",
    "pytest-timeout>=2.3.0",
]
