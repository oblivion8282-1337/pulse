<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Update</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #f1f5f9;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 400px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background-image: url('./pulse-mark.svg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .status {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
    }

    .progress-container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%);
      border-radius: 8px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 13px;
      color: #64748b;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .indeterminate .progress-bar {
      animation: pulse 1.5s ease-in-out infinite;
      width: 60%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"></div>
    <h1 id="title">Update wird geladen</h1>
    <p class="status" id="status">Bitte warten...</p>
    <div class="progress-container indeterminate" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="progress-text" id="progressText"></p>
  </div>

  <script>
    // Warte auf DOM-ready und dass window.splash verfügbar ist
    document.addEventListener('DOMContentLoaded', () => {
      const title = document.getElementById('title');
      const status = document.getElementById('status');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const progressContainer = document.getElementById('progressContainer');

      // Fallback: Wenn window.splash nicht verfügbar ist, zeige zumindest den initialen Status
      if (!window.splash) {
        console.error('[splash] window.splash nicht verfügbar - preload nicht geladen?');
        status.textContent = 'Initialisiere...';
        return;
      }

      // Status updates from main process via IPC
      try {
        window.splash.onProgress((payload) => {
          // `payload` kommt via contextBridge aus electron-updater — ist immer
          // ein plain Object mit serialisierten Feldern. KEIN `as Record<...>`
          // Cast hier: das ist TypeScript-Syntax, Browser-JS kennt das nicht
          // und wirft SyntaxError, was den gesamten onProgress-Callback unnuetz
          // macht. Vanilla-Destrukturieren reicht — undefined Properties werden
          // im HTML mit `|| ''` / typeof-checks abgefangen.
          const { type, version, percent, message } = payload;

          switch (type) {
            case 'checking':
              title.textContent = 'Update wird geprüft';
              status.textContent = 'Bitte warten...';
              progressContainer.classList.add('indeterminate');
              progressText.textContent = '';
              break;

            case 'downloading':
              title.textContent = 'Update wird geladen';
              status.textContent = `Version ${version || ''}`;
              // `indeterminate` rausnehmen, damit die CSS-Animation stoppt
              // und der `width`-Übergang echt zwischen den Prozentwerten
              // animiert (0.3s ease).
              progressContainer.classList.remove('indeterminate');
              if (typeof percent === 'number') {
                const pct = Math.round(percent);
                // Beim allerersten Download-Event ist percent oft 0 oder sehr
                // klein — die Bar würde von 60 % (indeterminate) auf 0 %
                // springen. Wir setzen den Style erst ab ~1 %, sodass der
                // Übergang smooth aus indeterminate rausläuft.
                if (pct >= 1) {
                  progressBar.style.width = `${pct}%`;
                }
                progressText.textContent = `${pct} %`;
              }
              break;

            case 'installing':
              title.textContent = 'Update wird installiert';
              status.textContent = 'Die App startet gleich neu...';
              progressContainer.classList.add('indeterminate');
              progressText.textContent = '';
              break;

            case 'ready':
              title.textContent = 'Update bereit';
              status.textContent = `Version ${version || ''} — die App startet gleich`;
              progressBar.style.width = '100%';
              progressText.textContent = '100 %';
              break;

            case 'no-update':
              title.textContent = 'Starte Pulse...';
              status.textContent = 'Kein Update verfügbar';
              progressContainer.classList.add('indeterminate');
              progressText.textContent = '';
              break;

            case 'error':
              title.textContent = 'Fehler';
              status.textContent = typeof message === 'string' ? message : 'Update fehlgeschlagen';
              progressBar.style.background = '#ef4444';
              progressContainer.classList.remove('indeterminate');
              progressText.textContent = '';
              break;
          }
        });
      } catch (err) {
        console.error('[splash] Fehler beim Registrieren des Progress-Handlers:', err);
        status.textContent = 'Fehler beim Laden';
      }
    });
  </script>
</body>
</html>
