# electron-builder — Windows-NSIS-Installer mit Auto-Update.
#
# Erzeugt einen NSIS-Installer `Pulse-Setup-<version>.exe` (per-User, assistierter
# Wizard, kein UAC) + die Auto-Update-Artefakte `latest.yml` + `.blockmap`. Der Installer
# bündelt die Electron-Runtime + das esbuild-Bundle (main/preload) + den
# HQ-Streaming-Sidecar (`pulse-win-hq-sidecar.exe` + FFmpeg-DLLs).
#
# Auto-Update: electron-updater (s. `electron/updater.ts`) pollt beim Start den
# generic-Feed unter `publish.url` (→ `latest.yml`), lädt neue Versionen selbst
# und installiert sie beim nächsten Beenden bzw. sofort per Banner-Button. Die
# CI (`.github/workflows/win-build.yml`) rsynct Setup-.exe + latest.yml +
# .blockmap nach howispulse.com (gleiches Muster wie der Flatpak-OSTree-Push).
#
# Eine .exe deckt NVIDIA *und* AMD ab — der Sidecar erkennt die GPU selbst und
# wählt den Pfad (NVIDIA-Zero-Copy / AMD-CPU).
#
# Voraussetzung: der Sidecar ist vorher release-gebaut
# (`cargo build --release` in `streaming/win-hq-sidecar/`) — `extraResources`
# zieht die Artefakte direkt aus dessen `target/release/`. Die Web-Oberfläche
# wird NICHT mitgepackt: die App lädt sie von `https://howispulse.com`.
appId: com.howispulse.pulse
productName: Pulse
directories:
  output: release
  # Branding-Assets für den NSIS-Wizard liegen hier (NICHT `build/` — das ist global
  # .gitignore'd, Zeile 17). electron-builder findet installerSidebar.bmp / installerHeader.bmp
  # / installer-/uninstallerIcon.ico / uninstallerSidebar.bmp hier per Namenskonvention.
  buildResources: build-resources
# Was in die app.asar wandert — das esbuild-Bundle + package.json (für das
# `main`-Feld) + das App-Icon. `electron-updater` steht in package.json unter
# `dependencies` (Production) und wird von electron-builder über den
# Dependency-Walker AUTOMATISCH samt Transitiv-Deps in die asar gezogen — die
# `files`-Allowlist filtert nur App-Sourcen, nicht die Production-node_modules.
# main.cjs ist esbuild-gebündelt (electron + electron-updater sind `--external`,
# werden also zur Laufzeit aus node_modules / der Runtime aufgelöst).
# `electron/icon.png` MUSS mit rein: `main.ts`/`tray.ts` laden es zur Laufzeit
# über `path.join(__dirname, '..', 'icon.png')` (= electron/icon.png in der asar)
# für das Fenster-/Taskbar-/Tray-Icon. Ohne diesen Eintrag fehlt das Icon im
# gepackten Build (in Dev liegt die Datei real da, deshalb fiel's nicht auf).
files:
  - electron/dist/**/*
  - electron/icon.png
  - package.json
# Sidecar + FFmpeg-DLLs landen NEBEN der asar unter resources/hq-sidecar/ —
# eine .exe + DLLs können nicht in die asar. Der Resolver in sidecar.ts findet
# sie über process.resourcesPath.
extraResources:
  - from: ../streaming/win-hq-sidecar/target/release
    to: hq-sidecar
    filter:
      - pulse-win-hq-sidecar.exe
      - "*.dll"
win:
  target: nsis
  # Echtes Multi-Size-.ico (16–256px, aus electron/icon.png generiert) — wird in die
  # .exe eingebettet UND als App-Icon genutzt. WICHTIG: ein PNG hier reicht NICHT fürs
  # exe-Embedding via rcedit; es muss ein .ico sein.
  icon: build-resources/icon.ico
  # signAndEditExecutable=true: electron-builder bettet via rcedit das Icon + Versions-
  # Infos in die .exe ein. OHNE das blieb das exe-Datei-Icon das generische Electron-
  # Atom → der Windows-Taskleisten-Button (der das .exe-/Verknüpfungs-Icon nutzt, nicht
  # das zur Laufzeit gesetzte Fenster-Icon) zeigte das Default-Icon. Fenster- + Tray-Icon
  # waren schon korrekt (main.ts/tray.ts setzen sie aus icon.png zur Laufzeit).
  #
  # Der frühere "Cannot create symbolic link"-Fehler stammte vom winCodeSign-Entpacken
  # OHNE Entwicklermodus (lokal). rcedit (reines Icon-/Resource-Editieren) braucht
  # winCodeSign NICHT — das wird nur fürs echte Signieren geladen, und ohne Zertifikat
  # signiert electron-builder nicht. Auf den GitHub-Windows-Runnern läuft das Embedding
  # durch. (Unsigniert bleibt's weiterhin → SmartScreen-Warnung beim Erst-Download;
  # Auto-Update verifiziert über SHA512 aus latest.yml, nicht über die Signatur.)
  signAndEditExecutable: true
# Assistierter NSIS-Wizard (gebrandet), per-User → kein UAC/Admin nötig (passt zu
# unsigniert). per-User landet unter %LOCALAPPDATA%\Programs\Pulse; electron-updater
# installiert Updates an denselben Ort ohne Elevation (Auto-Update ruft den Installer
# mit /S silent auf — der assistierte Wizard erscheint dabei NICHT, nur beim echten
# Erst-Install per Doppelklick).
#
# Vorher war's `oneClick: true` (stiller Installer ganz ohne Fenster) — verwirrend,
# weil der Erst-Install ohne jedes Feedback durchlief und die App (die ihre UI erst
# nach Remote-Load von howispulse.com via `ready-to-show` einblendet) "scheinbar nicht
# startete". Der Wizard mit Welcome-/Fortschritts-/Finish-Seite macht den Install sichtbar.
#
# Branding-Assets liegen unter `build-resources/` (s. directories.buildResources) und
# werden von electron-builder per Namenskonvention automatisch eingebunden:
# installerSidebar.bmp (164×314, Welcome/Finish),
# installerHeader.bmp (150×57, Innenseiten), installer-/uninstallerIcon.ico (Setup-
# Datei-Icon — greift auch ohne signAndEditExecutable, da NSIS sein eigenes Icon setzt),
# uninstallerSidebar.bmp. Generiert aus electron/icon.png (dunkler Verlauf + Logo + Wortmarke).
nsis:
  oneClick: false                          # assistierter Wizard statt stillem Install
  perMachine: false                        # per-User → kein UAC
  allowToChangeInstallationDirectory: false # fixe Location (Discord-Stil), kein Verzeichnis-Dialog
  runAfterFinish: true                     # Finish-Seite: "Pulse jetzt starten"-Häkchen
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Pulse-Setup-${version}.exe
  deleteAppDataOnUninstall: false
# Auto-Update-Feed (generic). electron-builder schreibt daraus `app-update.yml`
# in resources/ (electron-updater liest es zur Laufzeit) und erzeugt `latest.yml`
# neben der Setup-.exe in release/. Der tatsächliche Upload macht NICHT
# electron-builder (Build läuft mit `--publish never`), sondern der rsync-Step
# in win-build.yml — diese URL muss exakt der nginx-Route /updates/win/ matchen.
publish:
  provider: generic
  url: https://howispulse.com/updates/win/
