<!DOCTYPE html>
<!-- deployed via GitHub Actions → GHCR → Watchtower on the VPS -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <!-- interactive-widget=resizes-content: the virtual keyboard shrinks the
         layout viewport (Android Chrome) so the bottom composer stays visible
         instead of being hidden behind the keyboard. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- theme-color matches the light/dark brand accent (see app.css --brand);
         drives the Android address-bar tint when the PWA is installed and the
         iOS standalone status-bar background. -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: dark)" />
    <!-- FOUC-Schutz: liest die gespeicherte Erscheinungsbild-Einstellung
         (settings.appearance.theme aus dcc.settings) und setzt die .dark-Klasse
         vor dem ersten Paint. 'system' folgt prefers-color-scheme. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('dcc.settings');
          var theme = raw ? (JSON.parse(raw).appearance || {}).theme : null;
          if (theme !== 'light' && theme !== 'dark' && theme !== 'system') theme = 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <!--
      CSP-Hinweis (Security-Audit 2026-09-16): es gibt KEIN Meta-CSP mehr hier.
      Produktion: header aus infra/prod/security-headers.inc (bzw. Self-Host-
      Caddy) — ohne 'unsafe-inline'/'unsafe-eval' für Scripte; der FOUC-Inline-
      Script oben läuft dort unter seinem sha256-Hash. Dev: vite.config.ts
      setzt server.headers mit der grosszuegigeren Policy (Vite HMR braucht
      unsafe-eval). Erläuterungen zu blob:/youtube/twitch/stun: stehen dort.
    -->
    <title>Pulse</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
