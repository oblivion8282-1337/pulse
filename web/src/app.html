<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- FOUC-Schutz: liest die gespeicherte Erscheinungsbild-Einstellung
         (settings.appearance.theme aus dcc.settings) und setzt die .dark-Klasse
         vor dem ersten Paint. 'system' folgt prefers-color-scheme. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('dcc.settings');
          var theme = raw ? (JSON.parse(raw).appearance || {}).theme : null;
          if (theme !== 'light' && theme !== 'dark' && theme !== 'system') theme = 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <!--
      CSP for dev/SPA. In production, set this via Caddy response headers instead
      (more flexible and not bypassable by meta-tag injection).
      style-src unsafe-inline: required by Tailwind v4 + shadcn-svelte inline styles.
      script-src unsafe-inline + unsafe-eval: required by Vite dev HMR and SvelteKit SSR bootstrap.
      script-src blob:: the DeepFilterNet3 noise-suppression AudioWorklet is loaded from a blob: URL
      (AudioWorklet module loading falls back to script-src/script-src-elem in Chrome).
      In production, tighten via Caddy response headers (add nonce or hash, drop unsafe-*)
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" />
    <title>Pulse</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
