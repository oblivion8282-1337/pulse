[project]
name = "dcc-shared"
version = "0.1.0"
description = "Shared utilities for Discord-Clone services"
requires-python = ">=3.13,<3.15"
dependencies = [
    # Event-Schema-Registry (dcc_shared.events) uses Pydantic v2 BaseModels.
    # Every Pulse service already pulls pydantic transitively (FastAPI), so
    # this is a hard-pin of an existing dep, not a new one.
    "pydantic>=2.7",
    # Self-Host session-token validation (dcc_shared.session_tokens). Both
    # pyjwt[crypto] and cryptography are already direct deps of every backend
    # service that imports this module (auth/chat-gateway/voice-signaling), so
    # these are hard-pins of existing transitive deps, not new dependencies.
    "pyjwt[crypto]>=2.10",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_shared"]
