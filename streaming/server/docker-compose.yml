# MediaMTX als Streaming-Server (Dev: lokal; Prod: VPS — T5c)
# Version gepinnt damit Watchtower nichts kaputt-updatet
#
# Ports:
#   1935 (TCP) - RTMP-Ingest  (Auth: authHTTP → Pulse mediamtx-auth-hook, Token als ?pass=…)
#   1935        … bzw. SRT 8890 (Auth via streamid=publish:<path>:pulse:<token>)
#   8888 (TCP) - HLS read     (Auth: authHTTP — T5a: anonym für channel-*; T5b: Member-Token)
#   8889 (TCP) - WebRTC/WHEP read
#   8189 (UDP) - WebRTC ICE
#   9997 (TCP) - API, NUR localhost-bind  (media-svc pollt /v3/paths/list darüber)
#
# `authHTTPAddress: http://localhost:8005/` in mediamtx.yml zeigt auf den
# mediamtx-auth-hook. Funktioniert dank `network_mode: host`: localhost:8005 im
# Container = Host-localhost = wo der Hook via `uvicorn dcc_mediamtx_auth_hook.app:app`
# lauscht. Im Dev müssen also media-svc (8004) + auth-hook (8005) lokal laufen,
# wenn man den authHTTP-Flow live testen will.

services:
  mediamtx:
    # Pulse-Fork von 1.19.1 — der Grund für den Fork und alle fünf Patches
    # stehen im Kopf von `infra/mediamtx-fork/Dockerfile`.
    #
    # `-pulse2` bringt die vier Labor-Patches dazu: den Rückweg für
    # Vollbild-Anforderungen, den abschaltbaren Keyframe-Takt, FlexFEC und die
    # verlustgeregelte Parität. Der Patch-Stand steht seit 2026-08-04 im Tag
    # (`PULSE_REVISION` im Dockerfile) — vorher hieß jeder Bau `-pulse`.
    #
    # **Aus der Registry, nicht lokal gebaut.** Hier stand bis 2026-08-04 ein
    # `docker build`-Hinweis, weil das Image damals nur auf einer Maschine
    # existierte. Seit die Patches auf `main` sind, baut der Workflow es — Dev
    # und Produktion ziehen damit denselben Digest, und niemand muss MediaMTX
    # selbst übersetzen.
    #
    # ACHTUNG beim Versions-Bump: der TAG allein sagt nichts darueber, was
    # laeuft. Am 2026-07-26 stand hier bereits 1.19.1-pulse, waehrend lokal
    # beide Tags auf denselben Digest eines 1.17.1-Images zeigten — der
    # Container meldete `v1.17.1-dirty`. Nach einem Bump also
    # `docker logs streaming-mediamtx | head -1` pruefen, nicht den Tag glauben.
    image: ghcr.io/oblivion8282-1337/pulse-mediamtx:1.19.1-pulse5
    container_name: streaming-mediamtx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./certs:/certs:ro
    environment:
      # Der 2-Sekunden-Takt, mit dem MediaMTX jeden WebRTC-Sender nach einem
      # Vollbild fragt. Er muss weg, weil der Vollbild-Takt dem SENDER gehört:
      # seit dem 2026-08-18 steht er auf 60 s (`PULSE_KEYFRAME_SECONDS`), und
      # fordert der Server trotzdem alle 2 s eines an, ist der Abstand faktisch
      # wieder 2 s. RTMP-Sender berührt er nicht. Leer/unbesetzt =
      # Upstream-Verhalten (2 s).
      #
      # Hier stand bis zum 2026-08-21 „für Intra-Refresh ist er Gift" — jene
      # Betriebsart ist entfernt, der Schalter bleibt aus dem obigen Grund
      # nötig.
      PULSE_KEYFRAME_INTERVAL: "0"
      # Die Bildmarke (AV1 Dependency Descriptor) ueber die Neuverpackung
      # tragen — Patch 0006. Ohne sie kann der Zuschauer ein VERLORENES Bild
      # nicht von einem unterscheiden, das der Sender nie erzeugt hat, und
      # fordert auf Verdacht Vollbilder an (2026-08-21 gemessen: ein halbes je
      # Sekunde bei voellig gesunder Leitung). Voller Hintergrund:
      # docs/superpowers/specs/2026-08-21-dependency-descriptor-design.md
      PULSE_DEPENDENCY_DESCRIPTOR: "1"
      # FlexFEC bleibt im lokalen Dev-Stack AUS. Sie kostet jeden Zuschauer
      # Datenrate, und das gehört nicht in denselben Testlauf wie eine andere
      # Maßnahme gegen Verlust — sonst laufen zwei im selben Durchgang und
      # keine ist zuzuordnen. Zum Zuschalten: PULSE_FLEXFEC: "1".
      #
      # **Das ist bewusst NICHT die Produktionseinstellung, und der Unterschied
      # ist der teure Teil dieser Zeile:** Cloud und Remote-Dev-Stack fahren
      # `PULSE_FLEXFEC=1` mit `PULSE_FLEXFEC_ADAPTIV=1` (Begründung samt
      # Messreihe in `infra/prod/docker-compose.yml`). Ein Verhalten, das an der
      # Parität hängt, ist hier also nicht nachstellbar — wer so etwas jagt,
      # schaltet zu oder nimmt den Remote-Dev-Stack.
      #
      # Hier standen bis zum 2026-08-27 ZWEI Kommentarblöcke übereinander, die
      # sich widersprachen: der zweite sagte „dieselbe Einstellung wie auf dem
      # Testserver: feste Rate […] NICHT adaptiv" über einem Wert, der die
      # Parität ganz abschaltet — und der Testserver ist seit dem 2026-08-04
      # adaptiv. Er ist ein Rest aus der Zeit, als hier "1" stand.
      PULSE_FLEXFEC: ""
      PULSE_FLEXFEC_MEDIA: "10"
      PULSE_FLEXFEC_FEC: "2"
    # network_mode: host weil WebRTC-ICE auf UDP sonst kompliziert wird mit Port-Mapping
    # (Memory-Regel: bei Docker-Port-Range lieber host-Netzwerk) — und es macht den
    # auth-hook auf dem Host (localhost:8005) für MediaMTX direkt erreichbar.
    labels:
      # Watchtower-Hinweis: dieses Image NICHT auto-updaten
      - "com.centurylinklabs.watchtower.enable=false"

  # Static-File-Server für player.html (Stats-Browser-Player)
  # Eigener Port 8000, kein Konflikt mit existierendem Caddy auf 80/443
  player:
    image: nginx:1.27-alpine
    container_name: streaming-player
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./player.html:/usr/share/nginx/html/index.html:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
