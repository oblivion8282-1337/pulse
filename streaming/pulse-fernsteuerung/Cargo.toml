[package]
name = "pulse-fernsteuerung"
version = "0.1.0"
edition = "2024"
publish = false
description = "Plattformfreier Kern der Pulse-Fernsteuerung — Frame-Format, Sitzung, Klemmrechnung"

# Grundsatz bleibt: keine Abhaengigkeit, die einen Bauweg beschwert. Dieselbe
# Regel wie in `pulse-zeitbasis/Cargo.toml`. Eine Ausnahme, nachgemessen:
# `serde_json` steht bereits in allen vier Verbrauchern (win-hq-sidecar,
# mac-hq-sidecar, linux-hq-sidecar, pulse-player) — es beschwert deshalb
# keinen Bauweg, der nicht ohnehin schon dafuer bezahlt. Die Grenze bleibt
# hart: jede WEITERE Abhaengigkeit braucht dieselbe Nachmessung und eine
# eigene Entscheidung, sonst rutscht die naechste mit derselben Begruendung
# hinein.
[dependencies]
serde_json = "1"

# Das Zeigerbild-Format der Fernsteuerung — Schwesterkiste, keine Fremdquelle,
# und selbst abhaengigkeitsfrei. Sie beschwert deshalb keinen Bauweg: die beiden
# Programme, die an dieser Kiste haengen (win-hq-sidecar, pulse-player), nennen
# sie ohnehin schon direkt. Gebraucht seit dem 2026-08-23 von `zeigerbuch`, das
# die Zeigerform-Buchfuehrung traegt und dafuer `Zeigerbild` samt `packen()`
# und `kennung()` kennen muss.
pulse-zeigerbild = { path = "../pulse-zeigerbild" }
