[package]
name = "pulse-hq-labor"
version = "0.1.0"
edition = "2024"
publish = false
# Kein `license`-Feld — es gilt `streaming/LICENSE` (Pulse Client License 1.0),
# wie bei allen Crates unter `streaming/`. Siehe die Begruendung in
# `../linux-hq-sidecar/Cargo.toml`.
description = "Messstand für den experimentellen HQ-Sendeweg (eigener WebRTC/WHIP-Push, AV1-Paketierer; bis zum 2026-08-21 auch Intra-Refresh, das an dem Tag aus Pulse entfernt wurde). Protokoll-gleich mit dem ausgelieferten Sidecar, aber ein EIGENES Binary — nichts hiervon geht in einen Nutzer-Build."

# Ein eigenes Artefakt, absichtlich anders benannt als das ausgelieferte
# `pulse-linux-hq-sidecar`. Das Flatpak-Manifest baut ausschliesslich jenes;
# was hier entsteht, faehrt nur der Pruefstand ueber $PULSE_LINUX_HQ_SIDECAR.
[[bin]]
name = "pulse-hq-labor"
path = "src/main.rs"

[dependencies]
# Nur was main.rs/lib.rs selbst anfassen: der Rest (FFmpeg, ashpd/pipewire,
# webrtc, tokio, …) kommt ausschliesslich ueber die Sidecar-Bibliothek, deren
# Manifest dafuer die Quelle der Wahrheit ist (Ponytail-Audit Runde 2,
# 2026-09-21: die Kopie hier behauptete einen eigenen Sendepfad, den es seit
# dem 2026-08-02 nicht mehr gibt).
pulse-linux-hq-sidecar = { path = "../linux-hq-sidecar" }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

[profile.release]
opt-level = 3
# fat-LTO: der heiße Pfad (Frame-Drain → Import → Encode) läuft pro Frame bei
# bis zu 1000fps — cross-crate-Inlining lohnt, Build-Zeit ist uns egal.
lto = "fat"
codegen-units = 1
strip = true
