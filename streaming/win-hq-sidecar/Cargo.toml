[package]
name = "pulse-win-hq-sidecar"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pulse Windows HQ-streaming sidecar — stdio JSON-RPC over newline-delimited JSON, mirrors streaming/gsr-sidecar/control.py"

[[bin]]
name = "pulse-win-hq-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Token-Maskierung, seit 2026-08-20 gemeinsam mit linux/mac in einer eigenen
# Crate. `src/redact.rs` bleibt als Re-Export bestehen (s. dort).
pulse-redact = { path = "../pulse-redact" }

# Stage 2: DXGI-Adapter-Enum (real `gpu_info` + populates `health.gsr.vendor`).
# Features kept narrow — only what the adapter walk + COM init needs.
windows = { version = "0.62", features = [
    "Foundation_Metadata", # ApiInformation: WGC-Session-Properties OS-gated prüfen (capture/mod.rs)
    "Graphics_Capture", # GraphicsCaptureSession: Cursor zur Laufzeit aus dem Stream nehmen (capture/cursorsteuerung.rs)
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dwm", # DWMWA_CLOAKED: unsichtbare Shell-Fenster aus dem Picker filtern (ops/list_windows.rs)
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem", # GetFileVersionInfoW/VerQueryValueW: App-Anzeigename (system/app_name.rs)
    "Win32_System_Com",
    "Win32_System_Kernel",
    "Win32_System_Performance", # QueryPerformanceCounter: prueft, ob WGC- und WASAPI-Zeitstempel auf derselben Uhr liegen (syncprobe.rs)
    "Win32_Media", # timeBeginPeriod: Systemtimer auf 1 ms für die Tokio-Wartezeiten des WHIP-Wegs (main.rs)
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging", # IsIconic + GetWindowPlacement: Minimiert-Check vor dem FSE-Fallback (capture/source.rs)
    "Win32_UI_Input_KeyboardAndMouse", # SendInput: Maus-/Tastatur-Injektion der Fernsteuerung (remote_input/)
    "Win32_UI_HiDpi", # SetProcessDpiAwarenessContext: ohne das trifft die Injektion bei Skalierung != 100 % daneben (remote_input/injektion.rs)
    "Win32_System_Variant",
] }

# Stage 3: per-app audio enum for `list_application_audio`. The crate wraps
# IAudioSessionManager2 + IAudioSessionEnumerator + IAudioSessionControl2;
# we read each session's process-id and dedupe by process name.
wasapi = "0.23"

# PID → process-name resolver (sysinfo wraps QueryFullProcessImageNameW).
sysinfo = "0.32"

# Stage 5: WGC + DXGI-DDA capture. NiiightmareXD's crate wraps both APIs and
# exposes Monitor/Window enumeration without a picker UI — important because we
# pick the source in the Pulse UI, not via the Win32 picker dialog.
windows-capture = "2"

# Stage 7: FFmpeg-Bindings für Encode (NVENC/AMF/QSV) + Mux (FLV/MPEGTS) +
# RTMPS-Push. Linkt gegen die BtbN-LGPL-Shared-Distribution in
# `ffmpeg-dist/n8.1-lgpl-shared/` (FFMPEG_DIR in `.cargo/config.toml`).
# KEIN `build`-Feature (würde FFmpeg aus Source bauen — wir wollen die
# LGPL-DLLs nutzen). KEIN `filter`-Feature mehr: der GPU-Downscale läuft jetzt
# über `ID3D11VideoProcessor` (`encode/d3d11_scale.rs`) statt einen
# libavfilter-`scale_cuda`-Graph.
ffmpeg-next = { version = "8.1", default-features = false, features = [
    "codec",
    "format",
    "software-resampling", # swresample für Sample-Rate-Mismatches (44.1k Games vs 48k Browser)
    "software-scaling",    # swscale für BGRA→NV12-Konversion (CPU-Fallback)
] }

# Eigener WebRTC-Sendeweg (WHIP), s. `src/whip/`.
#
# WARUM nicht ffmpegs WHIP-Muxer: der hat KEINEN Rueckkanal zur Anwendung — eine
# Vollbild-Anforderung des Zuschauers koennte den Encoder also nie erreichen —
# und er kann kein AV1 (in ffmpeg 8.1 UND master geprueft, nur H.264). Bei
# Intra-Refresh ist der Rueckkanal keine Zugabe, sondern Voraussetzung: dieser
# Strom hat nach dem Start kein Vollbild mehr, ohne Anforderung kommt ein neu
# dazukommender Zuschauer gar nicht erst ins Bild.
#
# Dieselben Fassungen wie im Linux-Sidecar, im nativen Player und in
# `streaming/pulse-remote-webrtc`. Auseinanderlaufende webrtc-rs-Versionen
# waeren die Sorte Fehler, die sich erst in der SDP-Verhandlung zeigt.
# MIT/Apache-2.0, kein GPL.
#
# Sie waechst den Sidecar spuerbar — auch fuer Nutzer, die den Weg nie waehlen.
# Bewusst in Kauf genommen, weil er Standard werden soll; ein Cargo-Feature
# dafuer waere eine zweite Bauvariante, die auseinanderlaeuft.
webrtc = "0.17"
rtcp = "0.17"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Nur fuer den WHIP-Handschlag (ein POST mit dem SDP). rustls statt der
# System-TLS, wie im Player — webrtc bringt rustls ueber `dtls` ohnehin
# verpflichtend mit, zwei TLS-Stacks im selben Binary waeren Ballast.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
# NUR für `examples/probe_vulkan_sps.rs` — Diagnose-Probe, die
# `vkGetEncodedVideoSessionParametersKHR` direkt aufruft, um die vom GPU-Treiber
# serialisierten H.264-SPS/PPS-Roh-Bytes zu dumpen (AMD-Vulkan-Encode-Analyse).
# Bewusst NUR dev-dependency — der Sidecar selbst nutzt FFmpeg, kein rohes
# Vulkan. `ash` lädt `vulkan-1.dll` zur Laufzeit, braucht kein Vulkan-SDK.
ash = "0.38"

[[example]]
name = "capture_smoke"
path = "examples/capture_smoke.rs"

[[example]]
name = "audio_smoke"
path = "examples/audio_smoke.rs"

[[example]]
name = "ffmpeg_smoke"
path = "examples/ffmpeg_smoke.rs"

[[example]]
name = "encode_smoke"
path = "examples/encode_smoke.rs"

[[example]]
name = "rtmp_smoke"
path = "examples/rtmp_smoke.rs"

[[example]]
name = "test_driver"
path = "examples/test_driver.rs"

[[example]]
name = "probe_vulkan_sps"
path = "examples/probe_vulkan_sps.rs"

[[example]]
name = "probe_d3d12_zerocopy"
path = "examples/probe_d3d12_zerocopy.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Der Zweig unter `vendor/` wird von `scripts/bootstrap-windows-capture.sh`
# hergestellt (crates.io-Tarball 2.0.0, SHA-gepinnt, plus
# `patches/0001-...patch`) und ist gitignored. Delta gegen 2.0.0: die Crate
# reicht die WGC-Session einmal an den Handler durch (`on_session_ready`),
# damit der Cursor während der Fernsteuerung zur Laufzeit aus der Aufnahme
# genommen werden kann (`capture/cursorsteuerung.rs`). Ohne den Zweig bricht
# cargo beim Auflösen ab — erst das Bootstrap-Skript laufen lassen.
[patch.crates-io]
windows-capture = { path = "vendor/windows-capture" }
