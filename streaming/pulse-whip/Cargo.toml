[package]
name = "pulse-whip"
version = "0.1.0"
edition = "2024"
publish = false

# anyhow und webrtc stehen bereits in allen drei Sidecars in genau diesen
# Fassungen — es kommt nichts Neues hinzu. pulse-zeitbasis dagegen ist ein
# Befund aus dieser Etappe, kein Punkt aus der urspruenglichen Planung: av1.rs
# ruft `crate::zeitbasis::…` auf, und alle drei Sidecars loesen das seit dem
# 2026-08-20 ueber genau diese Crate (`src/zeitbasis.rs` dort ist nur noch ein
# Re-Export). Damit `src/av1.rs` wortgleich aus den Sidecars uebernommen
# werden kann, ohne seinen Inhalt anzufassen, braucht diese Crate denselben
# Re-Export — siehe `src/zeitbasis.rs`.
[dependencies]
anyhow = "1"
# Die RTP-Nutzlasten des Direktpfad-Senders sind referenzgezählt (`Bytes`) —
# dieselbe Form wie in den Sidecars (`whip/mod.rs`), damit die Pakete ohne
# Kopie durch den Pacer gehen.
bytes = "1"
# Der Pacer verteilt auf einem eigenen Faden und wartet auf absolute
# Zeitpunkte — beides ueber tokio, wie in beiden Sidecars.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
webrtc = "0.17"
# Direktpfad: STUN-Probe fuer den srflx-Fallback (`direct::stun`). Diese Crate
# bringt webrtc selbst mit — es kommt keine neue Fassung in den Graph, nur ein
# weiterer Nutzer derselben.
stun = "0.17"
# Direktpfad: der rustls-Krypto-Provider wird EXPLIZIT gewaehlt
# (`direct::rtc::sorge_krypto_provider`), bevor die erste DTLS-Verhandlung
# laeuft. Zwei Provider in einer Binary heisst: rustls raet nicht, sondern
# panict erst beim Handschlag (Projektfallstrick, Plan
# docs/plans/2026-07-09-direct-path-webrtc.md). `ring`, weil webrtc es
# mitbringt — ein zweiter Provider (aws-lc-rs) wuerde genau jenen Fehler
# erst erzeugen.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
pulse-zeitbasis = { path = "../pulse-zeitbasis" }
pulse-bildmarke = { path = "../pulse-bildmarke" }

# Nur fuer `#[tokio::test]` in sdp.rs — in den Sidecars ist tokio eine
# vollwertige Abhaengigkeit (dort auch fuer ashpd/das Portal gebraucht), hier
# nur zum Testen. Version und Feature-Satz aus den Sidecars uebernommen.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
