# Linux: ffmpeg-sys-next findet FFmpeg per pkg-config — aber NICHT das der
# Distribution. `scripts/hq-bauen.sh` baut n8.1.1 nach
# ~/.cache/pulse/ffmpeg/prefix und setzt PKG_CONFIG_PATH sowie einen RPATH
# dorthin. Kein FFMPEG_DIR (das ist der Windows-Weg).
#
# **Hier stand bis 2026-08-18 „System-FFmpeg (Arch n8.1.2) … kein Custom-Build
# nötig … GnuTLS honoriert tls_verify=0".** Beide Halbsätze stimmen nicht mehr:
# das Distributions-FFmpeg taugt als Grundlage gar nicht mehr — Arch steht auf
# n9.0.1, und `ffmpeg-next = "8.1"` übersetzt dagegen nicht. Der Eigenbau wird
# zudem mit `--enable-openssl` konfiguriert, der Sidecar meldet entsprechend
# `tls_backend: "openssl"`, nicht gnutls.
#
# bindgen (transitiv via ffmpeg-sys-next) braucht libclang — liegt auf diesem
# System als /usr/lib/libclang.so (kein pkg-config-File, aber bindgen findet es
# über den Library-Suchpfad). Falls woanders → LIBCLANG_PATH setzen.
