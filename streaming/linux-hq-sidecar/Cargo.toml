[package]
name = "pulse-linux-hq-sidecar"
version = "0.1.0"
edition = "2024"
publish = false
# Kein `license`-Feld, wie bei den Nachbar-Crates (win/mac/pulse-player):
# es gilt `streaming/LICENSE` (Pulse Client License 1.0). Bis 2026-07-31 stand
# hier "AGPL-3.0-only" — ein Ueberbleibsel aus dem eigenen Repo, aus dem dieser
# Code kam; im Hauptrepo ist Pulse seit 2026-07-25 nicht mehr AGPL. GPL bleibt
# allein, was von GPU Screen Recorder abgeleitet ist (`streaming/patches/`),
# und dieser Sidecar ersetzt GSR, statt davon abzustammen.
description = "Pulse Linux HQ-streaming sidecar — stdio JSON-RPC over newline-delimited JSON, mirrors streaming/gsr-sidecar/control.py and the win/mac Rust sidecars. FFmpeg als Bibliothek (VAAPI/NVENC), PipeWire-Capture."

[[bin]]
name = "pulse-linux-hq-sidecar"
path = "src/main.rs"

# Der KMS-Helfer ist ein zweites, winziges Programm im selben Baum. Als
# Arbeitsbereich-Mitglied baut `cargo build --release` beide, und der Flatpak
# braucht dafuer keine zweite Modul-Definition (er kopiert ohnehin genau dieses
# Verzeichnis). Begruendung fuer die Lage der Kiste: `kms-helfer/Cargo.toml`.
[workspace]
members = ["kms-helfer"]
# `default-members` ist hier nicht Geschmackssache: ohne diese Zeile baut ein
# schlichtes `cargo build --release` im Arbeitsbereichs-Wurzelverzeichnis NUR
# das Wurzelpaket — der Helfer fehlte im Flatpak-Bau, und zwar ohne Fehler,
# einfach als nicht vorhandene Datei.
default-members = [".", "kms-helfer"]

[dependencies]
# Nur die Bibliothek (DRM-ioctls, Format auf dem Draht) — das Programm mit
# `CAP_SYS_ADMIN` laeuft getrennt. Eine gemeinsame Quelle fuer beide Seiten des
# Gespraechs; der Fassungs-Handschlag faengt nur ALT INSTALLIERTE Helfer ab,
# nicht auseinandergelaufene Quelltexte.
pulse-kms-helfer = { path = "kms-helfer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Diagnose-Logging auf stderr (Pulse tee't das in sidecar.log). Stufen +
# Modul-Targets, gesteuert über $PULSE_HQ_LOG (wie RUST_LOG). Siehe src/logging.rs.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }

# FFmpeg als Bibliothek (ab Phase 2: TLS-Probe; Phase 4+: Encode/Mux/RTMPS).
# Gegen das System-FFmpeg (pkg-config) gelinkt — Arch n8.1.2 mit
# --enable-gnutls --enable-libdrm --enable-nvenc --enable-vulkan.
# KEIN `build`-Feature (würde FFmpeg aus Source bauen). `filter` kommt dazu,
# sobald scale_vaapi für den BGRA→NV12-Convert gebraucht wird (Phase 5).
ffmpeg-next = { version = "8.1", default-features = false, features = [
    "codec",
    "format",
    "filter",              # scale_vaapi (BGRx→NV12 CSC) für den VAAPI-Import
    "software-resampling",
    "software-scaling",
] }

# Capture (Phase 6): xdg-desktop-portal ScreenCast + PipeWire-DMABUF.
# ashpd ist async (zbus) — wir scopen einen tokio-Runtime nur für die
# Portal-Verhandlung, danach läuft der PipeWire-Mainloop synchron.
ashpd = { version = "0.10", default-features = false, features = ["tokio"] }
# v0_3_33: PropertyFlags::DONT_FIXATE für die DMABUF-Modifier-Verhandlung
# (System-PipeWire ist 1.6.7, weit drüber).
pipewire = { version = "0.10", features = ["v0_3_33"] }
libspa = { version = "0.10", features = ["v0_3_33"] }
drm-fourcc = "2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Eigener WebRTC-Sendeweg (WHIP), s. `src/whip/`.
#
# WARUM nicht ffmpegs WHIP-Muxer: der hat KEINEN Rueckkanal zur Anwendung — eine
# Vollbild-Anforderung des Zuschauers koennte den Encoder also nie erreichen —
# und er kann kein AV1 (in ffmpeg 8.1 UND master geprueft, nur H.264).
#
# Die Abhaengigkeit ist im Projekt bereits angenommen: der native Player nutzt
# dieselbe Fassung, und `streaming/pulse-remote-webrtc` (Fernsteuerung)
# deklariert sie identisch. MIT/Apache-2.0, kein GPL.
#
# Sie waechst den Sidecar spuerbar — auch fuer Nutzer, die den Weg nie waehlen.
# Bewusst in Kauf genommen (2026-08-02), weil er Standard werden soll; ein
# Cargo-Feature dafuer waere eine zweite Bauvariante, die auseinanderlaeuft.
webrtc = "0.17"
rtcp = "0.17"
bytes = "1"
# Nur fuer den WHIP-Handschlag (ein POST mit dem SDP). rustls statt native-tls,
# wie im Player — webrtc bringt rustls ueber `dtls` ohnehin verpflichtend mit.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
libc = "0.2"
# EGL-dlopen für eglQueryDmaBufModifiersEXT (Modifier-Liste fürs EnumFormat,
# wie GSR) — kein Link-Time-Dep auf libEGL.
libloading = "0.8"

[profile.release]
opt-level = 3
# fat-LTO: der heiße Pfad (Frame-Drain → Import → Encode) läuft pro Frame bei
# bis zu 1000fps — cross-crate-Inlining lohnt, Build-Zeit ist uns egal.
lto = "fat"
codegen-units = 1
strip = true
