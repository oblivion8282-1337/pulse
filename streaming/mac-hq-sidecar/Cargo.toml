[package]
name = "pulse-mac-hq-sidecar"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pulse macOS HQ-streaming sidecar — stdio JSON-RPC over newline-delimited JSON, mirrors streaming/gsr-sidecar/control.py and streaming/win-hq-sidecar/"

[[bin]]
name = "pulse-mac-hq-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Token-Maskierung, seit 2026-08-20 gemeinsam mit win/linux in einer eigenen
# Crate. `src/redact.rs` bleibt als Re-Export bestehen (s. dort).
pulse-redact = { path = "../pulse-redact" }

# RTP-Taktrechnung, seit 2026-08-20 gemeinsam mit win/linux in einer eigenen
# Crate. `src/zeitbasis.rs` bleibt als Re-Export bestehen (s. dort).
pulse-zeitbasis = { path = "../pulse-zeitbasis" }

# AV1-Paketierung + SDP-Aufbau des WHIP-Sendewegs, seit 2026-08-20 gemeinsam
# mit win/linux in einer eigenen Crate. `src/whip/{av1,sdp}.rs` bleiben als
# Re-Exports bestehen (s. dort).
pulse-whip = { path = "../pulse-whip" }
pulse-bildmarke = { path = "../pulse-bildmarke" }

# Plattformfreier Kern der Fernsteuerung (Frame-Format, Sitzung,
# Klemmrechnung) — macOS wird hier der zweite Host neben Windows. Was
# macOS-eigen bleibt (u.a. die Tastentabelle), liegt in `src/remote_input/`.
pulse-fernsteuerung = { path = "../pulse-fernsteuerung" }

# Das Bildformat der Zeigeruebertragung (Laeufe, Kennung, Grenzen) — gemeinsam
# mit `win-hq-sidecar` und `pulse-player`. Seit dem 2026-08-23 auch von hier
# gebraucht: der Mac schickt die Zeigerform **immer** als Bild, weil ihm die
# Namenszuordnung fehlt (Begruendung in `src/remote_input/zeigerform.rs`).
# Steht in `mac-build.yml` bereits unter `on.push.paths` — nachgerechnet von
# `streaming/zwillinge/tests/bau_ausloeser.rs`.
pulse-zeigerbild = { path = "../pulse-zeigerbild" }

# Geteilte Zwischenablage der Fernsteuerung (Rahmenformat, Stueckelung,
# Zustandsmaschine) — **und auf macOS auch die Plattform-Umsetzung selbst**
# (`pulse_ablage::plattform::macos`), anders als auf Windows. Der Grund: hier
# braucht sie ausser diesem Sidecar (Host) auch der `pulse-player`
# (Steuernder), und beide Haelften einer Zwischenablage sind spiegelbildlich
# gleich — beim Verbraucher laege sie zweimal im Baum.
#
# Mit dieser Zeile faellt `streaming/pulse-ablage/**` unter die Pfad-Filter von
# `mac-build.yml`; nachgerechnet von `streaming/zwillinge/tests/bau_ausloeser.rs`.
pulse-ablage = { path = "../pulse-ablage" }

# Capture — ScreenCaptureKit (SCStream) + the surrounding CoreMedia/CoreVideo/
# CoreGraphics types, via the official objc2 framework bindings (no Swift shim).
# Same objc2 0.3-framework / 0.6-core release train.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSString", "NSError", "NSEnumerator",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std", "CMSampleBuffer", "CMTime", "CMFormatDescription", "CMBlockBuffer",
    "objc2-core-video", "objc2-core-audio-types",
] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = [
    "std", "CoreAudioBaseTypes",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "CVPixelFormatDescription",
] }
# `CGEvent`/`CGEventSource`/`CGEventTypes` tragen die Fernsteuer-Injektion
# (`src/remote_input/injektion.rs`). **Keine neue Abhaengigkeit** — die Kiste
# stand schon fuer `CGDirectDisplay` da, es fehlten nur die Bindungen.
# `CGRemoteOperation` kommt dazu, weil `CGKeyCode` dort liegt und
# `CGEvent::new_keyboard_event` genau darauf gattert (`#[cfg(all(feature =
# "CGEventTypes", feature = "CGRemoteOperation"))]`) — ohne das vierte Merkmal
# gibt es Maus und Rad, aber keine Tastatur.
# `CGWindow` kommt fuer die Zielaufloesung dazu (`src/remote_input/ziel.rs`):
# das Rechteck eines aufgenommenen Fensters muss bei JEDER Eingabe-Nachricht
# frisch sein, und `SCWindow.frame` taugt dafuer nicht (Begruendung dort).
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std", "objc2", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes",
    "CGRemoteOperation", "CGWindow",
    "CGImage", "CGBitmapContext", "CGColorSpace", "CGContext", "CGGeometry",
] }
# CF base layer (already transitive via core-video/-media) — needed to name
# `CFRetained` for the zero-copy CVPixelBuffer hand-off into VideoToolbox.
#
# `CFMachPort` + `CFRunLoop` tragen die Wache (`src/remote_input/wache.rs`):
# `CGEvent::tap_create` liefert einen `CFMachPort`, und der Abgriff meldet sich
# nur, solange eine RunLoop ihn bedient. **Keine neue Abhaengigkeit** — dieselbe
# Kiste, nur zwei Merkmale mehr.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std", "CFBase", "CFMachPort", "CFRunLoop", "CFArray", "CFDictionary", "CFString",
] }
objc2-screen-capture-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

# Encode + mux + RTMPS push — same FFmpeg integration as the Windows sidecar.
# VideoToolbox is reached through FFmpeg's h264_videotoolbox encoder; the FLV mux
# + RTMPS push (tls_verify=0) port nearly verbatim from win-hq-sidecar. Links
# against Homebrew's FFmpeg 8.0 via pkg-config (PKG_CONFIG_PATH in .cargo/config.toml).
# An LGPL build + bundled dylibs are required for *distribution* (Homebrew's is GPL).
ffmpeg-next = { version = "8.0", default-features = false, features = [
    "codec", "format", "software-resampling", "software-scaling",
] }

# Eigener WebRTC-Sendeweg (WHIP), s. `src/whip/` — Vorarbeit fuer Aufgabe 4+.
# Fassungen wie in `streaming/linux-hq-sidecar/Cargo.toml`, dort steht auch
# die Begruendung (kein Rueckkanal bei ffmpegs WHIP-Muxer).
webrtc = "0.17"
rtcp = "0.17"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
