# Pulse Self-Host All-in-One Image — build & publish to GHCR.
#
# Output:
#   ghcr.io/oblivion8282-1337/pulse-allinone:edge          (rolling, every main push)
#   ghcr.io/oblivion8282-1337/pulse-allinone:stable        (latest release)
#   ghcr.io/oblivion8282-1337/pulse-allinone:vX.Y.Z        (immutable, exact)
#   ghcr.io/oblivion8282-1337/pulse-allinone:vX.Y          (rolling minor)
#   ghcr.io/oblivion8282-1337/pulse-allinone:vX            (rolling major)
#   ghcr.io/oblivion8282-1337/pulse-allinone:sha-<short>   (every build, for forensics)
#
# Trigger options (all do the same build, different tags applied):
#   1. push to main         → :edge + :stable + :sha-<short>   (PHASEN-POLICY, s.u.)
#   2. push tag v*.*.*      → :stable + :vX.Y.Z + :vX.Y + :vX + :sha-<short>
#   3. workflow_dispatch    → :edge (no input) or :stable (release_version input)
#
# PHASEN-POLICY (2026-06-10): In der aktuellen Früh-/Security-Phase taggt JEDER
# main-Push auch :stable, damit ALLE Self-Hosts (egal ob :edge- oder :stable-
# gepinnt) jeden Push automatisch via Watchtower ziehen — wie die Cloud :latest.
# Zum Umstellen auf echte getaggte Releases: ":stable" aus dem edge-Zweig im
# "Compute version + tags"-Step wieder entfernen.
#
# ARCHITEKTUR (2026-07-15): Multi-Arch NATIV statt QEMU. Drei Jobs:
#   prepare → berechnet Version + Tags einmal zentral.
#   build   → Matrix: amd64 auf ubuntu-24.04, arm64 auf ubuntu-24.04-arm
#             (echte ARM-Maschine, öffentliches Repo = gratis). Beide bauen
#             OHNE Emulation und pushen per Digest (noch ohne Tag), parallel.
#   merge   → klebt die zwei Digests zum Multi-Arch-Manifest unter den echten
#             Tags + spiegelt nach registry.howispulse.com.
# Effekt: Kaltbau von ~90 min (QEMU) auf ~15 min (nativ + parallel). Der frühere
# 180-min-Timeout (für den emulierten arm64-Cold-Build) entfällt.
#
# PFAD-FILTER (2026-07-15): läuft nur, wenn wirklich Image-Inhalt betroffen ist
# (Services/Shared/Web/Plugins/Self-Host-Dockerfile+Adapter/Lockfiles/dieser
# Workflow). Docs-/Desktop-/Packaging-/Mac-Win-Sidecar-Änderungen starten den
# Bau nicht mehr → weniger Läufe, weniger Abbruch-Chaos.

name: allinone

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'web/**'                 # Frontend steckt im allinone-Image!
      - 'plugins/**'
      - 'infra/self-host/**'     # Dockerfile + Rust-Direktpfad-Adapter
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/allinone.yml'
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version like 1.0.0 — leave blank to publish :edge'
        required: false
        default: ''
        type: string

# Edge builds on main cancel each other (only the latest commit matters).
# Tag builds never cancel — every release must finish.
concurrency:
  group: allinone-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/oblivion8282-1337/pulse-allinone

jobs:
  # ── 1. Version + Tags einmal zentral berechnen ────────────────────────────
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      pulse_version: ${{ steps.meta.outputs.pulse_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version + tags
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(git rev-parse --short HEAD)"

          # Determine channel + version
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CHANNEL="stable"
            SOURCE="tag push"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            CHANNEL="stable"
            SOURCE="manual dispatch"
          else
            VERSION=""
            CHANNEL="edge"
            SOURCE="branch push / manual dispatch (no version)"
          fi

          # Validate semver for stable releases
          if [[ "$CHANNEL" == "stable" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version '${VERSION}'. Expected semver like 1.0.0 or 1.0.0-rc1."
              exit 1
            fi
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            # Pre-release versions (1.0.0-rc1) only push :vX.Y.Z + :sha — not :stable, :vX.Y, :vX.
            if [[ "$VERSION" == *-* ]]; then
              TAGS=$(printf '%s\n' \
                "${IMAGE}:v${VERSION}" \
                "${IMAGE}:sha-${SHORT_SHA}")
            else
              TAGS=$(printf '%s\n' \
                "${IMAGE}:stable" \
                "${IMAGE}:v${VERSION}" \
                "${IMAGE}:v${MAJOR}.${MINOR}" \
                "${IMAGE}:v${MAJOR}" \
                "${IMAGE}:sha-${SHORT_SHA}")
            fi
          else
            # PHASEN-POLICY (2026-06-10): main-Pushes taggen bewusst AUCH :stable,
            # nicht nur :edge. In der aktuellen Früh-/Security-Phase müssen ALLE
            # Self-Hosts (auch die :stable-gepinnten Compose-Installs) jeden
            # main-Push automatisch ziehen — wie die Cloud :latest. Sobald wir auf
            # getaggte Releases umstellen, diese Zeile (":stable" im edge-Zweig)
            # wieder entfernen → dann ist :stable erneut nur tag-gegated.
            TAGS=$(printf '%s\n' \
              "${IMAGE}:edge" \
              "${IMAGE}:stable" \
              "${IMAGE}:sha-${SHORT_SHA}")
          fi

          # Pulse-version label baked into the image (shown in /admin/server-info)
          if [[ -n "$VERSION" ]]; then
            PULSE_VERSION="$VERSION"
          else
            PULSE_VERSION="$SHORT_SHA"
          fi

          {
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "pulse_version=$PULSE_VERSION"
            echo "short_sha=$SHORT_SHA"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Building $CHANNEL (source: $SOURCE, version: ${VERSION:-none}, sha: $SHORT_SHA)"
          echo "Tags:"
          echo "$TAGS" | sed 's/^/  - /'

  # ── 2. Pro-Arch nativ bauen + per Digest pushen (parallel) ────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Nativ (kein QEMU) → 60 min reicht mit Abstand, auch cold. Ein Timeout-
    # Abbruch exportiert keinen Cache; das ist bei nativen Läufen aber weit
    # jenseits der realen Dauer.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/self-host/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PULSE_VERSION=${{ needs.prepare.outputs.pulse_version }}
          labels: |
            org.opencontainers.image.title=Pulse Self-Host
            org.opencontainers.image.description=Pulse all-in-one self-host container (chat + voice + HQ streaming)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.pulse_version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          # Push OHNE Tag, nur per Digest — der merge-Job klebt die Tags drauf.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Cache PRO ARCH getrennt — sonst überschreiben amd64/arm64 sich.
          cache-from: type=gha,scope=allinone-${{ matrix.arch }}
          # ignore-error: der GHA-Cache-Export flaket sporadisch NACH dem Push
          # ("error writing layer blob: not_found"). Cache ist nur Speedup.
          cache-to: type=gha,mode=max,scope=allinone-${{ matrix.arch }},ignore-error=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 3. Multi-Arch-Manifest kleben + spiegeln ──────────────────────────────
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      # Self-Host-allinone-Registry (registry.howispulse.com). Leerer Secret →
      # Mirror-Schritte skippen (GHCR bleibt Source-of-Truth, CI bricht nicht).
      REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest under the real tags
        working-directory: /tmp/digests
        env:
          GHCR_TAGS: ${{ needs.prepare.outputs.tags }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          # -t für jeden Tag, dann alle per-Arch-Digests als Quellen.
          TAG_ARGS=()
          while IFS= read -r t; do [ -n "$t" ] && TAG_ARGS+=(-t "$t"); done <<< "$GHCR_TAGS"
          SRC_ARGS=()
          for d in *; do [ -f "$d" ] && SRC_ARGS+=("${IMAGE}@sha256:${d}"); done
          echo "::notice::Manifest aus ${#SRC_ARGS[@]} Arch(en) unter $(( ${#TAG_ARGS[@]} / 2 )) Tag(s)"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SRC_ARGS[@]}"

      # --- Mirror zur Self-Host-Registry (best-effort) ──────────────────────────
      # GHCR oben ist Source-of-Truth (MUST grün). Zusätzlich wird das Multi-Arch-
      # Manifest (amd64+arm64) nach registry.howispulse.com kopiert — dort pullen
      # Self-Host-User mit per-Instance-Credentials. ``imagetools create`` kopiert
      # Manifest+Blobs OHNE Rebuild. continue-on-error: bei netcup-Ausfall bleiben
      # die GHCR-Tags trotzdem aktuell.
      - name: Login to self-hosted registry
        if: ${{ env.REGISTRY_PUSH_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: registry.howispulse.com
          username: pulse-ci
          password: ${{ secrets.REGISTRY_PUSH_TOKEN }}

      - name: Mirror to registry.howispulse.com
        if: ${{ env.REGISTRY_PUSH_TOKEN != '' }}
        continue-on-error: true
        env:
          GHCR_TAGS: ${{ needs.prepare.outputs.tags }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          SRC="ghcr.io/oblivion8282-1337/pulse-allinone:sha-${SHORT_SHA}"
          # Registry-Tags aus den GHCR-Tags ableiten (nur der Image-Prefix ändert
          # sich; die Tags selbst bleiben identisch).
          REG_TAGS="$(printf '%s\n' "${GHCR_TAGS}" \
            | sed 's|^ghcr.io/oblivion8282-1337/pulse-allinone|registry.howispulse.com/pulse-allinone|')"
          ARGS=()
          while IFS= read -r t; do [ -n "$t" ] && ARGS+=(-t "$t"); done <<< "$REG_TAGS"
          TAG_COUNT=$(( ${#ARGS[@]} / 2 ))
          echo "::notice::Mirror ${TAG_COUNT} tag(s) → registry.howispulse.com"
          echo "Source: $SRC"
          echo "$REG_TAGS" | sed '/^$/d; s/^/  → /'
          docker buildx imagetools create "${ARGS[@]}" "$SRC" || {
            echo "::warning::registry.howispulse.com mirror fehlgeschlagen — GHCR-Tags trotzdem gelandet."
            exit 0
          }
