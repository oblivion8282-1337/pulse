# Pulse CI: test on every push/PR; on push to main also build & publish the
# production images to GHCR. On the VPS a **user crontab** picks them up every
# 5 min (`infra/prod/pulse-update.sh`, a scoped `compose pull && up -d`).
#
# NOT Watchtower — that was removed on 2026-06-11 because it mounted the Docker
# socket (= root on the host). This header still named it until 2026-08-04.

name: ci

on:
  # Reine Doku-Änderungen brauchen weder Tests noch Image-Build noch Deploy →
  # ci wird auf BEIDEN Triggern übersprungen, wenn NUR diese Pfade betroffen
  # sind. Sicher auch auf der PR-Seite, weil `backend`/`frontend` seit
  # 2026-07-15 KEINE Branch-Protection-Pflicht-Checks mehr sind (nur noch
  # `CLAAssistant` ist Pflicht, das läuft über `cla.yml`) — ein übersprungenes
  # ci blockiert den PR also nicht.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.claude/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.claude/**']

# Cancel older runs on the same ref when a newer push lands. Repo is
# public so we have unlimited Actions minutes, but cancelling stale
# matrix-image-builds still keeps the GHCR `:latest` race-free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # backend/frontend laufen NUR auf Pull Requests, bewusst nicht auf main-Push.
  # Nach einem Rebase-Merge ist der main-Stand derselbe Code, der als PR schon
  # getestet wurde — der zweite Lauf war reine Wiederholung (gemessen 2026-07-24:
  # ~1.700 Actions-Minuten/Monat, gut ein Fuenftel des Gesamtverbrauchs).
  # Gefahrlos, weil `images` ohnehin nur an `changelog` haengt (s.u.) und das
  # verbindliche Test-Gate lokal vor dem Push liegt (CLAUDE.md → Tests).
  # Preis: ein direkter Push auf main laeuft ohne CI-Tests — genau dafuer ist
  # der lokale Lauf Pflicht.
  backend:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dcc
          POSTGRES_PASSWORD: dcc-test
          POSTGRES_DB: dcc
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U dcc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_USER: dcc
      POSTGRES_PASSWORD: dcc-test
      POSTGRES_DB: dcc
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5434"
      REDIS_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install deps
        run: uv sync --all-packages --all-extras
      - name: Generate JWT keypair
        run: |
          mkdir -p secrets
          openssl genpkey -algorithm RSA -out secrets/jwt_private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -in secrets/jwt_private.pem -pubout -out secrets/jwt_public.pem
      - name: Run all pytest
        env:
          JWT_PRIVATE_KEY_FILE: ./secrets/jwt_private.pem
          JWT_PUBLIC_KEY_FILE: ./secrets/jwt_public.pem
        # `--reruns` retries in-process, but only catches AssertionError/
        # RuntimeError. The rare pub/sub subscribe-race makes a WS test hang,
        # and `--timeout-method=thread` (pyproject) hard-kills the whole
        # process via os._exit → no test outcome for --reruns to retry. So we
        # wrap the run in a fresh-process retry loop: a transient timing flake
        # clears on the next attempt; a real failure fails twice and stays red.
        run: |
          for attempt in 1 2; do
            echo "::group::pytest attempt $attempt"
            uv run pytest -v \
              --reruns 2 --reruns-delay 1 \
              --only-rerun "AssertionError" \
              --only-rerun "RuntimeError" \
              && { echo "::endgroup::"; exit 0; }
            echo "::endgroup::"
            echo "::warning::pytest attempt $attempt failed (possibly the pub/sub subscribe-race timeout) — retrying in a fresh process"
          done
          exit 1

  frontend:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          # Match the production image (web/Dockerfile builds with node:25)
          # so we don't ship a CI-green / prod-broken bundle.
          node-version: "25"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @dcc/web check
      - name: Build
        run: pnpm --filter @dcc/web build

  # Hält die bewusst doppelt geführten Dateien der HQ-Programme zusammen
  # (streaming/zwillinge/). Läuft HIER und nicht in den Plattform-Workflows,
  # weil die Crate keine Abhängigkeiten hat: `include_str!` liest zur
  # Übersetzungszeit aus dem Repo, es muss also weder FFmpeg noch ein
  # Plattform-SDK vorhanden sein. Sekunden, kein Cache nötig.
  zwillinge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Zwillinge prüfen
        run: cargo test --manifest-path streaming/zwillinge/Cargo.toml

  # Changelog-Erinnerung: ein Deploy, der Code/Verhalten ändert, SOLL einen
  # Eintrag in web/static/changelog.json mitbringen (s. scripts/check-changelog.sh
  # + CLAUDE.md → "Changelog").
  #
  # Der Job WARNT nur, er blockt nicht: check-changelog.sh endet seit 2026-06-28
  # in jedem Pfad mit exit 0, damit Hotfixes durchkommen. `images` hängt zwar an
  # diesem Job, aber der schlägt nie fehl — der Deploy läuft in jedem Fall.
  # (Der frühere Kommentar behauptete das Gegenteil; korrigiert 2026-07-27.)
  changelog:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-changelog.sh diff't before..after
      - name: Changelog-Pflicht prüfen
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: bash scripts/check-changelog.sh "$BEFORE_SHA" "$AFTER_SHA"

  # Build & push the 6 production images. The cron updater on the VPS follows `:latest`.
  #
  # DEPLOY IST BEWUSST VOM TEST-GATE ENTKOPPELT: needs ist nur `changelog`,
  # NICHT backend/frontend. Grund: die backend-Tests haben seltene pub/sub-
  # Subscribe-Race-Flakes (Timeout via --timeout-method=thread killt den Prozess
  # hart → vom --only-rerun NICHT gefangen), die sonst legitime Deploys
  # blockten. backend+frontend laufen weiter als SICHTBARE Info-Checks (rot =
  # „bitte anschauen"), gaten den Deploy aber nicht. Das verbindliche Test-Gate
  # ist LOKAL vor dem Push (pytest + pnpm check + build, s. CLAUDE.md → Tests).
  images:
    name: build & push images (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: [changelog]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            file: web/Dockerfile
            args: ""
          - name: auth
            file: Dockerfile.service
            args: |
              SVC_DIR=auth
              SVC_PKG=dcc_auth
          - name: chat-gateway
            file: Dockerfile.service
            args: |
              SVC_DIR=chat-gateway
              SVC_PKG=dcc_chat_gateway
          - name: voice-signaling
            file: Dockerfile.service
            args: |
              SVC_DIR=voice-signaling
              SVC_PKG=dcc_voice_signaling
          - name: media-svc
            file: Dockerfile.service
            args: |
              SVC_DIR=media-svc
              SVC_PKG=dcc_media_svc
          - name: mediamtx-auth-hook
            file: Dockerfile.service
            args: |
              SVC_DIR=mediamtx-auth-hook
              SVC_PKG=dcc_mediamtx_auth_hook
          - name: relay-frps-plugin
            file: Dockerfile.service
            args: |
              SVC_DIR=relay-frps-plugin
              SVC_PKG=dcc_relay_frps_plugin
    steps:
      - uses: actions/checkout@v4
      # Pre-pull the buildkit image with retry BEFORE setup-buildx bootstraps
      # its docker-container driver. The recurring image-build failures were
      # transient Docker Hub hiccups pulling moby/buildkit (502 Bad Gateway) /
      # ghcr timeouts during buildx bootstrap. Once the image is local,
      # setup-buildx reuses it and never re-hits the registry. A flaky build
      # here means that one service's :latest is silently NOT pushed → a
      # partial deploy (the cron updater keeps the stale container), so it's worth
      # the retry. No untrusted input is used in this step.
      - name: Pre-pull buildkit (resilient against registry flakes)
        run: |
          for attempt in 1 2 3; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "::warning::buildkit pull attempt $attempt failed (registry flake) — retrying"
            sleep 15
          done
          echo "::warning::buildkit pre-pull exhausted retries; letting setup-buildx try anyway"
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ghcr.io/oblivion8282-1337/pulse-${{ matrix.name }}:latest
            ghcr.io/oblivion8282-1337/pulse-${{ matrix.name }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
