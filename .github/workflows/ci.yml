# Pulse CI: test on every push/PR; on push to main also build & publish the
# production images to GHCR (consumed on the VPS by the `pulse_watchtower`
# container — same GHCR → Watchtower pattern as the other apps on that box).

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Runs on the self-hosted runner on the VPS (1 concurrent job, see
# memory/feedback_self_hosted_runner.md). Newer pushes cancel older
# pending/running CI for the same ref so we don't queue stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dcc
          POSTGRES_PASSWORD: dcc-test
          POSTGRES_DB: dcc
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U dcc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_USER: dcc
      POSTGRES_PASSWORD: dcc-test
      POSTGRES_DB: dcc
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5434"
      REDIS_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install deps
        run: uv sync --all-packages --all-extras
      - name: Generate JWT keypair
        run: |
          mkdir -p secrets
          openssl genpkey -algorithm RSA -out secrets/jwt_private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -in secrets/jwt_private.pem -pubout -out secrets/jwt_public.pem
      - name: Run all pytest
        env:
          JWT_PRIVATE_KEY_FILE: ./secrets/jwt_private.pem
          JWT_PUBLIC_KEY_FILE: ./secrets/jwt_public.pem
        run: uv run pytest -v

  frontend:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          # Match the production image (web/Dockerfile builds with node:25)
          # so we don't ship a CI-green / prod-broken bundle.
          node-version: "25"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @dcc/web check
      - name: Build
        run: pnpm --filter @dcc/web build

  # Build & push the 6 production images. Only on push to main, only after the
  # test jobs pass. Watchtower on the VPS follows the `:latest` tags.
  images:
    name: build & push images (${{ matrix.name }})
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            file: web/Dockerfile
            args: ""
          - name: auth
            file: Dockerfile.service
            args: |
              SVC_DIR=auth
              SVC_PKG=dcc_auth
          - name: chat-gateway
            file: Dockerfile.service
            args: |
              SVC_DIR=chat-gateway
              SVC_PKG=dcc_chat_gateway
          - name: voice-signaling
            file: Dockerfile.service
            args: |
              SVC_DIR=voice-signaling
              SVC_PKG=dcc_voice_signaling
          - name: media-svc
            file: Dockerfile.service
            args: |
              SVC_DIR=media-svc
              SVC_PKG=dcc_media_svc
          - name: mediamtx-auth-hook
            file: Dockerfile.service
            args: |
              SVC_DIR=mediamtx-auth-hook
              SVC_PKG=dcc_mediamtx_auth_hook
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ghcr.io/oblivion8282-1337/pulse-${{ matrix.name }}:latest
            ghcr.io/oblivion8282-1337/pulse-${{ matrix.name }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
