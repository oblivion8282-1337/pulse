# CLA Assistant Lite — verlangt von externen Contributors eine einmalige
# Unterschrift unter CLA.md, bevor ihr Pull Request gemergt werden kann.
# Der Lizenz-Grant im CLA hält die Option auf Dual-Licensing offen
# (source-available für alle + optionale separate Kommerzlizenz).
#
# Signaturen landen in signatures/version1/cla.json auf main. Repo-Owner und
# Bots sind über die allowlist ausgenommen — die müssen nicht signieren.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Mehrere Pushes auf denselben PR loesen je einen Lauf aus; nur der letzte
# zaehlt. Die Gruppe traegt den Event-Namen, damit Signatur-Kommentare eine
# EIGENE Gruppe haben — sonst koennte ein neuer Push den Lauf abbrechen, der
# gerade die Unterschrift nach signatures/version1/cla.json schreibt.
# cancel-in-progress deshalb auch nur fuer die PR-Events, nie fuer Kommentare.
concurrency:
  group: cla-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/oblivion8282-1337/pulse/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'oblivion8282-1337,*[bot]'
