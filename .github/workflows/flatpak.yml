# Build, sign, and publish the Pulse Flatpak whenever a push to main changes
# anything that's bundled into it. Mirrors what `packaging/publish.fish` does
# locally (and what the legacy `.githooks/pre-push` hook used to run), but
# without needing the GPG key or VPS SSH key on the developer's machine.
#
# Trigger: only paths that actually end up inside the Flatpak. Web/backend-only
# changes are skipped — the packaged app loads the live web app remotely.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FLATPAK_GPG_PRIVATE_KEY  ASCII-armored export of the passwordless signing
#                            key (`gpg --homedir packaging/.gpg --armor
#                            --export-secret-keys <KEYID>` on a box that has
#                            the original key). Must be the SAME key clients
#                            already pinned via the .flatpakref — losing it +
#                            generating a new one breaks `flatpak update` for
#                            existing installs.
#   VPS_SSH_PRIVATE_KEY      Private key for `michael@77.42.71.166`. Generate a
#                            dedicated CI keypair (`ssh-keygen -t ed25519 -f
#                            ci-deploy -N ""`) and append the .pub to the VPS's
#                            ~/.ssh/authorized_keys so this isn't tangled with
#                            personal keys.
#   VPS_KNOWN_HOSTS          Output of `ssh-keyscan 77.42.71.166` (one or more
#                            lines). Pins the host key — without it, rsync's
#                            host-key prompt would either hang or accept a MITM.
#
# Concurrency: at most one publish runs at a time per branch, so back-to-back
# pushes don't race on the rsync target.

name: flatpak

on:
  push:
    branches: [main]
    paths:
      - 'desktop/electron/**'
      - 'desktop/package.json'
      - 'streaming/gsr-sidecar/**'
      - 'streaming/patches/**'
      - 'packaging/com.unicutmedia.Pulse.yml'
      - 'packaging/launcher.sh'
      - 'packaging/com.unicutmedia.Pulse.desktop'
      - 'packaging/com.unicutmedia.Pulse.metainfo.xml'
      - 'packaging/com.unicutmedia.Pulse.svg'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:    # also allow manual republish from the Actions tab

concurrency:
  group: flatpak-publish
  cancel-in-progress: false   # let an in-flight rsync finish

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60        # first run ~30min; cached runs ~5min
    steps:
      - uses: actions/checkout@v4

      # ── Electron bundle (esbuild) ──
      # The manifest copies `desktop/electron/dist/*.cjs` (gitignored, only
      # produced by build:electron). Same script as publish.fish runs locally.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: pnpm install (desktop only)
        run: pnpm install --frozen-lockfile --filter @dcc/desktop...
      - name: build:electron
        run: pnpm --filter @dcc/desktop build:electron

      # ── flatpak tooling ──
      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          # elfutils provides `eu-strip` + `eu-elfcompress` — flatpak-builder
          # uses them to strip debug symbols from built binaries (e.g. the GSR
          # binary). Without them, the build fails after the compile step.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ostree rsync elfutils
          flatpak remote-add --user --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo

      # ── Caches (huge speedup: FFmpeg + GSR built from source) ──
      # Two-step pattern (separate restore + save with if: always()) so cache
      # gets saved even when a later step fails. With actions/cache@v4 (single
      # action) the save would be skipped on job failure → every failed retry
      # would have to rebuild FFmpeg+GSR from scratch (~15 min).
      - name: Restore flatpak runtimes cache
        id: cache-runtimes
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ runner.os }}-${{ hashFiles('packaging/com.unicutmedia.Pulse.yml') }}
          restore-keys: |
            flatpak-runtimes-${{ runner.os }}-
      - name: Restore flatpak-builder cache
        id: cache-builder
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ runner.os }}-${{ hashFiles('packaging/com.unicutmedia.Pulse.yml', 'streaming/patches/**') }}
          restore-keys: |
            flatpak-builder-${{ runner.os }}-

      # ── GPG signing key ──
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p packaging/.gpg
          chmod 700 packaging/.gpg
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --homedir packaging/.gpg --batch --import
          KEYID=$(gpg --homedir packaging/.gpg --list-keys --with-colons \
                  | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$KEYID" ]; then
            echo "::error::no GPG key fingerprint after import — check FLATPAK_GPG_PRIVATE_KEY secret"
            exit 1
          fi
          echo "FLATPAK_KEYID=$KEYID" >> "$GITHUB_ENV"
          echo "→ signing with $KEYID"

      # Pre-flight: replicate what flatpak-builder does (install metainfo +
      # desktop + icons into a sandbox tree, then run appstreamcli compose).
      # flatpak-builder deletes its rofiles tree on failure, so the only way to
      # see *what* appstreamcli is unhappy about is to run the check ourselves
      # first, with --verbose, and fail loudly. If compose succeeds here, the
      # main build will too — the inputs are identical.
      - name: Pre-flight appstreamcli compose check
        run: |
          echo "appstreamcli version:"
          appstreamcli --version
          echo ""
          T=/tmp/asc-preflight
          rm -rf "$T"
          install -Dm644 packaging/com.unicutmedia.Pulse.desktop "$T/share/applications/com.unicutmedia.Pulse.desktop"
          install -Dm644 packaging/com.unicutmedia.Pulse.svg "$T/share/icons/hicolor/scalable/apps/com.unicutmedia.Pulse.svg"
          install -Dm644 desktop/electron/icon.png "$T/share/icons/hicolor/512x512/apps/com.unicutmedia.Pulse.png"
          install -Dm644 packaging/com.unicutmedia.Pulse.metainfo.xml "$T/share/metainfo/com.unicutmedia.Pulse.metainfo.xml"
          echo "Tree to compose:"
          find "$T" -type f
          echo ""
          appstreamcli compose --verbose \
            --components=com.unicutmedia.Pulse,com.unicutmedia.Pulse.desktop \
            --prefix=/ \
            --result-root=/tmp/asc-pre-result \
            --data-dir=/tmp/asc-pre-data \
            --icons-dir=/tmp/asc-pre-icons \
            "$T"

      # ── Build + sign + delta + prune ──
      # Same commands publish.fish runs. The `--user` + `--install-deps-from`
      # makes flatpak-builder pull the runtimes itself if cache missed.
      - name: Build & sign Flatpak
        run: |
          mkdir -p build/repo
          flatpak-builder --force-clean \
            --user --install-deps-from=flathub \
            --repo=build/repo \
            --gpg-sign="$FLATPAK_KEYID" --gpg-homedir=packaging/.gpg \
            build/flatpak packaging/com.unicutmedia.Pulse.yml

      # Dump appstreamcli's YAML issue report on failure so we can see the
      # actual file/path that failed (the bare "file-read-error" line in the
      # build log doesn't include the path).
      - name: Diagnose appstreamcli failure
        if: failure()
        run: |
          echo "=== Looking for appstream issue reports / metainfo state ==="
          find .flatpak-builder -name "*.yml" -path "*appstream*" 2>/dev/null | head -20
          find .flatpak-builder -name "issues*.yml" 2>/dev/null | head -20
          echo ""
          echo "=== installed metainfo + icons + desktop files in the rofiles tree ==="
          find .flatpak-builder/rofiles -path "*/share/metainfo*" -o -path "*/share/icons/hicolor*" -o -path "*/share/applications*" 2>/dev/null | head -40
          echo ""
          echo "=== first matching issue report yml (if any) ==="
          REPORT=$(find .flatpak-builder -name "*.yml" -path "*appstream*" 2>/dev/null | head -1)
          [ -n "$REPORT" ] && cat "$REPORT" || echo "(no appstream YAML found)"
          echo ""
          echo "=== rerun appstreamcli compose manually with verbose output ==="
          ROFILES=$(find .flatpak-builder/rofiles -maxdepth 1 -name "rofiles-*" | head -1)
          if [ -n "$ROFILES" ] && [ -d "$ROFILES/files" ]; then
            appstreamcli compose \
              --verbose \
              --components=com.unicutmedia.Pulse,com.unicutmedia.Pulse.desktop \
              --prefix=/ \
              --result-root=/tmp/asc-diag-result \
              --data-dir=/tmp/asc-diag-data \
              --icons-dir=/tmp/asc-diag-icons \
              "$ROFILES/files" 2>&1 || true
          else
            echo "(no rofiles tree found — build failed before install)"
          fi

      - name: Generate static deltas + prune old commits
        run: |
          flatpak build-update-repo \
            --generate-static-deltas --prune --prune-depth=3 \
            --gpg-sign="$FLATPAK_KEYID" --gpg-homedir=packaging/.gpg \
            build/repo

      - name: Write .flatpakref + .flatpakrepo
        run: |
          PUBKEY_B64=$(gpg --homedir packaging/.gpg --export "$FLATPAK_KEYID" | base64 -w0)
          cat > build/repo/com.unicutmedia.Pulse.flatpakref <<EOF
          [Flatpak Ref]
          Title=Pulse
          Name=com.unicutmedia.Pulse
          Branch=master
          Url=https://pulse.unicutmedia.com/flatpak/
          Homepage=https://pulse.unicutmedia.com
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=$PUBKEY_B64
          EOF
          cat > build/repo/pulse.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Pulse
          Url=https://pulse.unicutmedia.com/flatpak/
          Homepage=https://pulse.unicutmedia.com
          GPGKey=$PUBKEY_B64
          EOF

      # ── Save caches (always, even on later failure) ──
      # The save happens BEFORE the rsync/publish steps so a network failure
      # later doesn't prevent us from keeping the expensive FFmpeg+GSR build.
      # `if: always()` makes save run even if Build & sign Flatpak partially
      # populated .flatpak-builder/ccache before crashing.
      - name: Save flatpak runtimes cache
        if: always() && steps.cache-runtimes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/flatpak
          key: ${{ steps.cache-runtimes.outputs.cache-primary-key }}
      - name: Save flatpak-builder cache
        if: always() && steps.cache-builder.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder
          key: ${{ steps.cache-builder.outputs.cache-primary-key }}

      # ── Publish ──
      - name: Set up SSH for rsync
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync repo to VPS
        run: |
          rsync -a --delete -e "ssh -i ~/.ssh/id_ed25519" \
            build/repo/ michael@77.42.71.166:pulse/flatpak-repo/

      - name: Summary
        run: |
          echo "✓ Flatpak republished to https://pulse.unicutmedia.com/flatpak/" >> "$GITHUB_STEP_SUMMARY"
          echo "  Install:  \`flatpak install --user https://pulse.unicutmedia.com/flatpak/com.unicutmedia.Pulse.flatpakref\`" >> "$GITHUB_STEP_SUMMARY"
          echo "  Update:   \`flatpak update\`" >> "$GITHUB_STEP_SUMMARY"
