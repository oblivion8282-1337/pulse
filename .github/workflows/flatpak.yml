# Build, sign, and publish the Pulse Flatpak whenever a push to main changes
# anything that's bundled into it. Mirrors what `packaging/publish.fish` does
# locally (and what the legacy `.githooks/pre-push` hook used to run), but
# without needing the GPG key or VPS SSH key on the developer's machine.
#
# Trigger: only paths that actually end up inside the Flatpak. Web/backend-only
# changes are skipped — the packaged app loads the live web app remotely.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FLATPAK_GPG_PRIVATE_KEY  ASCII-armored export of the passwordless signing
#                            key (`gpg --homedir packaging/.gpg --armor
#                            --export-secret-keys <KEYID>` on a box that has
#                            the original key). Must be the SAME key clients
#                            already pinned via the .flatpakref — losing it +
#                            generating a new one breaks `flatpak update` for
#                            existing installs.
#   VPS_SSH_PRIVATE_KEY      Private key for `michael@159.195.150.54`. Generate a
#                            dedicated CI keypair (`ssh-keygen -t ed25519 -f
#                            ci-deploy -N ""`) and append the .pub to the VPS's
#                            ~/.ssh/authorized_keys so this isn't tangled with
#                            personal keys.
#   VPS_KNOWN_HOSTS          Output of `ssh-keyscan 159.195.150.54` (one or more
#                            lines). Pins the host key — without it, rsync's
#                            host-key prompt would either hang or accept a MITM.
#
# Concurrency: at most one publish runs at a time per branch, so back-to-back
# pushes don't race on the rsync target.

name: flatpak

on:
  push:
    branches: [main]
    paths:
      - 'desktop/electron/**'
      - 'desktop/package.json'
      - 'streaming/linux-hq-sidecar/**'
      - 'packaging/linux-hq-sidecar-cargo-sources.json'
      - 'streaming/pulse-player/**'
      - 'packaging/pulse-player-cargo-sources.json'
      # Die gemeinsamen Kisten liegen ausserhalb von linux-hq-sidecar/ UND
      # pulse-player/, obwohl beide dagegen linken (seit dem Zusammenlegen der
      # vormals mehrfachen Dateien in gemeinsame Crates). Eine Änderung dort
      # träfe ohne diese Einträge keinen Pfad-Filter und der gebaute Flatpak
      # bliebe still auf dem alten Stand — dieselbe Falle wie beim FFmpeg-Patch
      # unten, nur eine Ebene höher im Verzeichnisbaum.
      #
      # Die Liste muss REKURSIV vollständig sein: pulse-whip hängt selbst an
      # pulse-zeitbasis und pulse-bildmarke. Nachgerechnet wird das von
      # streaming/zwillinge/tests/bau_ausloeser.rs — wer hier etwas ändert,
      # bekommt dort die Gegenprobe. Dass dieselben Kisten ausserdem im
      # Flatpak-Manifest stehen, prüft flatpak_kisten.rs daneben — zwei
      # getrennte Listen von Hand, die auch getrennt kaputtgehen.
      - 'streaming/pulse-redact/**'
      - 'streaming/pulse-zeitbasis/**'
      - 'streaming/pulse-whip/**'
      - 'streaming/pulse-zeigerbild/**'
      - 'streaming/pulse-bildmarke/**'
      - 'streaming/pulse-fernsteuerung/**'
      - 'streaming/pulse-ablage/**'
      - 'packaging/com.howispulse.Pulse.yml'
      - 'packaging/launcher.sh'
      - 'packaging/com.howispulse.Pulse.desktop'
      - 'packaging/com.howispulse.Pulse.metainfo.xml'
      - 'packaging/com.howispulse.Pulse.svg'
      # Server-App-Flatpak (com.howispulse.PulseServer) ist geparkt (App-Hosting
      # zurückgestellt 2026-07-14) → Build-Schritte + Trigger entfernt. Die
      # packaging/com.howispulse.PulseServer.* Manifeste bleiben im Repo liegen;
      # zum Reaktivieren die Server-Schritte + diese Pfade wieder aufnehmen.
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:    # also allow manual republish from the Actions tab

concurrency:
  group: flatpak-publish
  cancel-in-progress: false   # let an in-flight rsync finish

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60        # first run ~30min; cached runs ~5min
    steps:
      - uses: actions/checkout@v4

      # ── Electron bundle (esbuild) ──
      # The manifest copies `desktop/electron/dist/*.cjs` (gitignored, only
      # produced by build:electron). Same script as publish.fish runs locally.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "pnpm"
      - name: pnpm install (desktop only)
        run: pnpm install --frozen-lockfile --filter @dcc/desktop...
      - name: build:electron
        run: pnpm --filter @dcc/desktop build:electron

      # ── flatpak tooling ──
      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          # elfutils provides `eu-strip` + `eu-elfcompress` — flatpak-builder
          # uses them to strip debug symbols from built binaries (FFmpeg, der
          # Rust-Sidecar, der Player). Without them, the build fails after the
          # compile step.
          # librsvg2-common ships the gdk-pixbuf SVG loader that flatpak-builder
          # invokes when it validates exported app icons (`hicolor/scalable/…
          # .svg`). With --no-install-recommends it's not pulled in, and the
          # export step bails with "is not a valid icon: Format not recognized".
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ostree rsync elfutils librsvg2-common
          flatpak remote-add --user --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo

      # ── Caches (huge speedup: FFmpeg wird aus der Quelle gebaut) ──
      # Two-step pattern (separate restore + save with if: always()) so cache
      # gets saved even when a later step fails. With actions/cache@v4 (single
      # action) the save would be skipped on job failure → every failed retry
      # would have to rebuild FFmpeg from scratch. (Der GSR-Bau, der hier
      # mitgemeint war, ist am 2026-08-27 entfallen — der Kaltbau ist seither
      # kuerzer, um wie viel ist nicht nachgemessen.)
      - name: Restore flatpak runtimes cache
        id: cache-runtimes
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ runner.os }}-${{ hashFiles('packaging/com.howispulse.Pulse.yml') }}
          restore-keys: |
            flatpak-runtimes-${{ runner.os }}-
      - name: Restore flatpak-builder cache
        id: cache-builder
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          # head_sha invalidates the cache when electron/dist/ changes,
          # since that path is gitignored and hashFiles can't see it.
          key: flatpak-builder-${{ runner.os }}-${{ github.event.head_sha }}-${{ hashFiles('packaging/com.howispulse.Pulse.yml') }}
          restore-keys: |
            flatpak-builder-${{ runner.os }}-

      # ── GPG signing key ──
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p packaging/.gpg
          chmod 700 packaging/.gpg
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --homedir packaging/.gpg --batch --import
          KEYID=$(gpg --homedir packaging/.gpg --list-keys --with-colons \
                  | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$KEYID" ]; then
            echo "::error::no GPG key fingerprint after import — check FLATPAK_GPG_PRIVATE_KEY secret"
            exit 1
          fi
          echo "FLATPAK_KEYID=$KEYID" >> "$GITHUB_ENV"
          echo "→ signing with $KEYID"

      # ── Build + sign + delta + prune ──
      # Same commands publish.fish runs. The `--user` + `--install-deps-from`
      # makes flatpak-builder pull the runtimes itself if cache missed.
      - name: Build & sign Flatpak
        run: |
          mkdir -p build/repo
          flatpak-builder --force-clean \
            --user --install-deps-from=flathub \
            --repo=build/repo \
            --gpg-sign="$FLATPAK_KEYID" --gpg-homedir=packaging/.gpg \
            build/flatpak packaging/com.howispulse.Pulse.yml

      # Server-App-Flatpak (com.howispulse.PulseServer) geparkt 2026-07-14
      # (App-Hosting zurückgestellt) → Build-Schritt entfernt. Zum Reaktivieren
      # nach dem Client-Build wieder `build:electron:server` + `flatpak-builder …
      # packaging/com.howispulse.PulseServer.yml` einsetzen (MUSS nach dem
      # Client-Build laufen, weil beide `desktop/electron/dist` überschreiben).

      - name: Generate static deltas + prune old commits
        run: |
          flatpak build-update-repo \
            --generate-static-deltas --prune --prune-depth=3 \
            --gpg-sign="$FLATPAK_KEYID" --gpg-homedir=packaging/.gpg \
            build/repo

      - name: Write .flatpakref + .flatpakrepo
        run: |
          PUBKEY_B64=$(gpg --homedir packaging/.gpg --export "$FLATPAK_KEYID" | base64 -w0)
          cat > build/repo/com.howispulse.Pulse.flatpakref <<EOF
          [Flatpak Ref]
          Title=Pulse
          Name=com.howispulse.Pulse
          Branch=master
          Url=https://howispulse.com/flatpak/
          Homepage=https://howispulse.com
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=$PUBKEY_B64
          EOF
          cat > build/repo/pulse.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Pulse
          Url=https://howispulse.com/flatpak/
          Homepage=https://howispulse.com
          GPGKey=$PUBKEY_B64
          EOF

      # ── Save caches (always, even on later failure) ──
      # The save happens BEFORE the rsync/publish steps so a network failure
      # later doesn't prevent us from keeping the expensive FFmpeg build.
      # `if: always()` makes save run even if Build & sign Flatpak partially
      # populated .flatpak-builder/ccache before crashing.
      - name: Save flatpak runtimes cache
        if: always() && steps.cache-runtimes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/flatpak
          key: ${{ steps.cache-runtimes.outputs.cache-primary-key }}
      - name: Save flatpak-builder cache
        if: always() && steps.cache-builder.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder
          key: ${{ steps.cache-builder.outputs.cache-primary-key }}

      # ── Publish ──
      - name: Set up SSH for rsync
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync repo to VPS
        run: |
          rsync -a --delete -e "ssh -i ~/.ssh/id_ed25519" \
            build/repo/ michael@159.195.150.54:pulse/flatpak-repo/

      - name: Summary
        run: |
          echo "✓ Flatpak republished to https://howispulse.com/flatpak/" >> "$GITHUB_STEP_SUMMARY"
          echo "  Client:  \`flatpak install --user https://howispulse.com/flatpak/com.howispulse.Pulse.flatpakref\`" >> "$GITHUB_STEP_SUMMARY"
          echo "  Update:   \`flatpak update\`" >> "$GITHUB_STEP_SUMMARY"

      # ── Tear down the imported signing key ──────────────────────────────
      # GitHub-hosted runners are ephemeral, so the key would die with the VM
      # anyway. This cleanup matters when someone moves to a self-hosted
      # runner: otherwise the decrypted private key would linger on the host
      # filesystem after the job ends.
      - name: Wipe imported GPG key
        if: always()
        run: rm -rf packaging/.gpg ~/.ssh/id_ed25519
