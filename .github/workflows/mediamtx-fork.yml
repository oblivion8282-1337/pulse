# Build + publish the Pulse-forked MediaMTX image. Workaround for a Chromium
# WebRTC-AV1 receive bug that hits AMD-VAAPI publishers — see
# infra/mediamtx-fork/README.md for the full story.
#
# Trigger: only when something under infra/mediamtx-fork/ changes on main.
# We don't rebuild on every commit because the binary is otherwise identical
# to upstream — there's nothing to bump unless the patch or Dockerfile
# changed.
#
# Output: two tags pushed to GHCR (Version und Patch-Stand liest der Lauf aus
# dem Dockerfile, das die Quelle der Wahrheit bleibt — der Tag unten ist der
# Stand vom 2026-09-03 und altert hier, nicht dort)
#   ghcr.io/oblivion8282-1337/pulse-mediamtx:1.19.1-pulse7  ← what compose pins
#   ghcr.io/oblivion8282-1337/pulse-mediamtx:latest        ← rolling, unused
#
# Build time: ~3 min cold, ~30 s with the gha cache warm.
#
# **Zwei Architekturen, ohne Emulation** (seit 2026-09-07). Bis dahin baute
# dieser Workflow ohne `platforms:` — also nur fuer die Architektur des
# Laeufers, amd64. Das Self-Host-Bild (`allinone.yml`) wird dagegen fuer amd64
# UND arm64 gebaut, konnte den Fork deshalb nicht einsetzen und fuhr
# Stock-MediaMTX. Heimservern fehlte damit vor allem Patch 0002, dessen
# PLI/FIR-Rueckweg als einziger ohne Schalter wirkt: nach einem Paketverlust
# fror das Bild dauerhaft ein. Der eigentliche Grund stand nirgends — im
# Self-Host-Dockerfile stand stattdessen eine Begruendung, die nur Patch 0001
# abdeckt.
#
# QEMU braucht es dafuer nicht: der Bau ist reines Go mit `CGO_ENABLED=0`,
# Go cross-kompiliert selbst. Das Dockerfile haelt die Bau-Stufe deshalb auf
# `$BUILDPLATFORM` und schaltet nur `GOARCH` um — beide Bilder entstehen auf
# demselben amd64-Laeufer in einem Durchgang, ein zweiter Laeufer wie in
# `allinone.yml` waere hier nur Umstand.

name: mediamtx-fork

on:
  push:
    branches: [main]
    paths:
      - 'infra/mediamtx-fork/**'
      - '.github/workflows/mediamtx-fork.yml'
  workflow_dispatch:

concurrency:
  group: mediamtx-fork
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Beide Angaben aus dem Dockerfile lesen, damit der Tag zu dem passt, was
      # wirklich gebaut wird. Quelle der Wahrheit bleibt das Dockerfile.
      #
      # `PULSE_REVISION` ist unser Patch-Stand und steht seit 2026-08-04 im
      # Tag (`1.19.1-pulse4`). Vorher hiess jeder Bau `<version>-pulse` — bei
      # einer Aenderung am Patch-Satz zeigte derselbe Tag danach auf anderen
      # Inhalt, ohne Rueckweg ausser einem Rebuild. Begruendung am ARG selbst.
      - name: Read MediaMTX version + patch revision from Dockerfile
        id: ver
        run: |
          v=$(grep -oP '^ARG MEDIAMTX_VERSION=\K[0-9.]+' infra/mediamtx-fork/Dockerfile)
          if [ -z "$v" ]; then
            echo "::error::could not parse MEDIAMTX_VERSION from Dockerfile"
            exit 1
          fi
          r=$(grep -oP '^ARG PULSE_REVISION=\K[0-9]+' infra/mediamtx-fork/Dockerfile)
          if [ -z "$r" ]; then
            echo "::error::could not parse PULSE_REVISION from Dockerfile"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$v-pulse$r" >> "$GITHUB_OUTPUT"
          echo "→ MediaMTX $v, Pulse-Patchstand $r → Tag $v-pulse$r"

      - uses: docker/build-push-action@v6
        with:
          context: infra/mediamtx-fork
          # Beide Architekturen in EINEM Aufruf: buildx legt darueber eine
          # Manifest-Liste, `docker pull` waehlt daraus selbst. Ein
          # Zusammenfuehren wie in `allinone.yml` (dort noetig, weil die Bilder
          # auf zwei verschiedenen Laeufern entstehen) entfaellt hier.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/oblivion8282-1337/pulse-mediamtx:${{ steps.ver.outputs.tag }}
            ghcr.io/oblivion8282-1337/pulse-mediamtx:latest
          cache-from: type=gha,scope=mediamtx-fork
          cache-to: type=gha,mode=max,scope=mediamtx-fork
