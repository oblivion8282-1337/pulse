# Build + publish the Pulse-forked MediaMTX image. Workaround for a Chromium
# WebRTC-AV1 receive bug that hits AMD-VAAPI publishers — see
# infra/mediamtx-fork/README.md for the full story.
#
# Trigger: only when something under infra/mediamtx-fork/ changes on main.
# We don't rebuild on every commit because the binary is otherwise identical
# to upstream v1.17.1 — there's nothing to bump unless the patch or Dockerfile
# changed.
#
# Output: two tags pushed to GHCR
#   ghcr.io/oblivion8282-1337/pulse-mediamtx:1.17.1-pulse  ← what compose pins
#   ghcr.io/oblivion8282-1337/pulse-mediamtx:latest        ← rolling, unused
#
# Build time: ~3 min cold, ~30 s with the gha cache warm. The build is
# straight `go build` of MediaMTX 1.17.1 + our patch; no cross-compile.

name: mediamtx-fork

on:
  push:
    branches: [main]
    paths:
      - 'infra/mediamtx-fork/**'
      - '.github/workflows/mediamtx-fork.yml'
  workflow_dispatch:

concurrency:
  group: mediamtx-fork
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Beide Angaben aus dem Dockerfile lesen, damit der Tag zu dem passt, was
      # wirklich gebaut wird. Quelle der Wahrheit bleibt das Dockerfile.
      #
      # `PULSE_REVISION` ist unser Patch-Stand und steht seit 2026-08-04 im
      # Tag (`1.19.1-pulse2`). Vorher hiess jeder Bau `<version>-pulse` — bei
      # einer Aenderung am Patch-Satz zeigte derselbe Tag danach auf anderen
      # Inhalt, ohne Rueckweg ausser einem Rebuild. Begruendung am ARG selbst.
      - name: Read MediaMTX version + patch revision from Dockerfile
        id: ver
        run: |
          v=$(grep -oP '^ARG MEDIAMTX_VERSION=\K[0-9.]+' infra/mediamtx-fork/Dockerfile)
          if [ -z "$v" ]; then
            echo "::error::could not parse MEDIAMTX_VERSION from Dockerfile"
            exit 1
          fi
          r=$(grep -oP '^ARG PULSE_REVISION=\K[0-9]+' infra/mediamtx-fork/Dockerfile)
          if [ -z "$r" ]; then
            echo "::error::could not parse PULSE_REVISION from Dockerfile"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$v-pulse$r" >> "$GITHUB_OUTPUT"
          echo "→ MediaMTX $v, Pulse-Patchstand $r → Tag $v-pulse$r"

      - uses: docker/build-push-action@v6
        with:
          context: infra/mediamtx-fork
          push: true
          tags: |
            ghcr.io/oblivion8282-1337/pulse-mediamtx:${{ steps.ver.outputs.tag }}
            ghcr.io/oblivion8282-1337/pulse-mediamtx:latest
          cache-from: type=gha,scope=mediamtx-fork
          cache-to: type=gha,mode=max,scope=mediamtx-fork
