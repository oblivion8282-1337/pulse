name: dcc-night

services:
  postgres:
    image: postgres:16-alpine
    container_name: dcc_night_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dcc}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcc} -d ${POSTGRES_DB:-dcc}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dcc_night_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # LiveKit (voice backend). Start with:
  #   docker compose --profile voice up -d
  # Profile gate keeps Phase A-D runs fast.
  #
  # network_mode: host — required so LiveKit can reach the voice-signaling
  # service for webhook delivery. voice-signaling listens on 127.0.0.1:8003;
  # the host's UFW DROP policy blocks traffic from a bridged container, so a
  # bridge + host.docker.internal does not work on this setup. Host networking
  # also avoids per-port iptables rules for the RTC UDP range (see
  # memory/feedback_docker_ports.md). LiveKit binds 7880 (HTTP/signalling),
  # 7881 (TCP fallback) and 7882-7892/UDP directly on the host.
  livekit:
    image: livekit/livekit-server:latest
    container_name: dcc_night_livekit
    profiles: ["voice"]
    network_mode: host
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
