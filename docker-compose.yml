name: dcc-night

services:
  postgres:
    image: postgres:16-alpine
    container_name: dcc_night_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dcc}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 127.0.0.1-Prefix: Dev-Wegwerf-Credentials (devpassword o.ä.) haben in
      # einem Café-WLAN nichts zu suchen — ohne Prefix bindet Docker auf
      # 0.0.0.0 (Audit 2026-09). Gleiches gilt für Redis/MinIO unten.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcc} -d ${POSTGRES_DB:-dcc}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dcc_night_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # MinIO (S3-compatible object store for message attachments). Bucket
  # `pulse-attachments` is created on every `up` by the one-shot
  # `minio-init` service below (idempotent — exits 0 if the bucket
  # already exists). Console UI at http://localhost:9001, S3 API at :9000.
  # Dev credentials are the MinIO defaults (minioadmin/minioadmin) —
  # localhost-only, never exposed publicly.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dcc_night_minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: dcc_night_minio_init
    depends_on:
      minio:
        condition: service_healthy
    # Idempotent: `mb --ignore-existing` returns 0 if the bucket already
    # exists. Container exits after — re-run on every `up` is fine.
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/pulse-attachments &&
        echo "bucket pulse-attachments ready"
    restart: "no"

  # LiveKit (voice backend). Start with:
  #   docker compose --profile voice up -d
  # Profile gate keeps Phase A-D runs fast.
  #
  # network_mode: host — required so LiveKit can reach the voice-signaling
  # service for webhook delivery. voice-signaling listens on 127.0.0.1:8003;
  # the host's UFW DROP policy blocks traffic from a bridged container, so a
  # bridge + host.docker.internal does not work on this setup. Host networking
  # also avoids per-port iptables rules for the RTC UDP range (see
  # memory/feedback_docker_ports.md). LiveKit binds 7880 (HTTP/signalling),
  # 7881 (TCP fallback) and 7882-7892/UDP directly on the host.
  livekit:
    image: livekit/livekit-server:latest
    container_name: dcc_night_livekit
    profiles: ["voice"]
    network_mode: host
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
