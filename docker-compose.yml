name: dcc-night

services:
  postgres:
    image: postgres:16-alpine
    container_name: dcc_night_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dcc}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 127.0.0.1-Prefix: Dev-Wegwerf-Credentials (devpassword o.ä.) haben in
      # einem Café-WLAN nichts zu suchen — ohne Prefix bindet Docker auf
      # 0.0.0.0 (Audit 2026-09). Gleiches gilt für Redis/Garage unten.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcc} -d ${POSTGRES_DB:-dcc}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dcc_night_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # Garage (S3-compatible object store for message attachments) — ersetzt
  # MinIO (Bughunt-Entscheidung 4.1, Prod/Self-Host zogen mit Runde 32
  # vorher). Bucket + Key legt `scripts/dev-garage-init.sh` idempotent an
  # (das dxflrs-Image hat keine Shell, darum kein Init-Container); dev-up.fish
  # ruft es nach dem up automatisch auf. S3 API at :9000 — chat-gateway
  # signiert per Default gegen http://localhost:9000, daran ändert sich
  # gegenüber MinIO nichts (Dev-Creds bleiben minioadmin/minioadmin).
  # Achtung: der alte `miniodata`-Bestand wird NICHT migriert — Dev-Daten.
  garage:
    image: dxflrs/garage:v1.1.0
    container_name: dcc_night_garage
    # Kein Entrypoint im Image (CMD ist [/garage, server]) — der volle Aufruf
    # muss hier rein, `command: ["-c", …]` allein würde "-c" als Programm
    # ausführen (in der Prod-Compose derselbe Bug, dort mitgefixt).
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    ports:
      - "127.0.0.1:${GARAGE_HOST_PORT:-9000}:9000"
    restart: unless-stopped

  # LiveKit (voice backend). Start with:
  #   docker compose --profile voice up -d
  # Profile gate keeps Phase A-D runs fast.
  #
  # network_mode: host — required so LiveKit can reach the voice-signaling
  # service for webhook delivery. voice-signaling listens on 127.0.0.1:8003;
  # the host's UFW DROP policy blocks traffic from a bridged container, so a
  # bridge + host.docker.internal does not work on this setup. Host networking
  # also avoids per-port iptables rules for the RTC UDP range (see
  # memory/feedback_docker_ports.md). LiveKit binds 7880 (HTTP/signalling),
  # 7881 (TCP fallback) and 7882-7892/UDP directly on the host.
  livekit:
    image: livekit/livekit-server:latest
    container_name: dcc_night_livekit
    profiles: ["voice"]
    network_mode: host
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  # miniodata bleibt als verwaistes Volume auf der Platte, falls alte
  # Dev-Anhänge noch gebraucht werden — Garage nutzt garagedata.
  garagedata:
