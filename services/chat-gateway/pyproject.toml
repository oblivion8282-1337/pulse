[project]
name = "dcc-chat-gateway"
version = "0.1.0"
description = "Chat gateway service (REST + WebSocket fan-out)"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.10",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "websockets>=13.0",
    "pillow>=11.0",
    "python-multipart>=0.0.20",
    "aiobotocore>=2.13",
    "pywebpush>=2.0,<3",
    "aiozipstream>=0.4",
    "dcc-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_chat_gateway"]
