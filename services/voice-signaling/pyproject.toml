[project]
name = "dcc-voice-signaling"
version = "0.1.0"
description = "Voice signaling service - issues LiveKit tokens (Phase E stub)"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "structlog>=24.4",
    "livekit-api>=1.0",
    "dcc-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_voice_signaling"]
