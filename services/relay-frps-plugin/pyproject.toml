[project]
name = "dcc-relay-frps-plugin"
version = "0.1.0"
description = "frps server-plugin — authorises Pulse self-host tunnels via /selfhost/relay/auth"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_relay_frps_plugin"]
