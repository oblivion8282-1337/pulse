[project]
name = "dcc-auth"
version = "0.1.0"
description = "Authentication service for Discord-Clone"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.10",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
    "pillow>=11.0",
    "email-validator>=2.2",
    "httpx>=0.27",
    "pyotp>=2.9,<3",
    "qrcode[pil]>=8.0,<9",
    "dcc-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_auth"]
