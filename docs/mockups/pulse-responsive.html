<!doctype html>
<html lang="de" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pulse — Mobile &amp; Tablet Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Pulse — responsive mockups (mobile + tablet)
   Static HTML/CSS prototype of the "Glasshouse / Graphite" UI.
   - One markup, adapts via @container queries on the device frame
   - Toolbar switches view / device size / theme / sub-states
   No build step, no framework — just open in a browser.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --shell-bg:#0a0a0c;
  --shell-bg-2:#121214;
  --shell-line:rgba(255,255,255,.09);
  --shell-text:#e7e8ea;
  --shell-dim:#8b8d93;
  --shell-accent:#3b82f6;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --sans:'Plus Jakarta Sans','Plus Jakarta Sans Variable',system-ui,sans-serif;
}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:
    radial-gradient(900px 600px at 12% -5%, rgba(59,130,246,.12), transparent 60%),
    radial-gradient(900px 600px at 105% 110%, rgba(16,185,129,.08), transparent 60%),
    var(--shell-bg);
  color:var(--shell-text);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  min-height:100%;
  overflow-x:hidden;
}

/* ---------- top toolbar (the mockup chrome, not the app) ---------- */
.bar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:12px 20px;
  background:rgba(10,10,12,.78);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--shell-line);
}
.bar .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:15px}
.bar .brand svg{width:26px;height:26px;border-radius:8px;display:block}
.bar .brand small{font-weight:600;color:var(--shell-dim);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--shell-bg-2);border:1px solid var(--shell-line);border-radius:11px;padding:3px;gap:2px}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--shell-dim);
  font:600 12.5px/1 var(--sans);padding:7px 12px;border-radius:8px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.seg button svg{width:14px;height:14px}
.seg button:hover{color:var(--shell-text)}
.seg button[aria-pressed="true"]{background:rgba(59,130,246,.16);color:#bcd6ff;box-shadow:inset 0 0 0 1px rgba(59,130,246,.28)}
.bar .label{font-size:11px;color:var(--shell-dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-right:-8px}
.bar .spacer{flex:1}
.bar .hint{font-size:12px;color:var(--shell-dim)}
.bar .hint b{color:var(--shell-text);font-weight:700}

/* ---------- stage + device frames ---------- */
.stage{
  flex:1;display:flex;gap:48px;align-items:flex-start;justify-content:center;flex-wrap:wrap;
  padding:42px 24px 70px;
}
.devwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.devwrap > .cap{font-size:12px;color:var(--shell-dim);font-weight:600;letter-spacing:.02em}
.devwrap > .cap b{color:var(--shell-text)}

.device{
  position:relative;border-radius:46px;
  background:linear-gradient(150deg,#1c1d22,#0c0c0e);
  padding:13px;
  box-shadow:
    0 2px 0 rgba(255,255,255,.05) inset,
    0 40px 90px -20px rgba(0,0,0,.7),
    0 0 0 1px rgba(255,255,255,.04);
}
.device.phone{width:386px}
.device.tablet{width:760px;border-radius:34px;padding:16px}
.device .notch{
  position:absolute;left:50%;top:13px;transform:translateX(-50%);
  width:128px;height:26px;background:#0c0c0e;border-radius:0 0 16px 16px;z-index:6;
}
.device.tablet .notch{display:none}
.device .screen{
  position:relative;overflow:hidden;border-radius:34px;
  height:780px;contain:layout;
  container-type:inline-size;container-name:screen;
  /* Glasshouse background (dark) */
  background:
    radial-gradient(440px 340px at 8% 12%, rgba(37,99,235,.16), transparent 70%),
    radial-gradient(480px 360px at 100% 100%, rgba(16,185,129,.10), transparent 70%),
    linear-gradient(150deg,#0b0b0c,#0d0d0f 30%,#111113 65%,#161618);
  color:#f0f1f3;
  font-size:14px;
  isolation:isolate;
}
.device.tablet .screen{height:560px;border-radius:24px}
/* subtle grain */
.device .screen::after{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.05;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
/* fake iOS status bar inside the screen */
.statusbar{
  position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  height:34px;padding:0 22px;font-size:12px;font-weight:700;letter-spacing:.02em;color:#f0f1f3;
  pointer-events:none;
}
.device.tablet .statusbar{padding:0 16px;height:24px;font-size:11px}
.statusbar .right{display:flex;align-items:center;gap:6px}
.statusbar .bat{width:22px;height:11px;border:1.4px solid currentColor;border-radius:3px;position:relative;opacity:.85}
.statusbar .bat::after{content:'';position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:13px;background:currentColor;border-radius:1px}
.statusbar .bat::before{content:'';position:absolute;right:-3.5px;top:3px;bottom:3px;width:2px;background:currentColor;border-radius:0 1px 1px 0}

/* the actual app viewport (below the status bar) */
.app{
  position:absolute;left:0;right:0;top:34px;bottom:0;z-index:2;
  display:flex;flex-direction:column;overflow:hidden;
}
.device.tablet .app{top:24px}

/* glass panel helper (matches .glass-panel) */
.glass{
  background:rgba(20,20,24,.86);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

/* light-mode override for screens with .light on .screen */
.screen.light{
  background:
    radial-gradient(440px 340px at 8% 12%, rgba(37,99,235,.10), transparent 70%),
    radial-gradient(480px 360px at 100% 100%, rgba(16,185,129,.07), transparent 70%),
    linear-gradient(150deg,#fcfcfd,#f6f7f9 40%,#f0f1f3);
  color:#111827;
}
.screen.light .statusbar{color:#111827}
.screen.light .app{color:#111827}
.screen.light .glass{background:rgba(255,255,255,.9);border-color:rgba(255,255,255,.6);box-shadow:0 10px 30px rgba(30,40,60,.08),0 1px 3px rgba(30,40,60,.05)}

/* ============================================================
   shared app primitives
   ============================================================ */
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.dim{color:#9ca3af}
.screen.light .dim{color:#6b7280}
.faint{color:#6b7280}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.ic.lg{width:24px;height:24px}
.ic.fill{fill:currentColor;stroke:none}
.iconbtn{
  appearance:none;border:0;background:transparent;color:#c8cad0;cursor:pointer;
  width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;
}
.screen.light .iconbtn{color:#4b5563}
.iconbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.screen.light .iconbtn:hover{background:rgba(37,99,235,.08);color:#111827}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.glasschip{background:rgba(0,0,0,.45);color:#e7e8ea;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12)}
.pill.live{background:rgba(239,68,68,.16);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.pill.ok{background:rgba(34,197,94,.16);color:#86efac;border:1px solid rgba(34,197,94,.28)}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex:none}
.dot.red{background:#ef4444;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.btn{
  appearance:none;border:0;cursor:pointer;font:600 14px/1 var(--sans);
  padding:11px 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
  background:rgba(255,255,255,.06);color:#f0f1f3;border:1px solid rgba(255,255,255,.08);
}
.screen.light .btn{background:rgba(255,255,255,.6);color:#111827;border-color:rgba(255,255,255,.6)}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border-color:transparent;box-shadow:0 6px 18px -6px rgba(37,99,235,.7)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:rgba(239,68,68,.14);color:#fca5a5;border-color:rgba(239,68,68,.28)}
.btn.danger:hover{background:rgba(239,68,68,.2)}
.btn.block{width:100%}
.field{
  width:100%;font:500 14px/1.3 var(--sans);color:inherit;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:11px;
  padding:11px 13px;outline:none;transition:.15s;
}
.screen.light .field{background:rgba(17,24,39,.04);border-color:rgba(17,24,39,.12)}
.field:focus{border-color:rgba(59,130,246,.6);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;margin-bottom:6px;display:block}
.avatar{border-radius:50%;background:linear-gradient(135deg,#2563eb,#22c55e);display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden;font-size:.86em}
.avatar.ring{box-shadow:0 0 0 2px rgba(34,197,94,.9),0 0 0 5px rgba(34,197,94,.22)}
.toggle{width:40px;height:23px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;cursor:pointer;transition:.18s}
.toggle::after{content:'';position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.toggle.on{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.toggle.on::after{transform:translateX(17px)}
.slider{height:6px;border-radius:999px;background:rgba(255,255,255,.12);position:relative}
.slider > i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(135deg,#2563eb,#3b82f6)}
.slider > b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.segline{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:2px}
.screen.light .segline{background:rgba(17,24,39,.05);border-color:rgba(17,24,39,.1)}
.segline span{font-size:12px;font-weight:600;padding:6px 11px;border-radius:7px;color:#9ca3af;cursor:pointer}
.segline span.active{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}
hr.sep{border:0;border-top:1px solid rgba(255,255,255,.07);margin:0}
.screen.light hr.sep{border-color:rgba(17,24,39,.08)}

/* the view system: only the active view is shown */
.view{display:none;flex:1;min-height:0}
.screen[data-view="chat"]     .view-chat{display:flex}
.screen[data-view="voice"]    .view-voice{display:flex}
.screen[data-view="login"]    .view-login{display:flex}
.screen[data-view="register"] .view-register{display:flex}
.screen[data-view="settings"] .view-settings{display:flex}

/* ============================================================
   CHAT VIEW
   ============================================================ */
.view-chat{flex-direction:row;position:relative}

/* mobile: top bar + messages + composer; tablet: 3-pane */
.chat-rails{display:none}
.chat-topbar{
  display:flex;align-items:center;gap:6px;padding:8px 8px 8px 6px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.screen.light .chat-topbar{border-color:rgba(17,24,39,.08)}
.chat-topbar .title{display:flex;flex-direction:column;min-width:0;line-height:1.15;margin-left:2px}
.chat-topbar .title b{font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px}
.chat-topbar .title b .ic{width:15px;height:15px;opacity:.55;stroke-width:2.4}
.chat-topbar .title small{font-size:11px;color:#9ca3af}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-msgs{flex:1;overflow:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:14px}
.daydiv{display:flex;align-items:center;gap:12px;color:#6b7280;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.daydiv::before,.daydiv::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
.screen.light .daydiv::before,.screen.light .daydiv::after{background:rgba(17,24,39,.1)}
.msg{display:flex;gap:11px}
.msg .avatar{width:38px;height:38px}
.msg .body{min-width:0;flex:1}
.msg .meta{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.msg .meta b{font-size:14px;font-weight:700}
.msg .meta time{font-size:11px;color:#6b7280}
.msg .txt{font-size:14px;line-height:1.5;color:#d6d8dd;overflow-wrap:anywhere}
.screen.light .msg .txt{color:#374151}
.msg .txt code{font-family:var(--mono);font-size:.85em;background:rgba(37,99,235,.18);color:#93c5fd;padding:.1em .4em;border-radius:5px}
.screen.light .msg .txt code{color:#1d4ed8;background:rgba(37,99,235,.12)}
.msg.cont{margin-top:-9px;padding-left:49px}
.msg.cont .txt{position:relative}
.msg.cont:hover .stamp{opacity:1}
.msg.cont .stamp{position:absolute;left:-44px;top:3px;font-size:10px;color:#6b7280;opacity:0;width:34px;text-align:right}
.msg .embed{margin-top:7px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.09);max-width:340px}
.msg .embed .ph{aspect-ratio:16/10;background:linear-gradient(135deg,#1e293b,#0f172a);display:grid;place-items:center;color:#475569}
.msg .reacts{display:flex;gap:6px;margin-top:7px}
.msg .react{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);color:#bcd6ff}
.unread{align-self:stretch;display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#ef4444}
.unread::before{content:'';flex:1;height:1px;background:#ef4444;opacity:.5}
.unread::after{content:'NEU';padding:1px 6px;border-radius:5px;background:#ef4444;color:#fff}
.typing{padding:0 16px 4px;font-size:12px;color:#9ca3af;display:flex;align-items:center;gap:7px}
.typing i{width:5px;height:5px;border-radius:50%;background:#9ca3af;animation:tb 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.composer{
  margin:8px;padding:6px 6px 6px 10px;border-radius:16px;display:flex;align-items:center;gap:6px;
}
.composer input{flex:1;background:transparent;border:0;outline:none;color:inherit;font:500 14px/1 var(--sans);padding:9px 4px}
.composer input::placeholder{color:#6b7280}
.composer .send{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}
.composer .send:hover{filter:brightness(1.08);background:linear-gradient(135deg,#2563eb,#3b82f6)}

/* sliding drawer (mobile only) */
.drawer{
  position:absolute;inset:0 30% 0 0;z-index:9;display:flex;
  transform:translateX(-104%);transition:transform .28s cubic-bezier(.3,.8,.3,1);
  pointer-events:none;
}
.screen[data-chat="drawer"] .drawer{transform:translateX(0);pointer-events:auto}
.screen[data-chat="drawer"] .chat-main::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:8}
.drawer .guildrail{
  width:62px;flex:none;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 0;
  background:rgba(0,0,0,.35);border-right:1px solid rgba(255,255,255,.06);
}
.drawer .channels{flex:1;display:flex;flex-direction:column;background:rgba(14,14,16,.96);border-right:1px solid rgba(255,255,255,.06)}
.screen.light .drawer .guildrail{background:rgba(0,0,0,.06)}
.screen.light .drawer .channels{background:rgba(255,255,255,.96)}
.guildicon{
  width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-weight:800;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.07);position:relative;transition:.18s;font-size:13px;
}
.guildicon.active{border-radius:14px}
.guildicon.active::before{content:'';position:absolute;left:-13px;top:50%;transform:translateY(-50%);width:5px;height:24px;border-radius:0 4px 4px 0;background:#fff}
.guildicon.brandG{background:linear-gradient(135deg,#2563eb,#22c55e)}
.guildicon.addG{background:rgba(34,197,94,.14);color:#4ade80;font-size:20px}
.channels .ghead{
  padding:14px 14px 12px;font-weight:800;font-size:15px;border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:space-between;
}
.channels .ghead .ic{opacity:.5}
.channels .list{flex:1;overflow:auto;padding:8px 8px 12px}
.channels .cat{padding:14px 8px 6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;display:flex;align-items:center;justify-content:space-between}
.chitem{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;color:#9ca3af;cursor:pointer;font-size:14.5px;font-weight:500;
  margin-bottom:2px;
}
.chitem .ic{width:18px;height:18px;opacity:.6;flex:none}
.chitem:hover{background:rgba(255,255,255,.05);color:#d6d8dd}
.chitem.active{background:rgba(59,130,246,.16);color:#fff}
.chitem.active .ic{opacity:.9}
.chitem .badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.chitem .who{margin-left:auto;font-size:11px;color:#6b7280}
.voicemember{display:flex;align-items:center;gap:8px;padding:4px 9px 4px 30px;font-size:13px;color:#9ca3af}
.voicemember .avatar{width:22px;height:22px}
.userfooter{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.25);
}
.userfooter .avatar{width:30px;height:30px}
.userfooter .nm{flex:1;min-width:0;line-height:1.1}
.userfooter .nm b{font-size:13px;font-weight:700;display:block}
.userfooter .nm small{font-size:11px;color:#86efac}

/* member list overlay (mobile) — reachable via 👥 */
.memsheet{
  position:absolute;inset:0 0 0 28%;z-index:9;background:rgba(14,14,16,.97);border-left:1px solid rgba(255,255,255,.07);
  transform:translateX(104%);transition:transform .28s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;
}
.screen.light .memsheet{background:rgba(255,255,255,.97)}
.screen[data-chat="members"] .memsheet{transform:translateX(0)}
.screen[data-chat="members"] .chat-main::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:8}
.memsheet .mhead{padding:14px 16px;font-weight:800;font-size:14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between}
.memsheet .mlist{flex:1;overflow:auto;padding:10px}
.memsheet .mcat{padding:10px 8px 6px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#6b7280}
.memrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;font-size:14px}
.memrow:hover{background:rgba(255,255,255,.05)}
.memrow .avatar{width:32px;height:32px;position:relative}
.memrow .avatar::after{content:'';position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2.5px solid #0e0e10}
.screen.light .memrow .avatar::after{border-color:#fff}
.memrow.off .avatar{filter:grayscale(1) brightness(.6)}
.memrow.off .avatar::after{background:#6b7280}
.memrow.off{color:#6b7280}

/* ============================================================
   VOICE / HQ-STREAM VIEW
   ============================================================ */
.view-voice{flex-direction:column}
.voice-rails{display:none}
.voice-main{flex:1;display:flex;flex-direction:column;min-width:0}
.voice-topbar{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 6px;border-bottom:1px solid rgba(255,255,255,.07)}
.screen.light .voice-topbar{border-color:rgba(17,24,39,.08)}
.voice-topbar .title{display:flex;flex-direction:column;min-width:0;margin-left:2px;line-height:1.15}
.voice-topbar .title b{font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px}
.voice-topbar .title b .ic{width:16px;height:16px;opacity:.6}
.voice-topbar .title small{font-size:11px;color:#9ca3af}
.voice-stagewrap{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px;min-height:0}
/* big HQ stream surface */
.hqstage{
  position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;
  background:
    radial-gradient(120% 120% at 30% 20%, #1f3a5f, transparent 60%),
    linear-gradient(160deg,#0c1726,#060a12);
  border:1px solid rgba(255,255,255,.08);
  display:grid;place-items:center;
}
.hqstage .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.1);backdrop-filter:blur(6px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.18)}
.hqstage .play .ic{width:26px;height:26px;margin-left:3px;fill:#fff;stroke:none}
.hqstage .tl{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center}
.hqstage .tr{position:absolute;right:12px;top:12px}
.hqstage .br{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.hqstage .bl{position:absolute;left:12px;bottom:12px}
.hqstage .scanline{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.18) 3px,rgba(0,0,0,.18) 4px);opacity:.35;mix-blend-mode:multiply;pointer-events:none}
/* participant tiles strip */
.tiles{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;flex:none}
.tile{
  flex:none;width:108px;aspect-ratio:1/.92;border-radius:14px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);
  display:grid;place-items:center;
}
.screen.light .tile{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.6)}
.tile .avatar{width:46px;height:46px}
.tile.speaking{border-color:rgba(34,197,94,.7);box-shadow:0 0 0 1px rgba(34,197,94,.4),0 0 22px -4px rgba(34,197,94,.5) inset}
.tile .nm{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:7px;display:flex;align-items:center;gap:4px;max-width:88%}
.tile .nm .ic{width:11px;height:11px}
.tile .nm.muted{color:#fca5a5}
.tile.me{background:linear-gradient(150deg,rgba(37,99,235,.18),rgba(34,197,94,.1));border-color:rgba(59,130,246,.4)}
.tile.screenshare{aspect-ratio:1/.62;background:linear-gradient(150deg,#1e293b,#0b1220)}
.tile.screenshare .miniplay{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.tile.screenshare .miniplay .ic{width:14px;height:14px;fill:#fff;stroke:none;margin-left:2px}
/* control bar */
.controlbar{
  margin:8px;border-radius:18px;padding:9px 10px;display:flex;align-items:center;justify-content:center;gap:8px;flex:none;
}
.cbtn{
  appearance:none;border:0;cursor:pointer;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;transition:.15s;
  background:rgba(255,255,255,.07);color:#e7e8ea;border:1px solid rgba(255,255,255,.08);position:relative;
}
.screen.light .cbtn{background:rgba(255,255,255,.6);color:#374151;border-color:rgba(255,255,255,.6)}
.cbtn:hover{background:rgba(255,255,255,.12)}
.cbtn .ic{width:21px;height:21px}
.cbtn.on{background:rgba(59,130,246,.18);color:#bcd6ff;border-color:rgba(59,130,246,.35)}
.cbtn.danger{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.cbtn.danger:hover{background:rgba(239,68,68,.24)}
.cbtn.muted{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.cbtn .reddot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#ef4444;border:2px solid #141416;animation:blink 1.6s infinite}
.screen.light .cbtn .reddot{border-color:#fff}
.cbtn .lbl-t{display:none}

/* ============================================================
   AUTH (login / register)
   ============================================================ */
.view-login,.view-register{align-items:stretch;justify-content:center}
.authsplit{display:flex;flex:1;min-width:0}
.authbrand{display:none}
.authpane{flex:1;display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto}
.authcard{
  width:100%;max-width:380px;border-radius:22px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;
}
.authcard .logo{width:54px;height:54px;border-radius:16px;align-self:center}
.authcard h1{font-size:21px;font-weight:800;text-align:center;letter-spacing:-.02em}
.authcard .sub{text-align:center;font-size:13px;color:#9ca3af;margin-top:-8px}
.authcard .grp{display:flex;flex-direction:column;gap:6px}
.authcard .fineprint{font-size:11px;color:#6b7280;line-height:1.4;margin-top:-4px}
.authcard .alt{text-align:center;font-size:13px;color:#9ca3af}
.authcard .alt a{color:#60a5fa;font-weight:600;text-decoration:none}
.authcard .alt a:hover{text-decoration:underline}
.authcard .strength{display:flex;gap:4px;margin-top:2px}
.authcard .strength i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.authcard .strength i.s1{background:#22c55e}
.pwrow{position:relative}
.pwrow .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px}
/* tablet brand panel */
.authbrand-inner{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:42px;height:100%}
.authbrand-inner .bigmark{position:relative;width:120px;height:120px}
.authbrand-inner .bigmark .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.authbrand-inner .bigmark .ring.r2{inset:18px;border-color:rgba(255,255,255,.32)}
.authbrand-inner .bigmark .ring.r3{inset:40px;border-color:rgba(255,255,255,.7);animation:ping 2.6s ease-out infinite}
.authbrand-inner .bigmark .core{position:absolute;inset:52px;border-radius:50%;background:#fff}
@keyframes ping{0%{transform:scale(.7);opacity:1}80%,100%{transform:scale(1.6);opacity:0}}
.authbrand-inner h2{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.authbrand-inner p{font-size:14px;color:#9ca3af;max-width:34ch;line-height:1.55}
.authbrand-inner .feats{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.authbrand-inner .feats div{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#c8cad0}
.authbrand-inner .feats .ic{width:16px;height:16px;color:#4ade80}

/* ============================================================
   SETTINGS
   ============================================================ */
.view-settings{flex-direction:row}
.set-list{flex:1;display:flex;flex-direction:column;min-width:0}
.set-topbar{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.screen.light .set-topbar{border-color:rgba(17,24,39,.08)}
.set-topbar b{font-size:16px;font-weight:800;margin-left:4px}
.set-scroll{flex:1;overflow:auto;padding:10px 12px 20px}
.set-userblock{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;margin-bottom:14px}
.set-userblock .avatar{width:52px;height:52px}
.set-userblock .nm b{font-size:15px;font-weight:800;display:block}
.set-userblock .nm small{font-size:12px;color:#9ca3af}
.set-userblock .edit{margin-left:auto}
.set-cat{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#6b7280;padding:14px 6px 7px}
.set-group{border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.screen.light .set-group{border-color:rgba(17,24,39,.08)}
.set-item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:rgba(255,255,255,.03);cursor:pointer;font-size:14.5px;font-weight:600;transition:.12s}
.screen.light .set-item{background:rgba(255,255,255,.45)}
.set-item + .set-item{border-top:1px solid rgba(255,255,255,.06)}
.screen.light .set-item + .set-item{border-color:rgba(17,24,39,.07)}
.set-item:hover{background:rgba(255,255,255,.06)}
.set-item .ic.lead{width:19px;height:19px;color:#9ca3af}
.set-item .arrow{margin-left:auto;color:#6b7280}
.set-item .val{margin-left:auto;color:#9ca3af;font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px}
.set-item.locked{opacity:.6;cursor:not-allowed}
.set-item .lockbadge{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.04em;background:rgba(255,255,255,.08);color:#9ca3af;padding:3px 7px;border-radius:6px}
.set-foot{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.set-ver{text-align:center;font-size:11px;color:#6b7280}
/* detail pane */
.set-detail{flex:1;display:flex;flex-direction:column;min-width:0;border-left:1px solid rgba(255,255,255,.07)}
.screen.light .set-detail{border-color:rgba(17,24,39,.08)}
.set-detail .dhead{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.screen.light .set-detail .dhead{border-color:rgba(17,24,39,.08)}
.set-detail .dhead b{font-size:16px;font-weight:800;margin-left:4px}
.set-detail .dscroll{flex:1;overflow:auto;padding:16px}
.set-row{display:flex;align-items:center;gap:14px;padding:14px 0}
.set-row + .set-row{border-top:1px solid rgba(255,255,255,.07)}
.screen.light .set-row + .set-row{border-color:rgba(17,24,39,.07)}
.set-row .txt{flex:1;min-width:0}
.set-row .txt b{font-size:14px;font-weight:700;display:block}
.set-row .txt small{font-size:12px;color:#9ca3af;display:block;margin-top:2px;line-height:1.4}
.set-row.stacked{flex-direction:column;align-items:stretch;gap:9px}
.set-row .selectfake{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:13.5px;font-weight:600}
.screen.light .set-row .selectfake{background:rgba(17,24,39,.04);border-color:rgba(17,24,39,.12)}
.set-row .keycap{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-bottom-width:2px;border-radius:6px;padding:3px 8px;font-weight:700}
.set-dgroup-title{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#6b7280;margin:6px 0 -4px}

/* ============================================================
   container queries — TABLET layout (≥ 600 cqi)
   ============================================================ */
@container screen (min-width: 600px){
  /* CHAT → 3 panes */
  .view-chat .drawer{display:none}
  .chat-rails{display:flex;flex:none}
  .chat-rails .guildrail{width:64px;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 0;background:rgba(0,0,0,.28);border-right:1px solid rgba(255,255,255,.06)}
  .screen.light .chat-rails .guildrail{background:rgba(0,0,0,.05)}
  .chat-rails .channels{width:206px;display:flex;flex-direction:column;background:rgba(255,255,255,.03);border-right:1px solid rgba(255,255,255,.06)}
  .screen.light .chat-rails .channels{background:rgba(255,255,255,.4)}
  .chat-topbar .menutoggle{display:none}
  .chat-topbar .draweronly{display:none}
  .view-chat .memsheet{position:static;transform:none;width:194px;flex:none;background:rgba(255,255,255,.025)}
  .screen.light .view-chat .memsheet{background:rgba(255,255,255,.35)}
  .view-chat .memsheet .mhead .iconbtn{display:none}
  .screen[data-chat] .chat-main::before{display:none!important}

  /* VOICE → rail + bigger stage + grid tiles */
  .voice-rails{display:flex;flex:none}
  .voice-rails .guildrail{width:64px;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 0;background:rgba(0,0,0,.28);border-right:1px solid rgba(255,255,255,.06)}
  .screen.light .voice-rails .guildrail{background:rgba(0,0,0,.05)}
  .voice-rails .channels{width:206px;display:flex;flex-direction:column;background:rgba(255,255,255,.03);border-right:1px solid rgba(255,255,255,.06)}
  .screen.light .voice-rails .channels{background:rgba(255,255,255,.4)}
  .voice-topbar .menutoggle{display:none}
  .voice-stagewrap{flex-direction:row}
  .voice-stagewrap .hqcol{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
  .voice-stagewrap .tiles{flex-direction:column;width:128px;overflow-y:auto;overflow-x:hidden}
  .voice-stagewrap .tiles .tile{width:auto}
  .controlbar{justify-content:center}
  .cbtn{width:auto;height:42px;padding:0 14px;border-radius:13px;gap:8px}
  .cbtn .lbl-t{display:inline;font-size:13px;font-weight:600}

  /* AUTH → split brand + form */
  .authbrand{display:block;flex:1;background:linear-gradient(150deg,#0e1f3a,#0a1525 60%,#08130c);position:relative;overflow:hidden}
  .authbrand::after{content:'';position:absolute;inset:0;background:radial-gradient(420px 320px at 75% 18%,rgba(59,130,246,.25),transparent 60%),radial-gradient(420px 320px at 20% 95%,rgba(16,185,129,.18),transparent 60%)}
  .authbrand-inner{position:relative;z-index:1}
  .authpane{flex:0 0 46%}
  .authcard{box-shadow:none;background:transparent!important;border:0!important;padding:18px 6px}
  .screen.light .authbrand{background:linear-gradient(150deg,#1e3a8a,#155e3b)}

  /* SETTINGS → list + detail side by side */
  .set-topbar .menutoggle{display:none}
  .set-list{flex:0 0 270px}
  .set-detail{display:flex!important}
  .set-detail .dhead .iconbtn.back{display:none}
  /* on tablet, the open list item is highlighted */
  .set-item.opened{background:rgba(59,130,246,.14)!important;color:#bcd6ff}
}

/* phone-only: settings detail is a separate screen */
@container screen (max-width: 599.98px){
  .set-detail{position:absolute;inset:0;z-index:8;background:inherit;transform:translateX(101%);transition:transform .26s cubic-bezier(.3,.8,.3,1);border-left:0}
  .screen[data-set="detail"] .set-detail{transform:translateX(0)}
  .screen[data-set="detail"] .set-detail{background:
    radial-gradient(440px 340px at 8% 12%, rgba(37,99,235,.16), transparent 70%),
    linear-gradient(150deg,#0b0b0c,#0d0d0f 30%,#111113 65%,#161618)}
  .screen.light[data-set="detail"] .set-detail{background:linear-gradient(150deg,#fcfcfd,#f6f7f9 40%,#f0f1f3)}
  .set-detail .dhead .iconbtn.back{display:inline-flex}
}
</style>

<script>
const stage   = document.getElementById('stage');
const tpl     = document.getElementById('screenTpl');
const ctxHint = document.getElementById('ctxHint');
const state   = { view:'chat', dev:'phone', theme:'dark' };

const VIEW_LABEL = {chat:'Haupt-Chat-View', voice:'Voice / HQ-Stream', login:'Login', register:'Registrierung', settings:'Einstellungen'};
const HINTS = {
  chat:'Phone: ☰ öffnet den Server/Kanal-Drawer · 👥 das Mitglieder-Sheet. Tablet: 3 Spalten (Server-Rail · Kanäle · Chat · Mitglieder).',
  voice:'Ein fremder HQ-Stream füllt die große Fläche; Teilnehmer-Kacheln als Streifen. Tablet: Stream + Kachel-Spalte + Steuerleiste mit Labels.',
  login:'Phone: zentrierte Glas-Karte. Tablet: Split — Brand-Panel mit Sonar-Ping links, Formular rechts.',
  register:'Wie Login; zusätzlich Benutzername + Passwort-Stärke + Hinweistext.',
  settings:'Phone: Kategorie-Liste → tippt in eine Kategorie (eigener Screen). Tablet: Liste + Detail nebeneinander. Gezeigt: „Stimme & Video".'
};

function buildScreen(devKind){
  const node = tpl.content.firstElementChild.cloneNode(true);
  node.dataset.view = state.view;
  node.classList.toggle('light', state.theme==='light');
  // reset sub-states
  node.dataset.chat = 'closed';
  node.dataset.set  = 'list';
  // sub-state interactions
  node.addEventListener('click', (e)=>{
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act==='open-drawer')  node.dataset.chat='drawer';
    if (act==='open-members') node.dataset.chat='members';
    if (act==='close-members')node.dataset.chat='closed';
    if (e.target.closest('.chat-main') && !e.target.closest('.drawer') && !e.target.closest('.memsheet') && (node.dataset.chat==='drawer'||node.dataset.chat==='members') && !act) node.dataset.chat='closed';
    const detail = e.target.closest('[data-detail]');
    if (detail) node.dataset.set='detail';
    if (act==='close-detail') node.dataset.set='list';
  });
  const frame = document.createElement('div');
  frame.className = 'device ' + devKind;
  frame.innerHTML = '<div class="notch"></div>';
  frame.appendChild(node);
  const wrap = document.createElement('div');
  wrap.className = 'devwrap';
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.innerHTML = devKind==='phone' ? 'Phone · <b>~390 dp</b> · iPhone-Klasse' : 'Tablet · <b>~820 dp</b> · iPad-Klasse';
  wrap.appendChild(frame);
  wrap.appendChild(cap);
  return wrap;
}

function render(){
  stage.innerHTML='';
  if (state.dev==='both'){ stage.appendChild(buildScreen('phone')); stage.appendChild(buildScreen('tablet')); }
  else stage.appendChild(buildScreen(state.dev));
  ctxHint.innerHTML = '<b>'+VIEW_LABEL[state.view]+'</b> — '+HINTS[state.view];
}

function wireSeg(id, key, after){
  const seg = document.getElementById(id);
  seg.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    [...seg.children].forEach(c=>c.setAttribute('aria-pressed', c===b));
    state[key] = b.dataset[key];
    if (after) after();
    render();
  });
}
wireSeg('viewSeg','view');
wireSeg('devSeg','dev');
wireSeg('themeSeg','theme', ()=>{ /* theme is per-screen via .light */ });

render();
</script>
