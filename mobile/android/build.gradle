// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Native Voice-Motor (docs/UEBERGABE-MOBILE-VOICE-NATIV.md): das
        // LiveKit-Android-SDK ist Kotlin-basiert — ein Gradle-Modul (VoiceEngine.kt),
        // der Rest des Projekts bleibt Java.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // LiveKit-SDK zieht seine AudioSwitch-Fork über JitPack (com.github.*).
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
